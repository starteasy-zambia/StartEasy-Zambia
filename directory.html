/* ============================================================

function Categories(){
  const [query,setQuery]=useState('');
  const [active,setActive]=useState(null);
  const filtered=useMemo(()=>{
    const q=query.trim().toLowerCase();
    if(!q) return CATEGORIES;
    return CATEGORIES.filter(c=>{
      const hay=(c.title+' '+c.short+' '+c.sources+' '+c.suppliers).toLowerCase();
      return hay.includes(q);
    });
  },[query]);

  return <section id="categories" style={{background:'#fff',borderTop:'1px solid rgba(10,31,18,.06)',borderBottom:'1px solid rgba(10,31,18,.06)',scrollMarginTop:80}}>
    <div style={{maxWidth:1240,margin:'0 auto',padding:'clamp(56px,7vw,80px) 24px'}}>

            Twelve categories. One directory.
          </h2>
        </div>
        <p style={{fontSize:13.5,lineHeight:1.7,color:'rgba(10,31,18,.6)',margin:0,maxWidth:'32rem'}}>

      </div>}

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
