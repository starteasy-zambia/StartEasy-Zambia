function Mark({size=38}){
  return <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,borderRadius:'50%',background:'#fff',boxShadow:'0 4px 12px -4px rgba(10,31,18,.5)',flexShrink:0}}>
    <span className="serif" style={{fontSize:size*0.5,fontWeight:800,color:'#0A1F12',lineHeight:1,letterSpacing:'-0.02em'}}>S<span style={{color:'#E8730F'}}>E</span></span>
  </span>;
}

function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{
    if(open){document.body.style.overflow='hidden';}
    else{document.body.style.overflow='';}
    return ()=>{document.body.style.overflow='';};
  },[open]);
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    if(open)window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[open,onClose]);
  if(!open) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 mf"
      style={{background:'rgba(10,31,18,0.85)',position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}
      onClick={onClose}>
      <div className="mc" onClick={e=>e.stopPropagation()}
        style={{background:'#F5FAF6',borderRadius:12,width:'100%',maxWidth:maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 30px 80px rgba(0,0,0,.35)'}}>
        <div style={{background:'#0A1F12',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10,borderBottom:'1px solid rgba(245,166,35,.15)'}}>

            {title&&<span className="hidden sm:inline" style={{fontSize:12,fontWeight:600,color:'rgba(255,255,255,.7)',marginLeft:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'20rem'}}>{title}</span>}

function SizeBadge({size}){

/* ═══════════════════════════════════════════════════════════
   DIRECTORY — Suppliers + Buyers tabs
   ═══════════════════════════════════════════════════════════ */
function Directory({suppliers,buyers,onOpenSupplier,onOpenBuyer,onRequestQuote,onRegisterBuyer,onRegisterSupplier}){
  const [tab,setTab]=useState('suppliers');
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('all');
  const [city,setCity]=useState('all');
  const [size,setSize]=useState('all');

  const cities = useMemo(()=>{
    const src = tab==='suppliers' ? suppliers : buyers;
    return ['all',...Array.from(new Set(src.map(x=>x.location))).sort()];
  },[tab,suppliers,buyers]);

  const filteredSuppliers = useMemo(()=>{
    const q=query.trim().toLowerCase();
    return suppliers.filter(s=>{
      if(category!=='all' && s.category!==category) return false;
      if(city!=='all' && s.location!==city) return false;
      if(!q) return true;
      const hay=(s.name+' '+s.location+' '+s.desc+' '+s.products.join(' ')+' '+s.moq).toLowerCase();
      return hay.includes(q);
    });
  },[suppliers,query,category,city]);

  const filteredBuyers = useMemo(()=>{
    const q=query.trim().toLowerCase();
    return buyers.filter(b=>{
      if(category!=='all' && b.category!==category) return false;
      if(city!=='all' && b.location!==city) return false;
      if(size!=='all' && b.size!==size) return false;
      if(!q) return true;
      const hay=(b.name+' '+b.location+' '+b.desc+' '+b.sources.join(' ')).toLowerCase();
      return hay.includes(q);
    });
  },[buyers,query,category,city,size]);

  const reset=()=>{setQuery('');setCategory('all');setCity('all');setSize('all');};
  const list = tab==='suppliers' ? filteredSuppliers : filteredBuyers;
  const activeCount = (category!=='all'?1:0)+(city!=='all'?1:0)+(tab==='buyers'&&size!=='all'?1:0);

  return <section id="directory" style={{background:'#F5FAF6',scrollMarginTop:80}}>
    <div style={{maxWidth:1240,margin:'0 auto',padding:'clamp(48px,6vw,72px) 24px'}}>
      <div style={{marginBottom:24}}>
        <span className="micro" style={{color:'#E8730F',display:'block',marginBottom:12,letterSpacing:'.24em'}}>Browse the directory</span>
        <h2 className="serif" style={{fontSize:'clamp(1.7rem,3.8vw,2.5rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>
          {list.length} {tab==='suppliers'?'supplier':'buyer'}{list.length===1?'':'s'} ready to {tab==='suppliers'?'quote':'connect'}
        </h2>
        <p style={{fontSize:14,lineHeight:1.65,color:'rgba(10,31,18,.6)',margin:0,maxWidth:640}}>
          {tab==='suppliers'
            ? 'Search by what you need, then open a supplier profile to see products, MOQ, delivery coverage and lead time.'
            : 'Browse registered buyers by what they source, their order frequency and business size — then connect directly.'}
        </p>
      </div>

      {/* TABS */}
      <div style={{display:'flex',gap:6,marginBottom:16,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:6}}>
        <button onClick={()=>{setTab('suppliers');setCategory('all');setSize('all');}}
          style={{flex:1,padding:'12px 16px',background:tab==='suppliers'?'#0A1F12':'transparent',color:tab==='suppliers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <i className="fas fa-truck-fast"></i> Suppliers ({suppliers.length})
        </button>
        <button onClick={()=>{setTab('buyers');setCategory('all');setSize('all');}}
          style={{flex:1,padding:'12px 16px',background:tab==='buyers'?'#E8730F':'transparent',color:tab==='buyers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <i className="fas fa-cart-shopping"></i> Buyers ({buyers.length})
        </button>
      </div>

      {/* SEARCH + FILTERS */}
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
          <div style={{position:'relative',flex:'1 1 260px',minWidth:0}}>
            <i className="fas fa-magnifying-glass" style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',color:'rgba(10,31,18,.4)',fontSize:13}}></i>
            <input value={query} onChange={e=>setQuery(e.target.value)}
              placeholder={tab==='suppliers'?'Search suppliers — cement, fabric, Kitwe…':'Search buyers — vegetables, cement, monthly…'}
              style={{...INP_STYLE,paddingLeft:40,fontSize:14}}/>
          </div>
          {(activeCount>0||query) && <button onClick={reset} style={{padding:'12px 16px',background:'none',border:'none',color:'#B8564F',fontSize:12.5,fontWeight:700,textDecoration:'underline'}}>Clear</button>}
        </div>

        <div style={{display:'grid',gap:12,marginTop:14,gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))'}}>
          <div>
            <label style={{display:'block',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',marginBottom:6}}>Category</label>
            <select value={category} onChange={e=>setCategory(e.target.value)} style={{...INP_STYLE,cursor:'pointer'}}>
              <option value="all">All categories</option>
              {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
            </select>
          </div>
          <div>
            <label style={{display:'block',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',marginBottom:6}}>City</label>
            <select value={city} onChange={e=>setCity(e.target.value)} style={{...INP_STYLE,cursor:'pointer'}}>
              {cities.map(c=><option key={c} value={c}>{c==='all'?'All cities':c}</option>)}
            </select>
          </div>
          {tab==='buyers' && <div>

        </button>
      </div> : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {tab==='suppliers'
          ? filteredSuppliers.map(s=><SupplierCard key={s.id} supplier={s} onOpen={()=>onOpenSupplier(s)} onQuote={()=>onRequestQuote(s)}/>)
          : filteredBuyers.map(b=><BuyerCard key={b.id} buyer={b} onOpen={()=>onOpenBuyer(b)}/>)}
      </div>}
    </div>
  </section>;
}

/* ═══════════════════════════════════════════════════════════
   RFQ MODAL
   ═══════════════════════════════════════════════════════════ */
function RFQModal({open,onClose,preselected}){
  const [form,setForm]=useState({name:'',business:'',phone:'',email:'',category:'',product:'',quantity:'',deliveryCity:'',deadline:'',budget:'',notes:''});
  const [err,setErr]=useState('');
  useEffect(()=>{
    if(open){
      setForm(f=>({...f,category:preselected?preselected.category:'',product:preselected?preselected.products[0]:'',business:''}));
      setErr('');
    }
  },[open,preselected]);
  const submit=()=>{
    setErr('');
    if(!form.name.trim()) return setErr('Please enter your name.');
    if(!form.phone.trim()) return setErr('Please enter your phone number.');
    if(!form.product.trim()) return setErr('Please describe what you need.');
    const msg = [
      '*STARTEASY — QUOTATION REQUEST*','',
      '*Buyer:*', `Name: ${form.name}`,
      form.business && `Business: ${form.business}`,
      `Phone: ${form.phone}`, form.email && `Email: ${form.email}`,'',
      '*Requirement:*',
      form.category && `Category: ${CAT_MAP[form.category]?.title||form.category}`,
      preselected && `Preferred supplier: ${preselected.name}`,
      `Product / service: ${form.product}`,
      form.quantity && `Quantity: ${form.quantity}`,
      form.deliveryCity && `Delivery to: ${form.deliveryCity}`,
      form.deadline && `Needed by: ${form.deadline}`,
      form.budget && `Budget range: ${form.budget}`,
      form.notes && `Notes: ${form.notes}`
    ].filter(Boolean).join('\n');
    window.open(waUrl(msg),'_blank');
    onClose();
  };
  return <Modal open={open} onClose={onClose} eyebrow="Request for quotation" maxWidth="44rem">
    <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>Request a quotation</h2>

      <span className="micro" style={{color:'#F5A623',display:'block',marginBottom:16,letterSpacing:'.26em'}}>Every connection starts with one message</span>
      <h2 className="serif" style={{fontSize:'clamp(1.9rem,4.4vw,2.9rem)',lineHeight:1.15,marginBottom:22,color:'#fff',maxWidth:'36rem',marginLeft:'auto',marginRight:'auto'}}>Buy better. Sell more.</h2>
      <p style={{fontSize:15.5,lineHeight:1.75,color:'rgba(255,255,255,.7)',maxWidth:'40rem',marginLeft:'auto',marginRight:'auto',marginBottom:32}}>

      </p>
      <div style={{display:'flex',flexWrap:'wrap',gap:14,justifyContent:'center'}}>
        <button onClick={onOpenBuyer} style={{padding:'15px 30px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:11,fontSize:14.5,fontWeight:700,display:'inline-flex',alignItems:'center',gap:10,boxShadow:'0 14px 38px -12px rgba(232,115,15,.55)'}}>

        </button>
        <button onClick={onOpenSupplier} style={{padding:'15px 30px',background:'rgba(255,255,255,.08)',color:'#fff',border:'1px solid rgba(255,255,255,.25)',borderRadius:11,fontSize:14.5,fontWeight:700,display:'inline-flex',alignItems:'center',gap:10}}>
          <i className="fas fa-truck-fast"></i> I'm a supplier

      </div>
      <div style={{marginTop:32,display:'flex',flexWrap:'wrap',justifyContent:'center',gap:20,fontSize:12,color:'rgba(255,255,255,.5)'}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:8}}><i className="fab fa-whatsapp" style={{color:'#25D366',fontSize:14}}></i> +260 762499581</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:8}}><i className="fas fa-envelope" style={{color:'#F5A623',fontSize:12}}></i> {CONTACT_EMAIL}</span>

}

      <div className="grid lg:grid-cols-[1.5fr_1fr_1fr] gap-10">

            <a href={'mailto:'+CONTACT_EMAIL} style={{color:'inherit',textDecoration:'none'}}>{CONTACT_EMAIL}</a>
            <a href={'tel:+'+ADMIN_WHATSAPP} style={{color:'inherit',textDecoration:'none'}}>+260 762499581</a>

          <strong style={{color:'rgba(255,255,255,.55)'}}>Important:</strong> StartEasy is a directory and matchmaking service. We help businesses discover suitable suppliers, compare offers and request quotations — but any transaction, contract, delivery or payment is between the buyer and the supplier. We are not a party to that transaction, and we do not guarantee supplier performance. Categories and matches are based on information provided and verified where possible; requirements and supplier availability change.
        </p>
        <p style={{fontSize:11,color:'rgba(255,255,255,.3)',margin:'20px 0 0'}}>© {new Date().getFullYear()} StartEasy Zambia · Businesses &amp; Suppliers Directory.</p>

    </div>
  </footer>;
}

function FloatingWA(){
  return <a href={waUrl('Hello StartEasy — I would like to talk about the Businesses & Suppliers Directory.')} target="_blank" rel="noopener noreferrer"
    style={{position:'fixed',bottom:24,right:24,zIndex:100,width:52,height:52,borderRadius:'50%',background:'#25D366',boxShadow:'0 6px 22px rgba(37,211,102,.45)',display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'}}

/* ═══════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════ */
function App(){
  const [localSuppliers,setLocalSuppliers]=useState(()=>readLS('se_directory_suppliers',[]));
  const [localBuyers,setLocalBuyers]=useState(()=>readLS('se_directory_buyers',[]));
  const [supplierProfile,setSupplierProfile]=useState(null);
  const [buyerProfile,setBuyerProfile]=useState(null);
  const [rfqOpen,setRfqOpen]=useState(false);
  const [rfqPreselected,setRfqPreselected]=useState(null);
  const [supplierRegOpen,setSupplierRegOpen]=useState(false);
  const [buyerRegOpen,setBuyerRegOpen]=useState(false);

  useEffect(()=>{window.scrollTo(0,0);},[]);

  const allSuppliers=useMemo(()=>[...SEED_SUPPLIERS,...localSuppliers],[localSuppliers]);
  const allBuyers=useMemo(()=>[...SEED_BUYERS,...localBuyers],[localBuyers]);
  const stats=useMemo(()=>({
    suppliers:allSuppliers.length,
    buyers:allBuyers.length,
    categories:CATEGORIES.length
  }),[allSuppliers,allBuyers]);

  const openRFQ=(supplier)=>{setRfqPreselected(supplier||null);setRfqOpen(true);};
  const closeRFQ=()=>{setRfqOpen(false);setRfqPreselected(null);};

  const handleSupplierRegistered=(s)=>{const next=[...localSuppliers,s];setLocalSuppliers(next);writeLS('se_directory_suppliers',next);};
  const handleBuyerRegistered=(b)=>{const next=[...localBuyers,b];setLocalBuyers(next);writeLS('se_directory_buyers',next);};

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    <Nav
      onOpenBuyerRegister={()=>setBuyerRegOpen(true)}
      onOpenSupplierRegister={()=>setSupplierRegOpen(true)}
      onOpenRFQ={()=>openRFQ(null)}/>
    <main style={{flex:1}}>
      <Hero onOpenBuyerRegister={()=>setBuyerRegOpen(true)} onOpenSupplierRegister={()=>setSupplierRegOpen(true)} stats={stats}/>
      <TwoSides onOpenBuyerRegister={()=>setBuyerRegOpen(true)} onOpenSupplierRegister={()=>setSupplierRegOpen(true)}/>
      <Directory
        suppliers={allSuppliers}
        buyers={allBuyers}
        onOpenSupplier={setSupplierProfile}
        onOpenBuyer={setBuyerProfile}
        onRequestQuote={openRFQ}
        onRegisterBuyer={()=>setBuyerRegOpen(true)}
        onRegisterSupplier={()=>setSupplierRegOpen(true)}/>
      <ServiceBusinesses/>
      <Roles/>
      <ClosingCTA onOpenBuyer={()=>setBuyerRegOpen(true)} onOpenSupplier={()=>setSupplierRegOpen(true)}/>
    </main>
    <Footer/>
    <FloatingWA/>

    <SupplierProfile supplier={supplierProfile} onClose={()=>setSupplierProfile(null)} onQuote={(s)=>{setSupplierProfile(null);openRFQ(s);}}/>
    <BuyerProfile buyer={buyerProfile} onClose={()=>setBuyerProfile(null)}/>
    <RFQModal open={rfqOpen} onClose={closeRFQ} preselected={rfqPreselected}/>
    <RegisterSupplierModal open={supplierRegOpen} onClose={()=>setSupplierRegOpen(false)} onRegistered={handleSupplierRegistered}/>
    <RegisterBuyerModal open={buyerRegOpen} onClose={()=>setBuyerRegOpen(false)} onRegistered={handleBuyerRegistered}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
