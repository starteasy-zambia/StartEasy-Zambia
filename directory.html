function isMobile(){return typeof navigator!=='undefined'&&/android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent||'').toLowerCase());}
function waUrl(msg,p){const phone=p||ADMIN_WHATSAPP;const e=encodeURIComponent(msg);return isMobile()?'whatsapp://send?phone='+phone+'&text='+e:'https://wa.me/'+phone+'?text='+e;}
function readLS(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function writeLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function splitCSV(str){return (str||'').split(',').map(s=>s.trim()).filter(Boolean);}
function authErrorMessage(e){
  const code=(e&&e.code)||'';
  if(code==='auth/email-already-in-use') return 'This email is already registered. Try signing in instead.';
  if(code==='auth/invalid-email') return 'That email address is not valid.';
  if(code==='auth/weak-password') return 'Password must be at least 6 characters.';
  if(code==='auth/wrong-password'||code==='auth/invalid-credential') return 'Incorrect email or password.';
  if(code==='auth/user-not-found') return 'No account with that email.';
  if(code==='auth/too-many-requests') return 'Too many attempts. Wait a minute and try again.';
  if(code==='auth/network-request-failed') return 'Network error. Check your connection.';
  if(code==='auth/operation-not-allowed') return 'Email sign-in is not enabled. Enable it in Firebase Console.';
  return 'Sign-in failed: '+(code||(e&&e.message)||'unknown');
}

async function fsLoadDirectory(){
  if(!firebaseReady) return null;
  try{
    const [s,b]=await Promise.all([db.collection('se_suppliers').get(),db.collection('se_buyers').get()]);
    return {suppliers:s.docs.map(d=>({id:d.id,...d.data()})),buyers:b.docs.map(d=>({id:d.id,...d.data()}))};
  }catch(e){console.warn('[SE] directory load failed:',e&&e.message);return null;}
}
async function fsSubmitLead(lead){
  if(!firebaseReady) return false;
  try{await db.collection('se_leads').add({...lead,at:Date.now()});return true;}
  catch(e){console.warn('[SE] lead submit failed:',e&&e.message);return false;}
}
async function loadUserProfile(uid){
  if(!firebaseReady) return null;
  try{
    const snap=await db.collection('se_users').doc(uid).get();
    return snap.exists?snap.data():null;
  }catch(e){console.warn('[SE] profile load failed:',e&&e.message);return null;}
}
async function authSignUp(form){
  if(!firebaseReady) throw new Error('Firebase not ready');
  const {email,password}=form;
  const cred=await auth.createUserWithEmailAndPassword(email,password);
  const profile={
    name:form.name,businessName:form.businessName,phone:form.phone,email,
    role:form.role,category:form.category,location:form.location,
    status:'pending',createdAt:Date.now()
  };
  if(form.role==='supplier'){
    profile.products=splitCSV(form.products);
    profile.moq=form.moq||'Contact supplier';
    profile.delivery=form.delivery||'Contact supplier';
    profile.leadTime=form.leadTime||'Contact supplier';
  }
  if(form.role==='buyer'){
    profile.sources=splitCSV(form.sources);
    profile.frequency=form.frequency||'Monthly';
    profile.orderValue=form.orderValue||'Contact buyer';
  }
  await db.collection('se_users').doc(cred.user.uid).set(profile);
  await fsSubmitLead({...profile,kind:form.role});
  return cred.user;
}
async function authSignIn(email,password){
  if(!firebaseReady) throw new Error('Firebase not ready');
  return auth.signInWithEmailAndPassword(email,password);
}
async function authSignOutFn(){ try{ await auth.signOut(); }catch(e){} }

const ZAMBIAN_CITIES = ['Lusaka','Kitwe','Ndola','Livingstone','Kabwe','Chingola','Mufulira','Solwezi','Chipata','Choma','Mazabuka','Kasama','Mongu','Chongwe','Kafue'];

/* ═══════════════════════════════════════════════════════════
   SHARED COMPONENTS
   ═══════════════════════════════════════════════════════════ */
function Mark({size=38}){
  return <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,borderRadius:'50%',background:'#fff',boxShadow:'0 4px 12px -4px rgba(10,31,18,.5)',flexShrink:0}}>
    <span className="serif" style={{fontSize:size*0.5,fontWeight:800,color:'#0A1F12',lineHeight:1,letterSpacing:'-0.02em'}}>S<span style={{color:'#E8730F'}}>E</span></span>
  </span>;
}
function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{
    if(open){document.body.style.overflow='hidden';}
    else{document.body.style.overflow='';}
    return ()=>{document.body.style.overflow='';};
  },[open]);
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    if(open)window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[open,onClose]);
  if(!open) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 mf"
      style={{background:'rgba(10,31,18,0.85)',position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}
      onClick={onClose}>
      <div className="mc" onClick={e=>e.stopPropagation()}
        style={{background:'#F5FAF6',borderRadius:12,width:'100%',maxWidth:maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 30px 80px rgba(0,0,0,.35)'}}>
        <div style={{background:'#0A1F12',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10,borderBottom:'1px solid rgba(245,166,35,.15)'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}></span>
            <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{eyebrow||'StartEasy'}</span>
            {title&&<span className="hidden sm:inline" style={{fontSize:12,fontWeight:600,color:'rgba(255,255,255,.7)',marginLeft:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'20rem'}}>{title}</span>}
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.6)',cursor:'pointer',padding:6,fontSize:16}} aria-label="Close"><i className="fas fa-times"></i></button>
        </div>
        <div style={{padding:'24px 28px'}}>{children}</div>
      </div>
    </div>,
    document.body
  );
}
const INP_STYLE = {width:'100%',background:'#fff',border:'1.5px solid rgba(10,31,18,.15)',borderRadius:9,padding:'12px 14px',fontSize:13.5,color:'#0A1F12',fontFamily:'inherit'};
function TIn({value,onChange,placeholder,type='text'}){
  return <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={INP_STYLE}/>;
}
function SizeBadge({size}){
  if(!size) return null;
  const c=SIZE_COLORS[size]||'#0A1F12';
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,background:c+'12',color:c,border:'1px solid '+c+'33',padding:'2px 8px',borderRadius:99,fontSize:10,fontWeight:800,letterSpacing:'.04em',textTransform:'uppercase'}}><i className="fas fa-building" style={{fontSize:8}}></i>{size}</span>;
}
function StatusBadge({established,since}){
  if(established===undefined) return null;
  return established
    ? <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(30,123,60,.1)',color:'#0F5C2A',border:'1px solid rgba(30,123,60,.28)',padding:'2px 8px',borderRadius:99,fontSize:10,fontWeight:800,letterSpacing:'.04em',textTransform:'uppercase'}}><i className="fas fa-check" style={{fontSize:8}}></i>Established{since?` · ${since}`:''}</span>
    : <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(232,115,15,.1)',color:'#8A6828',border:'1px solid rgba(232,115,15,.3)',padding:'2px 8px',borderRadius:99,fontSize:10,fontWeight:800,letterSpacing:'.04em',textTransform:'uppercase'}}><i className="fas fa-seedling" style={{fontSize:8}}></i>New{since?` · ${since}`:''}</span>;
}

/* ═══════════════════════════════════════════════════════════
   AUTH MODAL — signup + signin in one
   ═══════════════════════════════════════════════════════════ */
function AuthModal({open,initialMode='signup',initialRole='buyer',onClose,onAuthSuccess}){
  const [mode,setMode]=useState(initialMode);
  const [role,setRole]=useState(initialRole);
  const [err,setErr]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [form,setForm]=useState({name:'',businessName:'',email:'',phone:'',password:'',category:'',location:'',products:'',moq:'',delivery:'',leadTime:'',sources:'',frequency:'Monthly',orderValue:''});

  useEffect(()=>{
    if(open){setMode(initialMode);setRole(initialRole);setErr('');}
  },[open,initialMode,initialRole]);

  const submit=async()=>{
    setErr('');
    if(mode==='signin'){
      if(!form.email.trim()) return setErr('Enter your email.');
      if(!form.password) return setErr('Enter your password.');
      setSubmitting(true);
      try{
        await authSignIn(form.email.trim(),form.password);
        onAuthSuccess && onAuthSuccess();
        onClose();
      }catch(e){setErr(authErrorMessage(e));}
      finally{setSubmitting(false);}
      return;
    }
    // signup validation
    if(!form.name.trim()) return setErr('Enter your full name.');
    if(!form.businessName.trim()) return setErr('Enter your business name.');
    if(!form.email.trim()) return setErr('Enter your email.');
    if(!form.phone.trim()) return setErr('Enter your phone / WhatsApp.');
    if(!form.category) return setErr('Choose a category.');
    if(!form.location) return setErr('Choose a location.');
    if(form.password.length<6) return setErr('Password must be at least 6 characters.');
    if(role==='supplier' && !form.products.trim()) return setErr('List the products you supply.');
    if(role==='buyer' && !form.sources.trim()) return setErr('List what you buy regularly.');

    setSubmitting(true);
    try{
      await authSignUp({...form,role});
      onAuthSuccess && onAuthSuccess();
      onClose();
    }catch(e){setErr(authErrorMessage(e));}
    finally{setSubmitting(false);}
  };

  return <Modal open={open} onClose={onClose} eyebrow={mode==='signin'?'Welcome back':'Create your account'} maxWidth="40rem">
    <div style={{display:'flex',gap:6,marginBottom:18,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:5}}>
      <button onClick={()=>{setMode('signup');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signup'?'#0A1F12':'transparent',color:mode==='signup'?'#fff':'rgba(10,31,18,.65)'}}>Create account</button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signin'?'#0A1F12':'transparent',color:mode==='signin'?'#fff':'rgba(10,31,18,.65)'}}>Sign in</button>
    </div>

    {mode==='signup' && <>
      <div style={{marginBottom:16}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:8}}>I am registering as a…</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <button onClick={()=>setRole('buyer')} style={{padding:'14px 12px',border:role==='buyer'?'2px solid #E8730F':'2px solid rgba(10,31,18,.1)',background:role==='buyer'?'rgba(232,115,15,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-cart-shopping" style={{color:'#E8730F',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Buyer</strong></span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I need to source products</div>
          </button>
          <button onClick={()=>setRole('supplier')} style={{padding:'14px 12px',border:role==='supplier'?'2px solid #1B6CA8':'2px solid rgba(10,31,18,.1)',background:role==='supplier'?'rgba(27,108,168,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-truck-fast" style={{color:'#1B6CA8',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Supplier</strong></span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I want to sell more</div>
          </button>
        </div>
      </div>

      <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',marginBottom:14}}>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Full name *</label><TIn value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="Your name"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business name *</label><TIn value={form.businessName} onChange={v=>setForm({...form,businessName:v})} placeholder="Business name"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email *</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@business.zm"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone / WhatsApp *</label><TIn value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+260 …"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Category *</label>
          <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            <option value="">Choose</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
        </div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>City *</label>
          <select value={form.location} onChange={e=>setForm({...form,location:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            <option value="">Choose</option>
            {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      {role==='supplier' && <div style={{background:'rgba(27,108,168,.04)',border:'1px dashed rgba(27,108,168,.25)',borderRadius:10,padding:'14px 16px',marginBottom:14}}>
        <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#1B6CA8',marginBottom:10}}>What you supply</div>
        <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Products / services * (comma-separated)</label><TIn value={form.products} onChange={v=>setForm({...form,products:v})} placeholder="e.g. Fabric rolls, uniform fabric"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Minimum order</label><TIn value={form.moq} onChange={v=>setForm({...form,moq:v})} placeholder="e.g. 50 metres"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Lead time</label><TIn value={form.leadTime} onChange={v=>setForm({...form,leadTime:v})} placeholder="e.g. 3–5 days"/></div>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Delivery coverage</label><TIn value={form.delivery} onChange={v=>setForm({...form,delivery:v})} placeholder="e.g. Lusaka · Copperbelt"/></div>
        </div>
      </div>}

      {role==='buyer' && <div style={{background:'rgba(232,115,15,.04)',border:'1px dashed rgba(232,115,15,.25)',borderRadius:10,padding:'14px 16px',marginBottom:14}}>
        <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>What you buy</div>
        <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>What you buy regularly * (comma-separated)</label><TIn value={form.sources} onChange={v=>setForm({...form,sources:v})} placeholder="e.g. Fresh vegetables, chicken, packaging"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Frequency</label>
            <select value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
              {FREQUENCY_OPTIONS.map(f=><option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Typical order</label><TIn value={form.orderValue} onChange={v=>setForm({...form,orderValue:v})} placeholder="e.g. K2,000–K5,000/mo"/></div>
        </div>
      </div>}

      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Password * <span style={{color:'rgba(10,31,18,.5)',fontWeight:500}}>(min 6 characters)</span></label><TIn type="password" value={form.password} onChange={v=>setForm({...form,password:v})} placeholder="••••••••"/></div>
    </>}

    {mode==='signin' && <>
      <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 16px'}}>Sign in to your StartEasy account to reach your dashboard.</p>
      <div style={{marginBottom:14}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@business.zm"/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Password</label><TIn type="password" value={form.password} onChange={v=>setForm({...form,password:v})} placeholder="••••••••"/></div>
    </>}

    {err && <div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5,display:'flex',gap:8,alignItems:'center'}}><i className="fas fa-circle-exclamation"></i> {err}</div>}

    <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px 24px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:9}}>
      {submitting ? <><i className="fas fa-spinner fa-spin"></i> Please wait…</> : (mode==='signin' ? 'Sign in' : 'Create my account')}
    </button>
    <p style={{fontSize:11.5,color:'rgba(10,31,18,.5)',lineHeight:1.6,marginTop:12,textAlign:'center',fontStyle:'italic'}}>
      {mode==='signin' ? 'New to StartEasy?' : 'Already have an account?'}{' '}
      <button onClick={()=>{setMode(mode==='signin'?'signup':'signin');setErr('');}} style={{background:'none',border:'none',color:'#E8730F',fontWeight:700,cursor:'pointer',textDecoration:'underline',fontSize:'inherit',padding:0,fontFamily:'inherit'}}>{mode==='signin'?'Create an account':'Sign in'}</button>
    </p>
  </Modal>;
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
function Dashboard({user,onBrowse,onSignedOut}){
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);
  const [matches,setMatches]=useState([]);

  useEffect(()=>{
    if(!user){setLoading(false);return;}
    loadUserProfile(user.uid).then(p=>{setProfile(p);setLoading(false);});
  },[user]);

  useEffect(()=>{
    if(!profile) return;
    const isSupplier=profile.role==='supplier';
    const coll=isSupplier?'se_buyers':'se_suppliers';
    const seeds=isSupplier?SEED_BUYERS:SEED_SUPPLIERS;
    const filterSeed=()=>setMatches(seeds.filter(x=>x.category===profile.category).slice(0,6));
    if(!firebaseReady){filterSeed();return;}
    db.collection(coll).where('category','==',profile.category).limit(6).get()
      .then(snap=>{
        if(snap.empty) filterSeed();
        else setMatches(snap.docs.map(d=>({id:d.id,...d.data()})));
      })
      .catch(()=>filterSeed());
  },[profile]);

  const signOut=async()=>{ await authSignOutFn(); onSignedOut && onSignedOut(); };

  if(loading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;

  if(!profile) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6',padding:'32px 20px',textAlign:'center'}}>
    <div style={{maxWidth:400}}>
      <h2 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Profile not found</h2>
      <p style={{fontSize:13.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:20}}>Your account exists but we couldn't find your profile record. Please contact us at {CONTACT_EMAIL}.</p>
      <button onClick={signOut} style={{padding:'12px 22px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13.5,fontWeight:700}}>Sign out</button>
    </div>
  </div>;

  const isSupplier=profile.role==='supplier';
  const cat=CAT_MAP[profile.category]||{title:profile.category||'General',color:'#E8730F',icon:'fa-building'};
  const isVerified=profile.status==='verified';

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6'}}>
    <header style={{background:'#0A1F12',color:'#fff',padding:'18px 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>

/* ═══════════════════════════════════════════════════════════
   DIRECTORY
   ═══════════════════════════════════════════════════════════ */
function Directory({suppliers,buyers,onOpenSupplier,onOpenBuyer,onRequestQuote}){
  const [tab,setTab]=useState('suppliers');
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('all');
  const [city,setCity]=useState('all');
  const [size,setSize]=useState('all');
  const cities=useMemo(()=>{const src=tab==='suppliers'?suppliers:buyers;return ['all',...Array.from(new Set(src.map(x=>x.location))).sort()];},[tab,suppliers,buyers]);
  const filteredSuppliers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return suppliers.filter(s=>{
      if(category!=='all'&&s.category!==category) return false;
      if(city!=='all'&&s.location!==city) return false;
      if(!q) return true;
      return (s.name+' '+s.location+' '+s.desc+' '+(s.products||[]).join(' ')+' '+s.moq).toLowerCase().includes(q);
    });
  },[suppliers,query,category,city]);
  const filteredBuyers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return buyers.filter(b=>{
      if(category!=='all'&&b.category!==category) return false;
      if(city!=='all'&&b.location!==city) return false;
      if(size!=='all'&&b.size!==size) return false;
      if(!q) return true;
      return (b.name+' '+b.location+' '+b.desc+' '+(b.sources||[]).join(' ')).toLowerCase().includes(q);
    });
  },[buyers,query,category,city,size]);
  const reset=()=>{setQuery('');setCategory('all');setCity('all');setSize('all');};
  const list=tab==='suppliers'?filteredSuppliers:filteredBuyers;
  const activeCount=(category!=='all'?1:0)+(city!=='all'?1:0)+(tab==='buyers'&&size!=='all'?1:0);
  return <section id="directory" style={{background:'#F5FAF6',scrollMarginTop:80}}>
    <div style={{maxWidth:1240,margin:'0 auto',padding:'clamp(48px,6vw,72px) 24px'}}>
      <div style={{marginBottom:24}}>
        <span className="micro" style={{color:'#E8730F',display:'block',marginBottom:12,letterSpacing:'.24em'}}>Browse the directory</span>
        <h2 className="serif" style={{fontSize:'clamp(1.7rem,3.8vw,2.5rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>{list.length} {tab==='suppliers'?'supplier':'buyer'}{list.length===1?'':'s'} ready to {tab==='suppliers'?'quote':'connect'}</h2>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:6}}>
        <button onClick={()=>{setTab('suppliers');setCategory('all');setSize('all');}} style={{flex:1,padding:'12px 16px',background:tab==='suppliers'?'#0A1F12':'transparent',color:tab==='suppliers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <i className="fas fa-truck-fast"></i> Suppliers ({suppliers.length})
        </button>
        <button onClick={()=>{setTab('buyers');setCategory('all');setSize('all');}} style={{flex:1,padding:'12px 16px',background:tab==='buyers'?'#E8730F':'transparent',color:tab==='buyers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <i className="fas fa-cart-shopping"></i> Buyers ({buyers.length})
        </button>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>

function RFQModal({open,onClose,preselected}){
  const [form,setForm]=useState({name:'',business:'',phone:'',email:'',category:'',product:'',quantity:'',deliveryCity:'',deadline:'',budget:'',notes:''});
  const [err,setErr]=useState('');
  useEffect(()=>{
    if(open){
      setForm(f=>({...f,category:preselected?preselected.category:'',product:preselected?(preselected.products||[])[0]||'':'',business:''}));
      setErr('');
    }
  },[open,preselected]);
  const submit=()=>{
    setErr('');
    if(!form.name.trim()) return setErr('Enter your name.');
    if(!form.phone.trim()) return setErr('Enter your phone number.');
    if(!form.product.trim()) return setErr('Describe what you need.');
    const msg=['*STARTEASY — QUOTATION REQUEST*','','*Buyer:*',`Name: ${form.name}`,form.business&&`Business: ${form.business}`,`Phone: ${form.phone}`,form.email&&`Email: ${form.email}`,'','*Requirement:*',form.category&&`Category: ${CAT_MAP[form.category]?.title||form.category}`,preselected&&`Preferred supplier: ${preselected.name}`,`Product: ${form.product}`,form.quantity&&`Quantity: ${form.quantity}`,form.deliveryCity&&`Delivery to: ${form.deliveryCity}`,form.deadline&&`Needed by: ${form.deadline}`,form.budget&&`Budget: ${form.budget}`,form.notes&&`Notes: ${form.notes}`].filter(Boolean).join('\n');
    window.open(waUrl(msg),'_blank');
    onClose();
  };
  return <Modal open={open} onClose={onClose} eyebrow="Request for quotation" maxWidth="44rem">
    <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>Request a quotation</h2>
    <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 20px'}}>Tell us what you need. StartEasy matches you with suitable suppliers.{preselected&&<span style={{display:'block',marginTop:8,color:'#8A6828',fontWeight:600}}><i className="fas fa-info-circle"></i> Requesting from {preselected.name}</span>}</p>
    <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}}>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Your name *</label><TIn value={form.name} onChange={v=>setForm({...form,name:v})}/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business name</label><TIn value={form.business} onChange={v=>setForm({...form,business:v})}/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone *</label><TIn value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+260 …"/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label><TIn value={form.email} onChange={v=>setForm({...form,email:v})}/></div>
    </div>

/* ═══════════════════════════════════════════════════════════
   PUBLIC DIRECTORY VIEW
   ═══════════════════════════════════════════════════════════ */
function DirectoryView({user,authOpen,authMode,authRole,onOpenAuth,onCloseAuth,onSignedOut,onDashboard}){
  const [localSuppliers]=useState(()=>readLS('se_directory_suppliers',[]));
  const [localBuyers]=useState(()=>readLS('se_directory_buyers',[]));
  const [remoteSuppliers,setRemoteSuppliers]=useState(null);
  const [remoteBuyers,setRemoteBuyers]=useState(null);
  const [supplierProfile,setSupplierProfile]=useState(null);
  const [buyerProfile,setBuyerProfile]=useState(null);
  const [rfqOpen,setRfqOpen]=useState(false);
  const [rfqPreselected,setRfqPreselected]=useState(null);

  useEffect(()=>{window.scrollTo(0,0);},[]);

  useEffect(()=>{
    let cancelled=false;
    const attempt=()=>{
      if(!firebaseReady){setTimeout(attempt,400);return;}
      fsLoadDirectory().then(res=>{
        if(cancelled) return;
        if(res&&(res.suppliers.length||res.buyers.length)){
          setRemoteSuppliers(res.suppliers);
          setRemoteBuyers(res.buyers);
        }
      });
    };
    attempt();
    return ()=>{cancelled=true;};
  },[]);

  const baseSuppliers=remoteSuppliers!==null?remoteSuppliers:SEED_SUPPLIERS;
  const baseBuyers=remoteBuyers!==null?remoteBuyers:SEED_BUYERS;
  const allSuppliers=useMemo(()=>[...baseSuppliers,...localSuppliers],[baseSuppliers,localSuppliers]);
  const allBuyers=useMemo(()=>[...baseBuyers,...localBuyers],[baseBuyers,localBuyers]);
  const stats=useMemo(()=>({suppliers:allSuppliers.length,buyers:allBuyers.length,categories:CATEGORIES.length}),[allSuppliers,allBuyers]);

  const openRFQ=(supplier)=>{setRfqPreselected(supplier||null);setRfqOpen(true);};
  const closeRFQ=()=>{setRfqOpen(false);setRfqPreselected(null);};

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    <Nav user={user} onSignIn={()=>onOpenAuth('signin','buyer')} onSignUp={(role)=>onOpenAuth('signup',role||'buyer')} onDashboard={onDashboard}/>
    <main style={{flex:1}}>
      <Hero user={user} stats={stats}/>
      <HeroCTA user={user} onSignup={(role)=>onOpenAuth('signup',role)} onSignin={()=>onOpenAuth('signin','buyer')} onDashboard={onDashboard}/>
      <TwoSides/>
      <Directory suppliers={allSuppliers} buyers={allBuyers} onOpenSupplier={setSupplierProfile} onOpenBuyer={setBuyerProfile} onRequestQuote={openRFQ}/>
      <ServiceBusinesses/>
      <Roles/>
    </main>
    <Footer/>
    <FloatingWA/>
    <SupplierProfile supplier={supplierProfile} onClose={()=>setSupplierProfile(null)} onQuote={(s)=>{setSupplierProfile(null);openRFQ(s);}}/>
    <BuyerProfile buyer={buyerProfile} onClose={()=>setBuyerProfile(null)}/>
    <RFQModal open={rfqOpen} onClose={closeRFQ} preselected={rfqPreselected}/>
    <AuthModal open={authOpen} initialMode={authMode} initialRole={authRole} onClose={onCloseAuth} onAuthSuccess={()=>{onCloseAuth();window.location.hash='#dashboard';}}/>
  </div>;
}

/* ═══════════════════════════════════════════════════════════
   EMBEDDED SEED VIEW
   ═══════════════════════════════════════════════════════════ */
function SeedView(){
  const [user,setUser]=useState(null);
  const [isAdmin,setIsAdmin]=useState(false);
  const [checking,setChecking]=useState(true);
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [signingIn,setSigningIn]=useState(false);
  const [err,setErr]=useState('');
  const [status,setStatus]=useState(null);
  const [seeding,setSeeding]=useState(false);
  const [counts,setCounts]=useState({sup:null,buy:null});

  const loadCounts=async()=>{
    if(!firebaseReady) return;
    try{const [s,b]=await Promise.all([db.collection('se_suppliers').get(),db.collection('se_buyers').get()]);setCounts({sup:s.size,buy:b.size});}
    catch(e){setCounts({sup:'?',buy:'?'});}
  };
  useEffect(()=>{
    if(!firebaseReady) return;
    const unsub=auth.onAuthStateChanged(async u=>{
      setUser(u);setIsAdmin(false);
      if(u&&u.email&&u.providerData&&u.providerData.length){
        try{const snap=await db.collection('se_admins').doc(u.uid).get();setIsAdmin(snap.exists);if(snap.exists) loadCounts();}
        catch(e){console.warn('[SE] admin check:',e.message);}
      }
      setChecking(false);
    });
    return unsub;
  },[]);
  const handleSignIn=async()=>{
    setErr('');
    if(!email.trim()||!pw){setErr('Enter email and password.');return;}
    setSigningIn(true);
    try{await auth.signInWithEmailAndPassword(email.trim(),pw);}
    catch(e){setErr(authErrorMessage(e));}
    finally{setSigningIn(false);}
  };
  const handleSignOut=async()=>{await auth.signOut();setEmail('');setPw('');setStatus(null);};
  const handleSeed=async()=>{
    if(!isAdmin){setStatus({kind:'err',msg:'Only admins can seed.'});return;}
    setSeeding(true);setStatus({kind:'info',msg:'Seeding…'});
    try{
      const batch=db.batch();
      SEED_SUPPLIERS.forEach(s=>batch.set(db.collection('se_suppliers').doc(s.id),s));
      SEED_BUYERS.forEach(b=>batch.set(db.collection('se_buyers').doc(b.id),b));
      await batch.commit();
      setStatus({kind:'ok',msg:'✅ Done. '+SEED_SUPPLIERS.length+' suppliers and '+SEED_BUYERS.length+' buyers written.'});
      loadCounts();
    }catch(e){setStatus({kind:'err',msg:'Failed: '+(e.code||e.message)});}
    finally{setSeeding(false);}
  };
  const statusBg=status?(status.kind==='ok'?{bg:'rgba(30,123,60,.1)',border:'1px solid rgba(30,123,60,.3)',color:'#0F5C2A'}:status.kind==='err'?{bg:'rgba(184,86,79,.1)',border:'1px solid rgba(184,86,79,.3)',color:'#7C2318'}:{bg:'rgba(27,108,168,.08)',border:'1px solid rgba(27,108,168,.25)',color:'#1B4C7A'}):null;
  return <div style={{minHeight:'100vh',background:'#F5FAF6',padding:'32px 20px'}}>
    <div style={{maxWidth:560,margin:'0 auto',background:'#fff',border:'1px solid rgba(10,31,18,.1)',borderRadius:14,padding:'28px',boxShadow:'0 20px 50px rgba(0,0,0,.06)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>
        <Mark size={42}/>
        <div><div style={{fontSize:9,textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.4)'}}>StartEasy Directory</div><div className="serif" style={{fontSize:20,fontWeight:800,color:'#0A1F12'}}>Seed panel</div></div>
      </div>
      {checking?<div style={{textAlign:'center',padding:'24px 0',color:'rgba(10,31,18,.5)'}}><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Checking auth…</div>:
      !user||!user.email?<>
        <p style={{fontSize:13,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 18px'}}>Sign in with your Firebase admin account.</p>
        <label style={{display:'block',fontSize:12,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Admin email</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...INP_STYLE,marginBottom:12}}/>
        <label style={{display:'block',fontSize:12,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Password</label>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} style={{...INP_STYLE,marginBottom:14}} onKeyDown={e=>{if(e.key==='Enter')handleSignIn();}}/>
        <button onClick={handleSignIn} disabled={signingIn} style={{width:'100%',padding:'13px',background:signingIn?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:14,fontWeight:700,cursor:signingIn?'wait':'pointer',marginBottom:10}}>{signingIn?'Signing in…':'Sign in'}</button>
        <a href="#" onClick={e=>{e.preventDefault();window.location.hash='';window.location.reload();}} style={{display:'block',textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.5)',textDecoration:'none',padding:'8px'}}>← Back to directory</a>
        {err&&<div style={{background:'rgba(184,86,79,.1)',border:'1px solid rgba(184,86,79,.3)',borderRadius:9,padding:'10px 14px',fontSize:12.5,color:'#7C2318',marginTop:12}}>{err}</div>}
      </>:
      !isAdmin?<>
        <div style={{background:'rgba(184,86,79,.1)',border:'1px solid rgba(184,86,79,.3)',borderRadius:9,padding:'12px 14px',fontSize:13,color:'#7C2318',marginBottom:16}}>Signed in as <strong>{user.email}</strong> but not in <code>se_admins</code>.</div>
        <button onClick={handleSignOut} style={{width:'100%',padding:'12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700}}>Sign out</button>
      </>:<>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}><i className="fas fa-circle-check" style={{color:'#1E7B3C'}}></i><span style={{fontSize:13,color:'rgba(10,31,18,.7)'}}>{user.email}</span></div>
        <div style={{background:'#F5FAF6',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:'14px 16px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>Suppliers in payload</span><strong>{SEED_SUPPLIERS.length}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>Buyers in payload</span><strong>{SEED_BUYERS.length}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>In se_suppliers</span><strong>{counts.sup===null?'—':counts.sup}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0'}}><span>In se_buyers</span><strong>{counts.buy===null?'—':counts.buy}</strong></div>
        </div>
        <button onClick={handleSeed} disabled={seeding} style={{width:'100%',padding:'13px',background:seeding?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:14,fontWeight:700,cursor:seeding?'wait':'pointer',marginBottom:10}}>{seeding?'Seeding…':'Seed directory'}</button>
        <button onClick={handleSignOut} style={{width:'100%',padding:'11px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700,marginBottom:10}}>Sign out</button>
        <a href="#" onClick={e=>{e.preventDefault();window.location.hash='';window.location.reload();}} style={{display:'block',textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.5)',textDecoration:'none',padding:'8px'}}>← Back to directory</a>
        {status&&<div style={{background:statusBg.bg,border:statusBg.border,color:statusBg.color,borderRadius:9,padding:'12px 14px',fontSize:12.5,lineHeight:1.6,marginTop:16}}>{status.msg}</div>}
      </>}
    </div>
  </div>;
}

/* ═══════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════ */
function App(){
  const [hash,setHash]=useState(()=>window.location.hash);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [authOpen,setAuthOpen]=useState(false);
  const [authMode,setAuthMode]=useState('signup');
  const [authRole,setAuthRole]=useState('buyer');

  useEffect(()=>{
    if(!firebaseReady){setAuthLoading(false);return;}
    const unsub=auth.onAuthStateChanged(u=>{
      setUser(u&&u.email?u:null);
      setAuthLoading(false);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const onHash=()=>setHash(window.location.hash);
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);

  const openAuth=(mode,role)=>{
    setAuthMode(mode||'signup');
    setAuthRole(role||'buyer');
    setAuthOpen(true);
  };
  const closeAuth=()=>setAuthOpen(false);
  const goDashboard=()=>{window.location.hash='#dashboard';};

  if(hash==='#seed') return <SeedView/>;

  if(hash==='#dashboard'){
    if(authLoading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;
    if(!user){
      return <div style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',alignItems:'center',justifyContent:'center',padding:'32px 20px'}}>
        <div style={{maxWidth:420,textAlign:'center',background:'#fff',border:'1px solid rgba(10,31,18,.1)',borderRadius:14,padding:'32px 28px',boxShadow:'0 10px 30px rgba(0,0,0,.06)'}}>
          <i className="fas fa-lock" style={{fontSize:32,color:'#E8730F',marginBottom:14,display:'block'}}></i>
          <h2 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Please sign in</h2>
          <p style={{fontSize:13.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:22}}>You need to be signed in to access your dashboard.</p>
          <button onClick={()=>openAuth('signin','buyer')} style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:14,fontWeight:700,marginBottom:10}}>Sign in</button>
          <button onClick={()=>{window.location.hash='';window.location.reload();}} style={{width:'100%',padding:'11px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:9,fontSize:13,fontWeight:600,color:'#0A1F12'}}>Go to home</button>
          <AuthModal open={authOpen} initialMode={authMode} initialRole={authRole} onClose={closeAuth} onAuthSuccess={()=>{closeAuth();}}/>
        </div>
      </div>;
    }
    return <>
      <Dashboard user={user} onBrowse={()=>{window.location.hash='';}} onSignedOut={()=>{setUser(null);window.location.hash='';}}/>
      <AuthModal open={authOpen} initialMode={authMode} initialRole={authRole} onClose={closeAuth} onAuthSuccess={()=>{closeAuth();}}/>
    </>;
  }

  return <>
    <DirectoryView user={user} authOpen={authOpen} authMode={authMode} authRole={authRole} onOpenAuth={openAuth} onCloseAuth={closeAuth} onSignedOut={()=>{setUser(null);window.location.hash='';}} onDashboard={goDashboard}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
