function isMobile(){return typeof navigator!=='undefined'&&/android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent||'').toLowerCase());}
function waUrl(msg,p){const phone=p||ADMIN_WHATSAPP;const e=encodeURIComponent(msg);return isMobile()?'whatsapp://send?phone='+phone+'&text='+e:'https://wa.me/'+phone+'?text='+e;}
function splitCSV(str){return (str||'').split(',').map(s=>s.trim()).filter(Boolean);}
function authErrorMessage(e){
  const code=(e&&e.code)||'';
  if(code==='auth/email-already-in-use') return 'This email is already registered. Try signing in.';
  if(code==='auth/invalid-email') return 'That email address is not valid.';
  if(code==='auth/weak-password') return 'Password must be at least 6 characters.';
  if(code==='auth/wrong-password'||code==='auth/invalid-credential') return 'Incorrect email or password.';
  if(code==='auth/user-not-found') return 'No account with that email.';
  if(code==='auth/too-many-requests') return 'Too many attempts. Try again in a minute.';
  if(code==='auth/network-request-failed') return 'Network error.';
  if(code==='auth/operation-not-allowed') return 'Email sign-in is not enabled in Firebase Console.';
  if(code==='auth/missing-email') return 'Enter your email address.';
  return 'Sign-in failed: '+(code||(e&&e.message)||'unknown');
}

async function fsLoadDirectory(){
  if(!firebaseReady) return null;
  try{
    const [s,b]=await Promise.all([db.collection('se_suppliers').get(),db.collection('se_buyers').get()]);
    return {suppliers:s.docs.map(d=>({id:d.id,...d.data()})),buyers:b.docs.map(d=>({id:d.id,...d.data()}))};
  }catch(e){console.warn('[SE] load dir:',e&&e.message);return null;}
}
async function loadUserProfile(uid){
  if(!firebaseReady) return null;
  try{const snap=await db.collection('se_users').doc(uid).get();return snap.exists?snap.data():null;}
  catch(e){console.warn('[SE] load profile:',e&&e.message);return null;}
}
async function loadUserQuotes(uid){
  if(!firebaseReady) return [];
  try{
    const snap=await db.collection('se_quotes').where('userId','==',uid).get();
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    return docs.sort((a,b)=>(b.at||0)-(a.at||0));
  }catch(e){console.warn('[SE] load quotes:',e&&e.message);return [];}
}
async function saveQuote(quote){
  if(!firebaseReady) return false;
  try{await db.collection('se_quotes').add(quote);return true;}
  catch(e){console.warn('[SE] save quote:',e&&e.message);return false;}
}
async function saveIntro(intro){
  if(!firebaseReady) return false;
  try{await db.collection('se_intros').add(intro);return true;}
  catch(e){console.warn('[SE] save intro:',e&&e.message);return false;}
}

async function authSignUp(form){
  if(!firebaseReady) throw new Error('Firebase not ready');
  let cred=null;
  try{
    cred=await auth.createUserWithEmailAndPassword(form.email,form.password);
    const profile={
      name:form.name,businessName:form.businessName,phone:form.phone,email:form.email,
      role:form.role,category:form.category,location:form.location,
      country:form.country||'Zambia',scope:form.scope||'local',
      status:'pending',createdAt:Date.now()
    };
    if(form.role==='supplier'){
      profile.products=splitCSV(form.products);
      profile.moq=form.moq||'Contact supplier';
      profile.delivery=form.delivery||'Contact supplier';
      profile.leadTime=form.leadTime||'Contact supplier';
    }
    if(form.role==='buyer'){
      profile.sources=splitCSV(form.sources);
      profile.frequency=form.frequency||'Monthly';
      profile.orderValue=form.orderValue||'Contact buyer';
    }
    await db.collection('se_users').doc(cred.user.uid).set(profile);
    return { email: form.email };
  } finally {
    try { await auth.signOut(); } catch(_){}
  }
}
async function authSignIn(email,password){
  if(!firebaseReady) throw new Error('Firebase not ready');
  return auth.signInWithEmailAndPassword(email,password);
}
async function authSignOutFn(){try{await auth.signOut();}catch(e){}}

function isInternationalEntity(e){
  if(!e) return false;
  if(e.scope==='international'||e.scope==='both') return true;
  if(e.country && e.country!=='Zambia') return true;
  return false;
}
function locLabel(e){
  if(!e) return '';
  const parts=[e.location];
  if(e.country && e.country!=='Zambia' && e.country!==e.location) parts.push(e.country);
  return parts.filter(Boolean).join(', ');
}

function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{
    if(open){document.body.style.overflow='hidden';}else{document.body.style.overflow='';}
    return ()=>{document.body.style.overflow='';};
  },[open]);
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    if(open)window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[open,onClose]);
  if(!open) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 mf"
      style={{background:'rgba(10,31,18,0.85)',position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}
      onClick={onClose}>
      <div className="mc" onClick={e=>e.stopPropagation()}
        style={{background:'#F5FAF6',borderRadius:12,width:'100%',maxWidth:maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 30px 80px rgba(0,0,0,.35)'}}>
        <div style={{background:'#0A1F12',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10,borderBottom:'1px solid rgba(245,166,35,.15)'}}>

            <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}></span>
            <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623'}}>{eyebrow||'StartEasy'}</span>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.6)',cursor:'pointer',padding:6,fontSize:16}} aria-label="Close"><i className="fas fa-times"></i></button>
        </div>
        <div style={{padding:'24px 28px'}}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

}
function PasswordInput({value,onChange,placeholder='••••••••',autoComplete='current-password'}){

    <input
      type={show?'text':'password'}

/* ═══════════════════ AUTH MODAL ═══════════════════ */
function AuthModal({open,initialMode='signup',initialRole='buyer',onClose,onAuthSuccess}){
  const [mode,setMode]=useState(initialMode);
  const [role,setRole]=useState(initialRole);
  const [err,setErr]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [resetSent,setResetSent]=useState(false);
  const [resetEmail,setResetEmail]=useState('');
  const [signupSuccess,setSignupSuccess]=useState(false);
  const [form,setForm]=useState({name:'',businessName:'',email:'',phone:'',password:'',category:'',location:'',country:'Zambia',scope:'local',products:'',moq:'',delivery:'',leadTime:'',sources:'',frequency:'Monthly',orderValue:''});

  useEffect(()=>{
    if(open){
      setMode(initialMode);
      setRole(initialRole);
      setErr('');
      setResetSent(false);
      setResetEmail('');
      setSignupSuccess(false);
    }
  },[open,initialMode,initialRole]);

  const submit=async()=>{
    setErr('');

    if(mode==='forgot'){
      const email=form.email.trim();
      if(!email) return setErr('Enter your email.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('That email address is not valid.');
      if(!firebaseReady) return setErr('Auth service unavailable. Please try again.');
      setSubmitting(true);
      try{
        await auth.sendPasswordResetEmail(email);
        setResetEmail(email);
        setResetSent(true);
      }catch(e){
        const code=(e&&e.code)||'';
        if(code==='auth/user-not-found'){
          setResetEmail(email);
          setResetSent(true);
        }else{
          setErr(authErrorMessage(e));
        }
      }finally{setSubmitting(false);}
      return;
    }

    if(mode==='signin'){
      if(!form.email.trim()) return setErr('Enter your email.');
      if(!form.password) return setErr('Enter your password.');
      setSubmitting(true);
      try{
        await authSignIn(form.email.trim(),form.password);
        onAuthSuccess && onAuthSuccess('dashboard', signupSuccess);
      }catch(e){
        setErr(authErrorMessage(e));
      }finally{setSubmitting(false);}
      return;
    }

    if(!form.name.trim()) return setErr('Enter your full name.');
    if(!form.businessName.trim()) return setErr('Enter your business name.');
    if(!form.email.trim()) return setErr('Enter your email.');
    if(!form.phone.trim()) return setErr('Enter your phone.');
    if(!form.category) return setErr('Choose a category.');
    if(!form.location||!form.location.trim()) return setErr('Enter your city / region.');
    if(form.password.length<6) return setErr('Password must be at least 6 characters.');
    if(role==='supplier' && !form.products.trim()) return setErr('List the products you supply.');
    if(role==='buyer' && !form.sources.trim()) return setErr('List what you buy regularly.');
    setSubmitting(true);
    try{
      const result = await authSignUp({...form,role});
      setSignupSuccess(true);
      setMode('signin');
      setForm(f=>({...f,email:result.email,password:''}));
      setRole(role);
    }catch(e){
      setErr(authErrorMessage(e));
    }finally{setSubmitting(false);}
  };

  if(mode==='forgot' && resetSent){
    return <Modal open={open} onClose={onClose} eyebrow="Reset link sent" maxWidth="40rem">
      <div style={{textAlign:'center',padding:'12px 0'}}>
        <div style={{width:64,height:64,borderRadius:'50%',background:'rgba(30,123,60,.12)',color:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,margin:'0 auto 16px'}}>
          <i className="fas fa-envelope-circle-check"></i>
        </div>
        <h2 className="serif" style={{fontSize:'clamp(1.4rem,3vw,1.75rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 10px'}}>Check your email</h2>
        <p style={{fontSize:13.5,lineHeight:1.7,color:'rgba(10,31,18,.7)',margin:'0 auto 8px',maxWidth:380}}>
          If an account exists for <strong style={{color:'#0A1F12',wordBreak:'break-all'}}>{resetEmail}</strong>, we've sent a password reset link.
        </p>
        <p style={{fontSize:12,lineHeight:1.6,color:'rgba(10,31,18,.55)',margin:'0 auto 22px',maxWidth:380}}>
          Click the link in that email to set a new password. Check your spam folder if it doesn't arrive within a minute.
        </p>
        <button onClick={()=>{setMode('signin');setResetSent(false);setErr('');}} style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,marginBottom:10}}>
          Back to sign in
        </button>
        <button onClick={()=>{setResetSent(false);setErr('');}} style={{width:'100%',padding:'12px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
          Use a different email
        </button>
      </div>
    </Modal>;
  }

  if(mode==='forgot'){
    return <Modal open={open} onClose={onClose} eyebrow="Reset password" maxWidth="40rem">
      <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>Forgot your password?</h2>
      <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 20px'}}>

      <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label>
      <TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@business.zm"/>
      {err && <div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}>
        <i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}
      </div>}
      <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
        {submitting?<><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Sending…</>:'Send reset link'}
      </button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{width:'100%',marginTop:10,padding:'12px',background:'transparent',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
        ← Back to sign in
      </button>
    </Modal>;
  }

  const eyebrowText = signupSuccess ? 'Sign in to continue' : (mode==='signin' ? 'Welcome back' : 'Create your account');

  return <Modal open={open} onClose={onClose} eyebrow={eyebrowText} maxWidth="40rem">
    {!signupSuccess && <div style={{display:'flex',gap:6,marginBottom:18,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:5}}>
      <button onClick={()=>{setMode('signup');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signup'?'#0A1F12':'transparent',color:mode==='signup'?'#fff':'rgba(10,31,18,.65)'}}>Create account</button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signin'?'#0A1F12':'transparent',color:mode==='signin'?'#fff':'rgba(10,31,18,.65)'}}>Sign in</button>
    </div>}

    {signupSuccess && <div style={{background:'rgba(30,123,60,.06)',border:'1px solid rgba(30,123,60,.3)',borderRadius:10,padding:'14px 16px',marginBottom:16,display:'flex',gap:12,alignItems:'flex-start'}}>
      <i className="fas fa-circle-check" style={{color:'#1E7B3C',fontSize:18,marginTop:1,flexShrink:0}}></i>
      <div>
        <div style={{fontSize:13.5,fontWeight:800,color:'#0F5C2A',marginBottom:4}}>Account created successfully</div>
        <div style={{fontSize:12.5,lineHeight:1.55,color:'rgba(10,31,18,.75)'}}>For security, sign in with your email and password to continue to your dashboard.</div>
      </div>
    </div>}

    {mode==='signup'&&<>
      <div style={{marginBottom:16}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:8}}>I am registering as a…</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <button onClick={()=>setRole('buyer')} style={{padding:'14px 12px',border:role==='buyer'?'2px solid #E8730F':'2px solid rgba(10,31,18,.1)',background:role==='buyer'?'rgba(232,115,15,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-cart-shopping" style={{color:'#E8730F',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Buyer</span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I source products</div>
          </button>
          <button onClick={()=>setRole('supplier')} style={{padding:'14px 12px',border:role==='supplier'?'2px solid #1B6CA8':'2px solid rgba(10,31,18,.1)',background:role==='supplier'?'rgba(27,108,168,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>

      <div style={{marginBottom:14}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})}/></div>

          <label style={{fontSize:11.5,fontWeight:700,color:'#0A1F12'}}>Password</label>

      </div>
      {signupSuccess && <button onClick={()=>{setSignupSuccess(false);setMode('signup');setErr('');}} style={{width:'100%',marginTop:14,padding:'10px',background:'transparent',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:12.5,fontWeight:600,color:'#0A1F12',cursor:'pointer',fontFamily:'inherit'}}>
        ← Use a different email
      </button>}
    </>}

    {err&&<div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}><i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}</div>}

    <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
      {submitting?<><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Please wait…</>:(mode==='signin'?'Sign in':'Create my account')}
    </button>

    {!signupSuccess && <p style={{fontSize:11.5,color:'rgba(10,31,18,.5)',marginTop:12,textAlign:'center',fontStyle:'italic'}}>
      {mode==='signin'?'New here?':'Have an account?'}{' '}

    </p>}
  </Modal>;
}

        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <a href={MAIN_PLATFORM_URL} style={{padding:'10px 14px',background:'rgba(232,115,15,.15)',color:'#FFD9A6',border:'1px solid rgba(232,115,15,.35)',borderRadius:8,fontSize:12,fontWeight:700,textDecoration:'none',whiteSpace:'nowrap'}}>
            <i className="fas fa-arrow-left" style={{marginRight:6}}></i> <span className="hide-sm">StartEasy Platform</span>
          </a>
          <button onClick={handleSignOut} disabled={signingOut} style={{padding:'10px 14px',background:'rgba(184,86,79,.15)',color:'#FFB4A8',border:'1px solid rgba(184,86,79,.35)',borderRadius:8,fontSize:12,fontWeight:700}}>
            <i className="fas fa-right-from-bracket" style={{marginRight:6}}></i> <span className="hide-sm">{signingOut?'Signing out…':'Sign out'}</span>
          </button>
        </div>
      </div>
    </header>

    <main style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 24px'}}>
      <div style={{maxWidth:560,width:'100%'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:76,height:76,borderRadius:'50%',background:'rgba(30,123,60,.12)',color:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',fontSize:34,margin:'0 auto 20px'}}>
            <i className="fas fa-check"></i>
          </div>
          <h1 className="serif" style={{fontSize:'clamp(1.7rem,4vw,2.3rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>
            Welcome to StartEasy, {firstName}!
          </h1>
          <p style={{fontSize:14.5,lineHeight:1.7,color:'rgba(10,31,18,.65)',margin:'0 auto',maxWidth:420}}>
            Your {isSupplier?'supplier':'buyer'} account is ready. {isVerified?'Your profile is verified and live in the directory.':'Our team will verify your profile — usually within 48 hours.'}
          </p>
        </div>

        {profile && <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px 20px',marginBottom:20}}>
          <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',marginBottom:10}}>Your account</div>
          <WelcomeRow k="Business" v={profile.businessName}/>
          <WelcomeRow k="Role" v={isSupplier?'Supplier':'Buyer'}/>
          <WelcomeRow k="Category" v={cat.title}/>
          <WelcomeRow k="Location" v={locLabel(profile)}/>
          <WelcomeRow k="Status" v={isVerified?'Verified':'Pending verification'}/>
        </div>}

        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>What would you like to do first?</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <button onClick={onBrowse} style={{padding:'16px 18px',background:'#fff',border:'1.5px solid rgba(10,31,18,.12)',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,transition:'all .2s'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='#1B6CA8';e.currentTarget.style.transform='translateY(-2px)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(10,31,18,.12)';e.currentTarget.style.transform='none';}}>
              <span style={{width:44,height:44,borderRadius:11,background:'rgba(27,108,168,.12)',color:'#1B6CA8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}>
                <i className="fas fa-magnifying-glass"></i>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:800,color:'#0A1F12'}}>Browse {isSupplier?'buyers':'suppliers'} first</div>
                <div style={{fontSize:12,color:'rgba(10,31,18,.6)',marginTop:2}}>See who's in your category right now</div>
              </div>
              <i className="fas fa-arrow-right" style={{color:'rgba(10,31,18,.3)'}}></i>
            </button>

            <button onClick={onDashboard} style={{padding:'16px 18px',background:'linear-gradient(135deg,#E8730F,#F5A623)',border:'none',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,color:'#fff',boxShadow:'0 12px 28px -10px rgba(232,115,15,.5)'}}>
              <span style={{width:44,height:44,borderRadius:11,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}>
                <i className="fas fa-house"></i>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:800}}>Open my dashboard</div>
                <div style={{fontSize:12,color:'rgba(255,255,255,.85)',marginTop:2}}>Track matches, requests, and your profile</div>
              </div>
              <i className="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <p style={{fontSize:11.5,color:'rgba(10,31,18,.5)',textAlign:'center',lineHeight:1.6,margin:0,fontStyle:'italic'}}>
          You can switch between Browse and Dashboard anytime from the top menu.
        </p>
      </div>
    </main>
  </div>;
}
function WelcomeRow({k,v}){
  return <div style={{display:'flex',justifyContent:'space-between',gap:12,padding:'7px 0',borderBottom:'1px dashed rgba(10,31,18,.06)',fontSize:13}}>
    <span style={{color:'rgba(10,31,18,.55)',fontWeight:600}}>{k}</span>
    <span style={{color:'#0A1F12',fontWeight:700,textAlign:'right'}}>{v||'—'}</span>
  </div>;
}

/* ═══════════════════ DASHBOARD ═══════════════════ */
function Dashboard({user,onBrowse,onSignedOut}){
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('overview');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [matches,setMatches]=useState([]);
  const [quotes,setQuotes]=useState([]);
  const [editForm,setEditForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState(null);

  useEffect(()=>{
    if(!user){setLoading(false);return;}
    loadUserProfile(user.uid).then(p=>{
      setProfile(p);
      if(p) setEditForm({
        name:p.name||'',businessName:p.businessName||'',phone:p.phone||'',
        category:p.category||'',location:p.location||'',
        country:p.country||'Zambia',scope:p.scope||'local',
        products:Array.isArray(p.products)?p.products.join(', '):(p.products||''),
        moq:p.moq||'',delivery:p.delivery||'',leadTime:p.leadTime||'',
        sources:Array.isArray(p.sources)?p.sources.join(', '):(p.sources||''),
        frequency:p.frequency||'Monthly',orderValue:p.orderValue||''
      });
      setLoading(false);
    });
  },[user]);

  useEffect(()=>{
    if(!profile) return;
    const isSupplier=profile.role==='supplier';
    const coll=isSupplier?'se_buyers':'se_suppliers';
    const seeds=isSupplier?SEED_BUYERS:SEED_SUPPLIERS;
    const filterSeed=()=>setMatches(seeds.filter(x=>x.category===profile.category).slice(0,12));
    if(!firebaseReady){filterSeed();}
    else{
      db.collection(coll).where('category','==',profile.category).limit(12).get()
        .then(snap=>{if(snap.empty) filterSeed();else setMatches(snap.docs.map(d=>({id:d.id,...d.data()})));})
        .catch(()=>filterSeed());
    }
    if(!isSupplier){loadUserQuotes(user.uid).then(q=>setQuotes(q));}
  },[profile,user]);

  const signOut=async()=>{await authSignOutFn();onSignedOut&&onSignedOut();};

  const saveProfile=async()=>{
    if(!editForm) return;
    setSaving(true);setSaveMsg(null);
    try{
      const isSupplier=profile.role==='supplier';
      const updates={name:editForm.name.trim(),businessName:editForm.businessName.trim(),phone:editForm.phone.trim(),category:editForm.category,location:editForm.location,country:editForm.country||'Zambia',scope:editForm.scope||'local'};
      if(isSupplier){updates.products=splitCSV(editForm.products);updates.moq=editForm.moq;updates.delivery=editForm.delivery;updates.leadTime=editForm.leadTime;}
      else{updates.sources=splitCSV(editForm.sources);updates.frequency=editForm.frequency;updates.orderValue=editForm.orderValue;}
      if(firebaseReady) await db.collection('se_users').doc(user.uid).update(updates);
      setProfile({...profile,...updates});
      setSaveMsg({kind:'ok',msg:'Profile saved.'});
      setTimeout(()=>setSaveMsg(null),3000);
    }catch(e){setSaveMsg({kind:'err',msg:'Save failed: '+(e.code||e.message)});}
    finally{setSaving(false);}
  };

  if(loading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;

  if(!profile) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6',padding:'32px 20px',textAlign:'center'}}>
    <div style={{maxWidth:400}}>
      <h2 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Profile not found</h2>
      <p style={{fontSize:13.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:20}}>Contact {CONTACT_EMAIL}.</p>
      <button onClick={signOut} style={{padding:'12px 22px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13.5,fontWeight:700}}>Sign out</button>
    </div>
  </div>;

  const isSupplier=profile.role==='supplier';
  const cat=CAT_MAP[profile.category]||{title:'General',color:'#E8730F',icon:'fa-building'};
  const isVerified=profile.status==='verified';

  const fields=isSupplier
    ? [profile.name,profile.businessName,profile.phone,profile.category,profile.location,(profile.products&&profile.products.length),profile.moq,profile.delivery,profile.leadTime]
    : [profile.name,profile.businessName,profile.phone,profile.category,profile.location,(profile.sources&&profile.sources.length),profile.frequency,profile.orderValue];
  const pct=Math.round((fields.filter(Boolean).length/fields.length)*100);
  const circ=2*Math.PI*26;
  const dash=circ*(1-pct/100);

  const tabs=isSupplier
    ? [['overview','Overview','fa-house'],['matches','Matches','fa-users'],['profile','Profile','fa-user'],['settings','Settings','fa-gear']]
    : [['overview','Overview','fa-house'],['matches','Matches','fa-truck-fast'],['requests','My Requests','fa-file-invoice'],['profile','Profile','fa-user'],['settings','Settings','fa-gear']];

  const kpis=isSupplier
    ? [
        {label:'Buyers matched',value:matches.length,icon:'fa-users',color:'#1B6CA8',sub:'in your category'},
        {label:'Inquiries',value:0,icon:'fa-envelope',color:'#E8730F',sub:'Received from buyers'},
        {label:'Profile views',value:'—',icon:'fa-eye',color:'#7A4FA3',sub:'Tracking'},
        {label:'Status',value:isVerified?'Verified':'Pending',icon:isVerified?'fa-circle-check':'fa-clock',color:isVerified?'#1E7B3C':'#8A6828',sub:isVerified?'Live in directory':'Being reviewed'}
      ]
    : [
        {label:'Suppliers matched',value:matches.length,icon:'fa-truck-fast',color:'#1B6CA8',sub:'in your category'},
        {label:'Quotes requested',value:quotes.length,icon:'fa-file-invoice',color:'#E8730F',sub:quotes.length>0?'View My Requests':'None yet'},
        {label:'Suppliers contacted',value:new Set(quotes.map(q=>q.supplierId).filter(Boolean)).size,icon:'fa-handshake',color:'#7A4FA3',sub:'Across your requests'},
        {label:'Status',value:isVerified?'Verified':'Pending',icon:isVerified?'fa-circle-check':'fa-clock',color:isVerified?'#1E7B3C':'#8A6828',sub:isVerified?'Live in directory':'Being reviewed'}
      ];

  const activity=[
    {icon:'fa-user-plus',color:'#2E9C4A',title:'Account created',detail:`${new Date(profile.createdAt||Date.now()).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`},
    ...(isVerified?[{icon:'fa-circle-check',color:'#1E7B3C',title:'Profile verified',detail:isSupplier?'Buyers can now find you':'Suppliers can now find you'}]:[{icon:'fa-clock',color:'#8A6828',title:'Verification pending',detail:'Reviewed within 48 hours.'}]),
    ...(quotes.length>0?[{icon:'fa-file-invoice',color:'#E8730F',title:`${quotes.length} quote request${quotes.length===1?'':'s'} sent`,detail:'Track them in My Requests'}]:[{icon:'fa-magnifying-glass',color:'#1B6CA8',title:'Browse suppliers to request quotes',detail:'Your requests will appear here.'}])
  ];

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6'}}>
    <div className={'dash-backdrop '+(sidebarOpen?'open':'')} onClick={()=>setSidebarOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:45}}></div>

    <aside className={'dash-sidebar '+(sidebarOpen?'open':'')} style={{position:'fixed',left:0,top:0,bottom:0,width:260,background:'#0A1F12',color:'#fff',display:'flex',flexDirection:'column',zIndex:50,overflowY:'auto'}}>
      <div style={{padding:'20px 20px 16px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
          <Mark size={36}/>
          <div style={{lineHeight:1.15}}>
            <div style={{fontSize:8.5,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:700,color:'rgba(255,255,255,.35)'}}>Dashboard</div>
            <div style={{fontSize:14,fontWeight:700,color:'#fff'}}>Start<em style={{fontStyle:'normal',color:'#F5A623'}}>Easy</em></div>
          </div>
        </div>
        <div style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'center',gap:10}}>
          <span style={{width:38,height:38,borderRadius:'50%',background:cat.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,flexShrink:0}}>{(profile.name||'U')[0].toUpperCase()}</span>
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontSize:12.5,fontWeight:700,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{profile.name}</div>
            <div style={{fontSize:10.5,color:'rgba(255,255,255,.55)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{isSupplier?'Supplier':'Buyer'} · {profile.businessName}</div>
          </div>
        </div>
      </div>
      <nav style={{padding:'16px 12px',flex:1}}>
        {tabs.map(([key,label,icon])=>
          <button key={key} onClick={()=>{setTab(key);setSidebarOpen(false);}} className={'dash-nav-btn '+(tab===key?'active':'')}>
            <i className={`fas ${icon}`} style={{fontSize:13,width:16}}></i>{label}
            {key==='requests' && quotes.length>0 && <span style={{marginLeft:'auto',background:'#E8730F',color:'#fff',fontSize:9.5,fontWeight:800,borderRadius:99,padding:'1px 7px'}}>{quotes.length}</span>}
          </button>
        )}
        <div style={{height:14}}></div>
        <button onClick={onBrowse} className="dash-nav-btn"><i className="fas fa-magnifying-glass" style={{fontSize:12,width:16}}></i> Browse directory</button>
        <a href={MAIN_PLATFORM_URL} className="dash-nav-btn" style={{textDecoration:'none',color:'#F5A623',background:'rgba(232,115,15,.1)',border:'1px solid rgba(232,115,15,.25)',marginTop:6}}>
          <i className="fas fa-arrow-left" style={{fontSize:12,width:16}}></i> Back to StartEasy Platform
        </a>
      </nav>
      <div style={{padding:'14px 16px',borderTop:'1px solid rgba(255,255,255,.08)'}}>
        <a href={waUrl(`Hello StartEasy — I'm ${profile.name} (${profile.businessName}).`)} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'10px',marginBottom:8,background:'#25D366',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700,textDecoration:'none'}}>
          <i className="fab fa-whatsapp"></i> Contact support
        </a>
        <button onClick={signOut} style={{width:'100%',padding:'10px',borderRadius:8,background:'rgba(184,86,79,.15)',color:'#FFB4A8',border:'1px solid rgba(184,86,79,.35)',fontSize:12,fontWeight:700}}>
          <i className="fas fa-right-from-bracket" style={{marginRight:6}}></i> Sign out
        </button>
      </div>
    </aside>

    <div className="dash-main" style={{minHeight:'100vh'}}>
      <header style={{background:'#fff',borderBottom:'1px solid rgba(10,31,18,.08)',padding:'14px 24px',display:'flex',alignItems:'center',gap:14,position:'sticky',top:0,zIndex:30}}>
        <button onClick={()=>setSidebarOpen(true)} className="dash-mobile-toggle" style={{width:36,height:36,borderRadius:8,background:'#0A1F12',color:'#fff',border:'none',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <i className="fas fa-bars" style={{fontSize:14}}></i>
        </button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.45)'}}>{isSupplier?'Supplier':'Buyer'} dashboard</div>
          <div style={{fontSize:14.5,fontWeight:700,color:'#0A1F12'}}>{tabs.find(t=>t[0]===tab)?.[1]||'Overview'}</div>
        </div>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:99,fontSize:10.5,fontWeight:800,textTransform:'uppercase',background:isVerified?'rgba(30,123,60,.12)':'rgba(245,166,35,.15)',color:isVerified?'#0F5C2A':'#8A6828',border:'1px solid '+(isVerified?'rgba(30,123,60,.3)':'rgba(245,166,35,.35)')}}>
          <i className={`fas ${isVerified?'fa-circle-check':'fa-clock'}`} style={{fontSize:9}}></i>
          <span className="hide-sm">{isVerified?'Verified':'Pending'}</span>
        </span>
      </header>

      <main style={{padding:'24px',maxWidth:1200,margin:'0 auto'}}>
        {tab==='overview'&&<>
          <div style={{marginBottom:22}}>
            <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>Welcome back, {profile.name.split(' ')[0]}</h1>
            <p style={{fontSize:13.5,color:'rgba(10,31,18,.6)',margin:0}}>{profile.businessName} · {cat.title} · {locLabel(profile)}</p>
          </div>

          <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',marginBottom:22}}>
            {kpis.map((k,i)=>(
              <div key={i} className="kpi-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
                  <span style={{fontSize:10.5,letterSpacing:'.12em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',lineHeight:1.3}}>{k.label}</span>
                  <span style={{width:32,height:32,borderRadius:8,background:k.color+'15',color:k.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}><i className={`fas ${k.icon}`}></i></span>
                </div>
                <div className="serif" style={{fontSize:26,fontWeight:800,color:'#0A1F12',lineHeight:1}}>{k.value}</div>
                <div style={{fontSize:11.5,color:'rgba(10,31,18,.5)'}}>{k.sub}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid',gap:18,gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
            <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,overflow:'hidden'}}>
              <div style={{padding:'18px 20px',borderBottom:'1px solid rgba(10,31,18,.06)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
                <div>
                  <h3 className="serif" style={{fontSize:15,fontWeight:800,color:'#0A1F12',margin:'0 0 3px'}}>{isSupplier?'Businesses needing what you supply':'Suppliers in your category'}</h3>
                  <p style={{fontSize:11.5,color:'rgba(10,31,18,.5)',margin:0}}>{matches.length} in {cat.title}</p>
                </div>
                <button onClick={()=>setTab('matches')} style={{background:'none',border:'none',color:'#E8730F',fontSize:12,fontWeight:800,textDecoration:'underline',cursor:'pointer',fontFamily:'inherit',padding:0}}>See all</button>
              </div>
              {matches.length===0?<div style={{padding:'40px 20px',textAlign:'center'}}><p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>No matches yet.</p></div>:
              matches.slice(0,5).map(m=>(
                <div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',borderBottom:'1px dashed rgba(10,31,18,.08)'}}>
                  <span style={{width:38,height:38,borderRadius:10,background:cat.color+'15',color:cat.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}><i className={`fas ${isSupplier?'fa-cart-shopping':'fa-truck-fast'}`}></i></span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:'#0A1F12'}}>{m.name}</div>
                    <div style={{fontSize:11.5,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(m)}</div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px 20px'}}>
                <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:12}}>
                  <div className="profile-ring">
                    <svg width="64" height="64" viewBox="0 0 64 64">
                      <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(10,31,18,.08)" strokeWidth="6"/>
                      <circle cx="32" cy="32" r="26" fill="none" stroke={pct===100?'#1E7B3C':'#E8730F'} strokeWidth="6" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={dash} style={{transition:'stroke-dashoffset .5s ease'}}/>
                    </svg>
                    <div className="inner" style={{color:pct===100?'#1E7B3C':'#E8730F'}}>{pct}%</div>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:800,color:'#0A1F12',marginBottom:2}}>{pct===100?'Profile complete':'Profile '+pct+'%'}</div>
                    <div style={{fontSize:11.5,color:'rgba(10,31,18,.6)',lineHeight:1.5}}>{pct===100?'Fully discoverable.':'Complete to unlock matches.'}</div>
                  </div>
                </div>
                {pct<100&&<button onClick={()=>setTab('profile')} style={{width:'100%',padding:'10px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:12.5,fontWeight:700}}>Complete profile</button>}
              </div>

              <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px 20px'}}>
                <h3 className="serif" style={{fontSize:14,fontWeight:800,color:'#0A1F12',margin:'0 0 10px'}}>Recent activity</h3>
                {activity.map((a,i)=>(
                  <div key={i} style={{display:'flex',gap:12,padding:'10px 0',borderBottom:i<activity.length-1?'1px dashed rgba(10,31,18,.06)':'none',alignItems:'flex-start'}}>
                    <span style={{width:28,height:28,borderRadius:'50%',background:a.color+'15',color:a.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,flexShrink:0}}><i className={`fas ${a.icon}`}></i></span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:700,color:'#0A1F12',marginBottom:2}}>{a.title}</div>
                      <div style={{fontSize:11,color:'rgba(10,31,18,.55)',lineHeight:1.5}}>{a.detail}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </>}

        {tab==='matches'&&<>
          <div style={{marginBottom:20}}>
            <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>Your matches</h1>
            <p style={{fontSize:13.5,color:'rgba(10,31,18,.6)',margin:0}}>{matches.length} in {cat.title}</p>
          </div>
          <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))'}}>
            {matches.map(m=>(
              <div key={m.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:`3px solid ${cat.color}`}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{width:38,height:38,borderRadius:10,background:cat.color+'15',color:cat.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0}}><i className={`fas ${isSupplier?'fa-cart-shopping':'fa-truck-fast'}`}></i></span>
                  <div style={{minWidth:0,flex:1}}>
                    <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12'}}>{m.name}</div>
                    <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}>{locLabel(m)}</div>
                  </div>
                </div>
                <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0}}>{m.desc}</p>
              </div>
            ))}
          </div>
        </>}

        {tab==='requests'&&!isSupplier&&<>
          <div style={{marginBottom:20}}>
            <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>My Requests</h1>
            <p style={{fontSize:13.5,color:'rgba(10,31,18,.6)',margin:0}}>Quotes you've requested — tracked here.</p>
          </div>
          {quotes.length===0?<div style={{background:'#fff',border:'1px dashed rgba(10,31,18,.15)',borderRadius:12,padding:'56px 24px',textAlign:'center'}}>
            <i className="fas fa-file-invoice" style={{fontSize:32,color:'rgba(10,31,18,.15)',marginBottom:12,display:'block'}}></i>
            <h3 className="serif" style={{fontSize:17,fontWeight:700,color:'#0A1F12',margin:'0 0 8px'}}>No requests yet</h3>
            <p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:'0 0 20px'}}>Request a quote from a supplier and it will appear here.</p>
            <button onClick={onBrowse} style={{padding:'12px 22px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700}}>Browse suppliers</button>
          </div>:
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {quotes.map(q=>(
              <div key={q.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px 20px',borderLeft:'4px solid #E8730F'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap',marginBottom:10}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:800,color:'#0A1F12'}}>{q.supplierName||'Supplier'}</div>
                    <div style={{fontSize:11.5,color:'rgba(10,31,18,.55)'}}>{CAT_MAP[q.category]?.title||q.category} · {q.at?new Date(q.at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):''}</div>
                  </div>
                  <span style={{padding:'3px 10px',background:'rgba(232,115,15,.12)',color:'#8A6828',borderRadius:99,fontSize:10,fontWeight:800,textTransform:'uppercase'}}>{q.status||'sent'}</span>
                </div>
                <div style={{display:'grid',gap:6,gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',fontSize:12.5}}>
                  <div><span style={{color:'rgba(10,31,18,.5)'}}>Product:</span> <strong style={{color:'#0A1F12'}}>{q.product}</strong></div>
                  {q.quantity&&<div><span style={{color:'rgba(10,31,18,.5)'}}>Qty:</span> <strong style={{color:'#0A1F12'}}>{q.quantity}</strong></div>}
                  {q.budget&&<div><span style={{color:'rgba(10,31,18,.5)'}}>Budget:</span> <strong style={{color:'#0A1F12'}}>{q.budget}</strong></div>}
                </div>
              </div>
            ))}
          </div>}
        </>}

        {tab==='profile'&&editForm&&<>
          <div style={{marginBottom:20}}>
            <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>Your profile</h1>
            <p style={{fontSize:13.5,color:'rgba(10,31,18,.6)',margin:0}}>This is what buyers or suppliers will see.</p>
          </div>
          <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px'}}>
            <div className="form-grid">
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Full name</label><TIn value={editForm.name} onChange={v=>setEditForm({...editForm,name:v})}/></div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business name</label><TIn value={editForm.businessName} onChange={v=>setEditForm({...editForm,businessName:v})}/></div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone</label><TIn value={editForm.phone} onChange={v=>setEditForm({...editForm,phone:v})}/></div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Category</label>
                <select value={editForm.category} onChange={e=>setEditForm({...editForm,category:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
                  {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
                </select>
              </div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Country</label>
                <select value={editForm.country||'Zambia'} onChange={e=>setEditForm({...editForm,country:e.target.value,location:''})} style={{...INP_STYLE,cursor:'pointer'}}>
                  {COUNTRIES.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{(!editForm.country||editForm.country==='Zambia')?'City':'City / Region'}</label>
                {(!editForm.country||editForm.country==='Zambia')?(
                  <select value={editForm.location} onChange={e=>setEditForm({...editForm,location:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
                    {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                ):(
                  <TIn value={editForm.location} onChange={v=>setEditForm({...editForm,location:v})}/>
                )}
              </div>
              <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{isSupplier?'Delivery scope':'Sourcing scope'}</label>
                <select value={editForm.scope||'local'} onChange={e=>setEditForm({...editForm,scope:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
                  {SCOPE_OPTIONS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
                </select>
              </div>
            </div>
            {editForm.scope && editForm.scope!=='local' && <div style={{background:'rgba(27,108,168,.06)',border:'1px dashed rgba(27,108,168,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,fontSize:11.5,lineHeight:1.6,color:'rgba(10,31,18,.7)'}}>
              <i className="fas fa-circle-info" style={{color:'#1B6CA8',marginRight:6}}></i>
              International sourcing: import duties, customs clearance and international freight are separate from supplier quotes.
            </div>}
            <div style={{marginTop:16}}>
              {isSupplier?<>
                <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Products (comma-separated)</label><TIn value={editForm.products} onChange={v=>setEditForm({...editForm,products:v})}/>
                <div style={{marginTop:12,display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
                  <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>MOQ</label><TIn value={editForm.moq} onChange={v=>setEditForm({...editForm,moq:v})}/></div>
                  <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Lead time</label><TIn value={editForm.leadTime} onChange={v=>setEditForm({...editForm,leadTime:v})}/></div>
                  <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Delivery</label><TIn value={editForm.delivery} onChange={v=>setEditForm({...editForm,delivery:v})}/></div>
                </div>
              </>:<>
                <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>What you buy (comma-separated)</label><TIn value={editForm.sources} onChange={v=>setEditForm({...editForm,sources:v})}/>
                <div style={{marginTop:12,display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
                  <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Frequency</label>
                    <select value={editForm.frequency} onChange={e=>setEditForm({...editForm,frequency:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
                      {FREQUENCY_OPTIONS.map(f=><option key={f} value={f}>{f}</option>)}
                    </select>
                  </div>
                  <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Typical order</label><TIn value={editForm.orderValue} onChange={v=>setEditForm({...editForm,orderValue:v})}/></div>
                </div>
              </>}
            </div>
            {saveMsg&&<div style={{background:saveMsg.kind==='ok'?'rgba(30,123,60,.1)':'rgba(184,86,79,.1)',border:'1px solid '+(saveMsg.kind==='ok'?'rgba(30,123,60,.3)':'rgba(184,86,79,.3)'),borderRadius:8,padding:'10px 14px',fontSize:12.5,color:saveMsg.kind==='ok'?'#0F5C2A':'#7C2318',marginTop:14}}>{saveMsg.msg}</div>}
            <button onClick={saveProfile} disabled={saving} style={{marginTop:18,padding:'12px 22px',background:saving?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700}}>{saving?'Saving…':'Save changes'}</button>
          </div>
        </>}

        {tab==='settings'&&<>
          <div style={{marginBottom:20}}>
            <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>Settings</h1>
          </div>
          <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px',marginBottom:16}}>
            <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:12}}>Account</div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px dashed rgba(10,31,18,.06)',fontSize:13}}><span style={{color:'rgba(10,31,18,.6)'}}>Email</span><span style={{fontWeight:700,color:'#0A1F12'}}>{profile.email}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px dashed rgba(10,31,18,.06)',fontSize:13}}><span style={{color:'rgba(10,31,18,.6)'}}>Role</span><span style={{fontWeight:700,color:'#0A1F12'}}>{isSupplier?'Supplier':'Buyer'}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',fontSize:13}}><span style={{color:'rgba(10,31,18,.6)'}}>Status</span><span style={{fontWeight:700,color:isVerified?'#0F5C2A':'#8A6828'}}>{isVerified?'Verified':'Pending'}</span></div>
          </div>
          <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px',marginBottom:16}}>
            <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:12}}>Password</div>
            <button onClick={async()=>{try{await auth.sendPasswordResetEmail(profile.email);setSaveMsg({kind:'ok',msg:'Reset email sent.'});setTimeout(()=>setSaveMsg(null),4000);}catch(e){setSaveMsg({kind:'err',msg:'Could not send.'});setTimeout(()=>setSaveMsg(null),4000);}}} style={{padding:'10px 18px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:8,fontSize:12.5,fontWeight:700}}><i className="fas fa-key" style={{marginRight:6}}></i> Send reset email</button>
            {saveMsg&&<div style={{marginTop:12,background:saveMsg.kind==='ok'?'rgba(30,123,60,.1)':'rgba(184,86,79,.1)',borderRadius:8,padding:'10px 14px',fontSize:12.5,color:saveMsg.kind==='ok'?'#0F5C2A':'#7C2318'}}>{saveMsg.msg}</div>}
          </div>
          <div style={{background:'#fff',border:'1px solid rgba(184,86,79,.2)',borderRadius:12,padding:'22px'}}>
            <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#7C2318',marginBottom:12}}>Danger zone</div>
            <button onClick={signOut} style={{padding:'10px 18px',background:'#B8564F',color:'#fff',border:'none',borderRadius:8,fontSize:12.5,fontWeight:700}}><i className="fas fa-right-from-bracket" style={{marginRight:6}}></i> Sign out</button>
          </div>
        </>}
      </main>
    </div>
  </div>;
}

/* ═══════════════════ BROWSE ═══════════════════ */
function Browse({user,onRequestQuote,onRequestIntro,onDashboard,onSignedOut}){
  const [suppliers,setSuppliers]=useState([]);
  const [buyers,setBuyers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('suppliers');
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('all');
  const [city,setCity]=useState('all');
  const [profile,setProfile]=useState(null);
  const [profileType,setProfileType]=useState(null);

  useEffect(()=>{
    fsLoadDirectory().then(res=>{
      if(res && (res.suppliers.length||res.buyers.length)){
        setSuppliers(res.suppliers);
        setBuyers(res.buyers);
      }else{
        setSuppliers(SEED_SUPPLIERS);
        setBuyers(SEED_BUYERS);
      }
      setLoading(false);
    });
  },[]);

  const filteredSuppliers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return suppliers.filter(s=>{
      if(category!=='all'&&s.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(s)) return false; }
      else if(city!=='all'&&s.location!==city) return false;
      if(!q) return true;
      return (s.name+' '+s.location+' '+(s.country||'')+' '+(s.desc||'')+' '+(s.products||[]).join(' ')).toLowerCase().includes(q);
    });
  },[suppliers,query,category,city]);

  const filteredBuyers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return buyers.filter(b=>{
      if(category!=='all'&&b.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(b)) return false; }
      else if(city!=='all'&&b.location!==city) return false;
      if(!q) return true;
      return (b.name+' '+b.location+' '+(b.country||'')+' '+(b.desc||'')+' '+(b.sources||[]).join(' ')).toLowerCase().includes(q);
    });
  },[buyers,query,category,city]);

  const list=tab==='suppliers'?filteredSuppliers:filteredBuyers;
  const signOut=async()=>{await authSignOutFn();onSignedOut&&onSignedOut();};

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    <Nav user={user} onDashboard={onDashboard} onSignOut={signOut}/>
    <main style={{flex:1,maxWidth:1240,margin:'0 auto',padding:'32px 24px 60px',width:'100%'}}>
      <div style={{marginBottom:24}}>
        <span className="micro" style={{color:'#E8730F',display:'block',marginBottom:12}}>Browse directory</span>
        <h1 className="serif" style={{fontSize:'clamp(1.8rem,4vw,2.5rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>{list.length} {tab==='suppliers'?'supplier':'buyer'}{list.length===1?'':'s'}</h1>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:6}}>
        <button onClick={()=>{setTab('suppliers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='suppliers'?'#0A1F12':'transparent',color:tab==='suppliers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Suppliers ({suppliers.length})</button>
        <button onClick={()=>{setTab('buyers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='buyers'?'#E8730F':'transparent',color:tab==='buyers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Buyers ({buyers.length})</button>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <div style={{position:'relative',flex:'1 1 260px',minWidth:0}}>
            <i className="fas fa-magnifying-glass" style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',color:'rgba(10,31,18,.4)',fontSize:13}}></i>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search…" style={{...INP_STYLE,paddingLeft:40,fontSize:14}}/>
          </div>
          <select value={category} onChange={e=>setCategory(e.target.value)} style={{...INP_STYLE,minWidth:180,cursor:'pointer'}}>
            <option value="all">All categories</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
          <select value={city} onChange={e=>setCity(e.target.value)} style={{...INP_STYLE,minWidth:150,cursor:'pointer'}}>
            <option value="all">All locations</option>
            <option value="__intl">🌍 International</option>
            {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      {loading?<div style={{textAlign:'center',padding:'60px 0'}}><i className="fas fa-spinner fa-spin" style={{fontSize:24,color:'#E8730F'}}></i></div>:
      list.length===0?<div style={{background:'#fff',border:'1px dashed rgba(10,31,18,.15)',borderRadius:14,padding:'48px',textAlign:'center'}}>
        <p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>No results.</p>
      </div>:<div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))'}}>
        {tab==='suppliers'?filteredSuppliers.map(s=>{
          const cat=CAT_MAP[s.category]||{color:'#E8730F',icon:'fa-building',title:'Supplier'};
          return <div key={s.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:`3px solid ${cat.color}`}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:cat.color+'15',color:cat.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}><i className={`fas ${cat.icon}`}></i></span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12'}}>{s.name}</div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(s)}</div>
              </div>
            </div>
            {isInternationalEntity(s)&&<span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(27,108,168,.1)',color:'#1B6CA8',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-globe" style={{fontSize:9}}></i> International</span>}
            <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0}}>{s.desc}</p>
            <button onClick={()=>{setProfile(s);setProfileType('supplier');}} style={{padding:'9px',background:`linear-gradient(135deg,${cat.color},${cat.color}cc)`,color:'#fff',border:'none',borderRadius:8,fontSize:11.5,fontWeight:700,marginTop:'auto'}}>View profile</button>
          </div>;
        }):filteredBuyers.map(b=>(
          <div key={b.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:'3px solid #E8730F'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:'rgba(232,115,15,.15)',color:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}><i className="fas fa-cart-shopping"></i></span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12'}}>{b.name}</div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(b)}</div>
              </div>
            </div>

}
