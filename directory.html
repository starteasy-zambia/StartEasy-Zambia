/* ═══════════════════ RFQ & INTRO MODAL ═══════════════════ */
function RFQModal({open,onClose,preselected,type='quote',user,onSaved}){
  const [form,setForm]=useState({name:'',business:'',phone:'',email:'',category:'',product:'',quantity:'',deliveryCity:'',deliveryCountry:'Zambia',deadline:'',budget:'',notes:''});
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);
  const [agreeFee,setAgreeFee]=useState(false);

  const isIntro = type==='intro';

  useEffect(()=>{
    if(open){
      setForm(f=>({...f,name:user?.displayName||'',email:user?.email||'',category:preselected?preselected.category:'',product:preselected?(preselected.products||[])[0]||'':'',deliveryCity:'',deliveryCountry:'Zambia'}));
      setErr('');
      setAgreeFee(false);
    }
  },[open,preselected,user]);

  const submit=async()=>{
    setErr('');
    if(!form.name.trim()) return setErr('Enter your name.');
    if(!form.phone.trim()) return setErr('Enter your phone.');
    if(!form.product.trim()) return setErr('Describe what you need.');
    if(!user){setErr('You must be signed in.');return;}
    if(!agreeFee) return setErr('You must agree to the StartEasy Success Fee.');
    
    setSaving(true);
    try{
      if(isIntro){
        const intro={
          userId:user.uid,
          userName:form.name,
          userEmail:form.email,
          buyerId:preselected?.id||null,
          buyerName:preselected?.name||null,
          buyerCategory:preselected?.category||form.category,
          product:form.product,
          notes:form.notes,
          phone:form.phone,
          status:'sent',
          at:Date.now()
        };
        const ok=await saveIntro(intro);
        if(!ok) throw new Error('Could not save intro request.');
        const msg=['*INTRODUCTION REQUEST*','','*Supplier:*',`Name: ${form.name}`,`Phone: ${form.phone}`,form.email&&`Email: ${form.email}`,'','*Buyer:*',preselected?preselected.name:'Unknown Buyer','','*Pitch:*',form.product,form.notes&&`Notes: ${form.notes}`].filter(Boolean).join('\n');
        window.open(waUrl(msg),'_blank');
      } else {
        const quote={userId:user.uid,userName:form.name,userEmail:form.email,supplierId:preselected?.id||null,supplierName:preselected?.name||null,supplierCategory:preselected?.category||form.category,category:form.category,product:form.product,quantity:form.quantity,deliveryCity:form.deliveryCity,deliveryCountry:form.deliveryCountry,deadline:form.deadline,budget:form.budget,notes:form.notes,phone:form.phone,status:'sent',at:Date.now()};
        const ok=await saveQuote(quote);
        if(!ok) throw new Error('Could not save your request.');
        const intl = form.deliveryCountry && form.deliveryCountry!=='Zambia';
        const dest = form.deliveryCity ? `${form.deliveryCity}${intl?', '+form.deliveryCountry:''}` : '';
        const msg=['*QUOTATION REQUEST*','','*Buyer:*',`Name: ${form.name}`,`Phone: ${form.phone}`,form.email&&`Email: ${form.email}`,'','*Requirement:*',form.category&&`Category: ${CAT_MAP[form.category]?.title||form.category}`,preselected&&`Supplier: ${preselected.name}`,`Product: ${form.product}`,form.quantity&&`Quantity: ${form.quantity}`,dest&&`Delivery to: ${dest}`,form.deadline&&`Needed by: ${form.deadline}`,form.budget&&`Budget: ${form.budget}`,form.notes&&`Notes: ${form.notes}`,intl&&'Note: Import duties, clearance & international freight are separate.'].filter(Boolean).join('\n');
        window.open(waUrl(msg),'_blank');
      }
      onSaved && onSaved();
      onClose();
    }catch(e){setErr(e.message||'Could not save request.');}
    finally{setSaving(false);}
  };

  return <Modal open={open} onClose={onClose} eyebrow={isIntro?'Request Introduction':'Request Quotation'} maxWidth="44rem">
    <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>{isIntro?'Pitch to this buyer':'Request a quotation'}</h2>
    <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 16px'}}>
      {isIntro?'Introduce your business and why you are a good match for their sourcing needs.':'Your request will be tracked in "My Requests" in your dashboard.'}
      {preselected&&<span style={{display:'block',marginTop:8,color:'#8A6828',fontWeight:600}}><i className="fas fa-info-circle"></i> Target: {preselected.name}</span>}
    </p>
    
    <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}}>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Your name *</label><TIn value={form.name} onChange={v=>setForm({...form,name:v})}/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business</label><TIn value={form.business} onChange={v=>setForm({...form,business:v})}/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone *</label><TIn value={form.phone} onChange={v=>setForm({...form,phone:v})}/></div>
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label><TIn value={form.email} onChange={v=>setForm({...form,email:v})}/></div>
    </div>
    
    <div style={{marginTop:14}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{isIntro?'Your pitch / offering *':'Product *'}</label><TIn value={form.product} onChange={v=>setForm({...form,product:v})} placeholder={isIntro?'e.g. We supply high quality imported fabric...':'e.g. 50 bags of cement, fabric rolls...'}/></div>
    
    {!isIntro && <>
      <div style={{marginTop:14,display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))'}}>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Quantity</label><TIn value={form.quantity} onChange={v=>setForm({...form,quantity:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Needed by</label><TIn type="date" value={form.deadline} onChange={v=>setForm({...form,deadline:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Budget</label><TIn value={form.budget} onChange={v=>setForm({...form,budget:v})}/></div>
      </div>
      <div style={{marginTop:14}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Delivery destination</label>
        <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <select value={form.deliveryCountry||'Zambia'} onChange={e=>setForm({...form,deliveryCountry:e.target.value,deliveryCity:''})} style={{...INP_STYLE,cursor:'pointer'}}>
            {COUNTRIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          {(!form.deliveryCountry||form.deliveryCountry==='Zambia')?(
            <select value={form.deliveryCity} onChange={e=>setForm({...form,deliveryCity:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
              <option value="">City</option>
              {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          ):(
            <TIn value={form.deliveryCity} onChange={v=>setForm({...form,deliveryCity:v})} placeholder="City / port"/>
          )}
        </div>
        <div style={{marginTop:10,background:'rgba(27,108,168,.06)',border:'1px dashed rgba(27,108,168,.3)',borderRadius:8,padding:'10px 14px',fontSize:11.5,lineHeight:1.6,color:'rgba(10,31,18,.7)'}}>
          <i className="fas fa-circle-info" style={{color:'#1B6CA8',marginRight:6}}></i>
          Import duties, customs clearance and international freight are separate and not included in supplier quotes.
        </div>
      </div>
    </>}

    <label style={{display:'flex',gap:12,alignItems:'flex-start',marginTop:18,cursor:'pointer',background:'rgba(232,115,15,.04)',padding:'12px 14px',borderRadius:8,border:'1px solid rgba(232,115,15,.2)'}}>
      <input type="checkbox" checked={agreeFee} onChange={e=>setAgreeFee(e.target.checked)} style={{marginTop:3,width:16,height:16,accentColor:'#E8730F',flexShrink:0}}/>
      <div style={{fontSize:12,color:'rgba(10,31,18,.75)',lineHeight:1.5}}>
        <strong>StartEasy Commercial Agreement:</strong> I understand that StartEasy facilitates this introduction. If we close a deal, StartEasy may charge a small success fee (e.g., 2% of transaction value) to cover administrative and matchmaking costs.
      </div>
    </label>

    {err&&<div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}>{err}</div>}
    
    <div style={{display:'flex',gap:10,marginTop:20,flexWrap:'wrap'}}>
      <button onClick={submit} disabled={saving} style={{flex:'1 1 240px',padding:'14px',background:saving?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
        {saving?<><i className="fas fa-spinner fa-spin"></i> Saving…</>:'Send via WhatsApp & save'}
      </button>
      <button onClick={onClose} style={{padding:'14px 22px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13.5,fontWeight:600,color:'#0A1F12'}}>Cancel</button>
    </div>
  </Modal>;
}

/* ═══════════════════ SEED VIEW ═══════════════════ */
function SeedView(){
  const [user,setUser]=useState(null);
  const [isAdmin,setIsAdmin]=useState(false);
  const [checking,setChecking]=useState(true);
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [signingIn,setSigningIn]=useState(false);
  const [err,setErr]=useState('');
  const [status,setStatus]=useState(null);
  const [seeding,setSeeding]=useState(false);
  const [counts,setCounts]=useState({sup:null,buy:null});

  const loadCounts=async()=>{
    if(!firebaseReady) return;
    try{const [s,b]=await Promise.all([db.collection('se_suppliers').get(),db.collection('se_buyers').get()]);setCounts({sup:s.size,buy:b.size});}
    catch(e){setCounts({sup:'?',buy:'?'});}
  };
  useEffect(()=>{
    if(!firebaseReady) return;
    const unsub=auth.onAuthStateChanged(async u=>{
      setUser(u);setIsAdmin(false);
      if(u&&u.email&&u.providerData&&u.providerData.length){
        try{const snap=await db.collection('se_admins').doc(u.uid).get();setIsAdmin(snap.exists);if(snap.exists) loadCounts();}
        catch(e){}
      }
      setChecking(false);
    });
    return unsub;
  },[]);
  const handleSignIn=async()=>{
    setErr('');
    if(!email.trim()||!pw){setErr('Enter email and password.');return;}
    setSigningIn(true);
    try{await auth.signInWithEmailAndPassword(email.trim(),pw);}
    catch(e){setErr(authErrorMessage(e));}
    finally{setSigningIn(false);}
  };
  const handleSignOut=async()=>{await auth.signOut();setEmail('');setPw('');setStatus(null);};
  const handleSeed=async()=>{
    if(!isAdmin){setStatus({kind:'err',msg:'Admins only.'});return;}
    setSeeding(true);setStatus({kind:'info',msg:'Seeding…'});
    try{
      const batch=db.batch();
      SEED_SUPPLIERS.forEach(s=>batch.set(db.collection('se_suppliers').doc(s.id),s));
      SEED_BUYERS.forEach(b=>batch.set(db.collection('se_buyers').doc(b.id),b));
      await batch.commit();
      setStatus({kind:'ok',msg:'✅ Done. Wrote '+SEED_SUPPLIERS.length+' suppliers and '+SEED_BUYERS.length+' buyers.'});
      loadCounts();
    }catch(e){setStatus({kind:'err',msg:'Failed: '+(e.code||e.message)});}
    finally{setSeeding(false);}
  };
  return <div style={{minHeight:'100vh',background:'#F5FAF6',padding:'32px 20px'}}>
    <div style={{maxWidth:560,margin:'0 auto',background:'#fff',border:'1px solid rgba(10,31,18,.1)',borderRadius:14,padding:'28px'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>
        <Mark size={42}/>
        <div><div style={{fontSize:9,textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.4)'}}>StartEasy</div><div className="serif" style={{fontSize:20,fontWeight:800,color:'#0A1F12'}}>Seed panel</div></div>
      </div>
      {checking?<div style={{textAlign:'center',padding:'24px 0'}}><i className="fas fa-spinner fa-spin"></i></div>:
      !user||!user.email?<>
        <p style={{fontSize:13,color:'rgba(10,31,18,.7)',margin:'0 0 18px'}}>Sign in with your admin account.</p>
        <label style={{display:'block',fontSize:12,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...INP_STYLE,marginBottom:12}}/>
        <label style={{display:'block',fontSize:12,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Password</label>
        <PasswordInput value={pw} onChange={setPw} autoComplete="current-password"/>
        <button onClick={handleSignIn} disabled={signingIn} style={{width:'100%',padding:'13px',background:signingIn?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:14,fontWeight:700,marginTop:14,marginBottom:10}}>{signingIn?'Signing in…':'Sign in'}</button>
        <a href="#" onClick={e=>{e.preventDefault();window.location.hash='';}} style={{display:'block',textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.5)',textDecoration:'none',padding:'8px'}}>← Back</a>
        {err&&<div style={{background:'rgba(184,86,79,.1)',border:'1px solid rgba(184,86,79,.3)',borderRadius:9,padding:'10px 14px',fontSize:12.5,color:'#7C2318',marginTop:12}}>{err}</div>}
      </>:
      !isAdmin?<>
        <div style={{background:'rgba(184,86,79,.1)',border:'1px solid rgba(184,86,79,.3)',borderRadius:9,padding:'12px 14px',fontSize:13,color:'#7C2318',marginBottom:16}}>Signed in as {user.email} but not admin.</div>
        <button onClick={handleSignOut} style={{width:'100%',padding:'12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700}}>Sign out</button>
      </>:<>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}><i className="fas fa-circle-check" style={{color:'#1E7B3C'}}></i><span style={{fontSize:13,color:'rgba(10,31,18,.7)'}}>{user.email}</span></div>
        <div style={{background:'#F5FAF6',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:'14px 16px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>Payload: suppliers</span><strong>{SEED_SUPPLIERS.length}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>Payload: buyers</span><strong>{SEED_BUYERS.length}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0',borderBottom:'1px dashed rgba(10,31,18,.08)'}}><span>Firestore: suppliers</span><strong>{counts.sup===null?'—':counts.sup}</strong></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'6px 0'}}><span>Firestore: buyers</span><strong>{counts.buy===null?'—':counts.buy}</strong></div>
        </div>
        <button onClick={handleSeed} disabled={seeding} style={{width:'100%',padding:'13px',background:seeding?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:14,fontWeight:700,marginBottom:10}}>{seeding?'Seeding…':'Seed directory'}</button>
        <button onClick={handleSignOut} style={{width:'100%',padding:'11px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700,marginBottom:10}}>Sign out</button>
        <a href="#" onClick={e=>{e.preventDefault();window.location.hash='';}} style={{display:'block',textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.5)',textDecoration:'none',padding:'8px'}}>← Back</a>
        {status&&<div style={{background:status.kind==='ok'?'rgba(30,123,60,.1)':'rgba(184,86,79,.1)',border:'1px solid '+(status.kind==='ok'?'rgba(30,123,60,.3)':'rgba(184,86,79,.3)'),color:status.kind==='ok'?'#0F5C2A':'#7C2318',borderRadius:9,padding:'12px 14px',fontSize:12.5,marginTop:16}}>{status.msg}</div>}
      </>}
    </div>
  </div>;
}

/* ═══════════════════ APP ═══════════════════ */
function App(){
  const [hash,setHash]=useState(()=>window.location.hash);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [authOpen,setAuthOpen]=useState(false);
  const [authMode,setAuthMode]=useState('signup');
  const [authRole,setAuthRole]=useState('buyer');
  const [rfqOpen,setRfqOpen]=useState(false);
  const [rfqPreselected,setRfqPreselected]=useState(null);
  const [rfqType,setRfqType]=useState('quote');
  const [justSignedUp,setJustSignedUp]=useState(false);

  useEffect(()=>{
    if(!firebaseReady){setAuthLoading(false);return;}
    const unsub=auth.onAuthStateChanged(u=>{
      setAuthLoading(false);
      if(authOpen) return;
      setUser(u&&u.email?u:null);
    });
    return unsub;
  },[authOpen]);

  useEffect(()=>{
    const onHash=()=>setHash(window.location.hash);
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);

  const openAuth=(mode,role)=>{setAuthMode(mode||'signup');setAuthRole(role||'buyer');setAuthOpen(true);};
  const closeAuth=()=>setAuthOpen(false);
  const handleAuthSuccess=(target='dashboard', fromSignup=false)=>{
    closeAuth();
    if(auth.currentUser && auth.currentUser.email) setUser(auth.currentUser);
    if(fromSignup){ setJustSignedUp(true); return; }
    window.location.hash = target==='browse' ? '#browse' : '#dashboard';
  };
  const goHome=()=>{window.location.hash='';};
  const goDashboard=()=>{window.location.hash='#dashboard';};
  const goBrowse=()=>{window.location.hash='#browse';};
  const openRFQ=(supplier)=>{setRfqPreselected(supplier||null);setRfqType('quote');setRfqOpen(true);};
  const openIntro=(buyer)=>{setRfqPreselected(buyer||null);setRfqType('intro');setRfqOpen(true);};
  const closeRFQ=()=>{setRfqOpen(false);setRfqPreselected(null);};
  const signedOut=()=>{setUser(null);setJustSignedUp(false);goHome();};

  if(hash==='#seed') return <SeedView/>;

  const authModal = <AuthModal open={authOpen} initialMode={authMode} initialRole={authRole} onClose={closeAuth} onAuthSuccess={handleAuthSuccess}/>;

  let mainView;

  if(authLoading){
    mainView = <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;
  } else if(justSignedUp && user){
    mainView = <Welcome user={user} onDashboard={()=>{setJustSignedUp(false);window.location.hash='#dashboard';}} onBrowse={()=>{setJustSignedUp(false);window.location.hash='#browse';}} onSignedOut={()=>{setJustSignedUp(false);setUser(null);window.location.hash='';}}/>;
  } else if(hash==='#dashboard' || hash==='#browse'){
    if(!user){
      mainView = <SignInPrompt onSignIn={()=>openAuth('signin','buyer')} onSignUp={()=>openAuth('signup','buyer')} onHome={goHome}/>;
    } else if(hash==='#dashboard'){
      mainView = <Dashboard user={user} onBrowse={goBrowse} onSignedOut={signedOut}/>;
    } else {
      mainView = <><Browse user={user} onRequestQuote={openRFQ} onRequestIntro={openIntro} onDashboard={goDashboard} onSignedOut={signedOut}/><RFQModal open={rfqOpen} onClose={closeRFQ} preselected={rfqPreselected} type={rfqType} user={user} onSaved={()=>{}}/></>;
    }
  } else if(!user){
    mainView = <Landing onSignup={(role)=>openAuth('signup',role||'buyer')} onSignin={()=>openAuth('signin','buyer')}/>;
  } else {
    mainView = <Dashboard user={user} onBrowse={goBrowse} onSignedOut={signedOut}/>;
  }

  return <>{mainView}{authModal}</>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
