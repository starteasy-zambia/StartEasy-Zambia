<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const ADMIN_WHATSAPP = '260762499581';
const CONTACT_EMAIL = 'directory@starteasyzambia.com';
const MAIN_PLATFORM_URL = 'https://www.starteasyzambia.com';
const SIGNATORY_NAME = 'MWABA LEWIS';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
  authDomain: "starteasy-zambia.firebaseapp.com",
  projectId: "starteasy-zambia",
  storageBucket: "starteasy-zambia.firebasestorage.app",
  messagingSenderId: "54136399237",
  appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec",

};
let db = null, auth = null, firebaseReady = false;
try {
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();

} catch (e) { console.error('[SE] Firebase init failed:', e); }

/* ═══ NEW: Global Toast Helper ═══ */
function toast(msg, type='success'){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="ic fas ${type==='error'?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${String(msg).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition='opacity .3s, transform .3s';
    el.style.opacity='0';
    el.style.transform='translateX(20px)';
    setTimeout(()=>el.remove(),320);
  }, 3600);
}

function isMobile(){return typeof navigator!=='undefined'&&/android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent||'').toLowerCase());}
function waUrl(msg,p){const phone=p||ADMIN_WHATSAPP;const e=encodeURIComponent(msg);return isMobile()?'whatsapp://send?phone='+phone+'&text='+e:'https://wa.me/'+phone+'?text='+e;}
function splitCSV(str){return (str||'').split(',').map(s=>s.trim()).filter(Boolean);}
function initials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '·';}
function fmtDate(d){ if(!d) return '—'; const x = new Date(d); return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function authErrorMessage(e){
  const code=(e&&e.code)||'';
  if(code==='auth/email-already-in-use') return 'This email is already registered. Try signing in.';
  if(code==='auth/invalid-email') return 'That email address is not valid.';
  if(code==='auth/weak-password') return 'Password must be at least 6 characters.';
  if(code==='auth/wrong-password'||code==='auth/invalid-credential') return 'Incorrect email or password.';
  if(code==='auth/user-not-found') return 'No account with that email.';
  if(code==='auth/too-many-requests') return 'Too many attempts. Try again in a minute.';
  if(code==='auth/network-request-failed') return 'Network error.';
  if(code==='auth/operation-not-allowed') return 'Email sign-in is not enabled in Firebase Console.';
  if(code==='auth/missing-email') return 'Enter your email address.';
  return 'Sign-in failed: '+(code||(e&&e.message)||'unknown');
}

/* ═══ NEW: LocalStorage helpers for saved suppliers & alerts ═══ */
function lsGet(key, fallback=[]){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;} }
function lsSet(key, val){ try{localStorage.setItem(key, JSON.stringify(val));}catch(e){} }
function getSavedSuppliers(uid){ return lsGet('se_saved_'+uid, []); }
function setSavedSuppliers(uid, arr){ lsSet('se_saved_'+uid, arr); }
function getAlerts(uid){ return lsGet('se_alerts_'+uid, []); }
function setAlerts(uid, arr){ lsSet('se_alerts_'+uid, arr); }

async function fsLoadDirectory(){
  if(!firebaseReady) return null;
  try{
    const [s,b]=await Promise.all([db.collection('se_suppliers').get(),db.collection('se_buyers').get()]);
    return {suppliers:s.docs.map(d=>({id:d.id,...d.data()})),buyers:b.docs.map(d=>({id:d.id,...d.data()}))};
  }catch(e){console.warn('[SE] load dir:',e&&e.message);return null;}
}
async function loadUserProfile(uid){
  if(!firebaseReady) return null;
  try{const snap=await db.collection('se_users').doc(uid).get();return snap.exists?snap.data():null;}
  catch(e){console.warn('[SE] load profile:',e&&e.message);return null;}
}
async function loadUserQuotes(uid){
  if(!firebaseReady) return [];
  try{
    const snap=await db.collection('se_quotes').where('userId','==',uid).get();
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    return docs.sort((a,b)=>(b.at||0)-(a.at||0));
  }catch(e){console.warn('[SE] load quotes:',e&&e.message);return [];}
}
async function saveQuote(quote){
  if(!firebaseReady) return false;
  try{await db.collection('se_quotes').add(quote);return true;}
  catch(e){console.warn('[SE] save quote:',e&&e.message);return false;}
}

async function addPayment(rec){
  if(!firebaseReady) return null;
  const record = { ...rec, status: 'under_review', submittedAt: Date.now(), history: [{ status: 'under_review', at: Date.now(), note: 'Payment reference received. Awaiting officer verification.' }] };
  try { await db.collection('se_payments').doc(rec.ref).set(record); return record; }

}

async function authSignUp(form){
  if(!firebaseReady) throw new Error('Firebase not ready');
  let cred=null;
  try{
    cred=await auth.createUserWithEmailAndPassword(form.email,form.password);
    const profile={
      name:form.name,businessName:form.businessName,phone:form.phone,email:form.email,
      role:form.role,category:form.category,location:form.location,
      country:form.country||'Zambia',scope:form.scope||'local',
      status:'pending',createdAt:Date.now()
    };
    if(form.role==='supplier'){
      profile.products=splitCSV(form.products);
      profile.moq=form.moq||'Contact supplier';
      profile.delivery=form.delivery||'Contact supplier';
      profile.leadTime=form.leadTime||'Contact supplier';
    }
    if(form.role==='buyer'){
      profile.sources=splitCSV(form.sources);
      profile.frequency=form.frequency||'Monthly';
      profile.orderValue=form.orderValue||'Contact buyer';
    }
    await db.collection('se_users').doc(cred.user.uid).set(profile);
    return { email: form.email };
  } finally {
    try { await auth.signOut(); } catch(_){}
  }
}
async function authSignIn(email,password){
  if(!firebaseReady) throw new Error('Firebase not ready');
  return auth.signInWithEmailAndPassword(email,password);
}

function isInternationalEntity(e){
  if(!e) return false;
  if(e.scope==='international'||e.scope==='both') return true;
  if(e.country && e.country!=='Zambia') return true;
  return false;
}
function locLabel(e){
  if(!e) return '';
  const parts=[e.location];
  if(e.country && e.country!=='Zambia' && e.country!==e.location) parts.push(e.country);
  return parts.filter(Boolean).join(', ');
}

function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{
    if(open){document.body.style.overflow='hidden';}else{document.body.style.overflow='';}
    return ()=>{document.body.style.overflow='';};
  },[open]);
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    if(open)window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[open,onClose]);
  if(!open) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 mf"
      style={{background:'rgba(10,31,18,0.85)',position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}
      onClick={onClose}>
      <div className="mc" onClick={e=>e.stopPropagation()}
        style={{background:'#F5FAF6',borderRadius:12,width:'100%',maxWidth:maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 30px 80px rgba(0,0,0,.35)'}}>
        <div style={{background:'#0A1F12',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10,borderBottom:'1px solid rgba(245,166,35,.15)'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}></span>
            <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623'}}>{eyebrow||'StartEasy'}</span>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.6)',cursor:'pointer',padding:6,fontSize:16}} aria-label="Close"><i className="fas fa-times"></i></button>
        </div>
        <div style={{padding:'24px 28px'}}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

      <i className={`fas ${show?'fa-eye-slash':'fa-eye'}`}></i>
    </button>
  </div>;
}

function Engagement({service,onClose,onAgreed}){
  const [client,setClient]=useState({name:'',business:'',email:'',phone:''});
  const [agreed,setAgreed]=useState(false);
  const [error,setError]=useState('');
  if(!service)return null;
  const s=service;
  const proceed=()=>{
    setError('');
    if(!client.name.trim()){setError('Please enter your full name.');return}
    if(!client.email.trim()){setError('Please enter your email.');return}
    if(!agreed){setError('Please confirm you agree to the engagement terms.');return}
    onAgreed({client,service:s});
  };
  return <Modal open={!!s} onClose={onClose} eyebrow="Engagement proposal" maxWidth="54rem">
    <EngagementLetterBody service={s} clientName={client.name} clientBusiness={client.business} clientEmail={client.email} readOnly={false}/>
    <div style={{marginTop:22,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:24}}>
      <div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:14}}>Client details</div>
      <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Full name *</label><TIn value={client.name} onChange={v=>setClient({...client,name:v})} placeholder="Your full name"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Business name</label><TIn value={client.business} onChange={v=>setClient({...client,business:v})} placeholder="If applicable"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Email *</label><TIn type="email" value={client.email} onChange={v=>setClient({...client,email:v})} placeholder="you@company.com"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Phone / WhatsApp</label><TIn value={client.phone} onChange={v=>setClient({...client,phone:v})} placeholder="+260 ..."/></div>
      </div>
      <label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.85)',cursor:'pointer',lineHeight:1.6,marginTop:18}}>
        <input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:3,cursor:'pointer'}}/>
        <span>I have read and agree to the engagement proposal, scope, fees and terms above. I understand this is a StartEasy engagement and that StartEasy is not a government authority, regulator, law firm, auditor or tax adviser.</span>
      </label>
      {error&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#B8564F',fontSize:12.5,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-exclamation-circle"></i> {error}</div>}
      <div style={{display:'flex',flexWrap:'wrap',gap:12,marginTop:20}}>
        <button onClick={proceed} style={{flex:'1 1 240px',padding:'15px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:9}}><i className="fas fa-check-circle"></i> Agree and proceed to payment</button>
        <button onClick={onClose} style={{padding:'15px 24px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Cancel</button>
      </div>
    </div>
  </Modal>;
}

function Payment({service,client,onClose,onDone}){
  const s=service;
  const amountDue=s.amountOverride || (s.service?SF[s.service].zm:'Free');
  const receiptPrefix='SE-'+(s.code||'DIR');
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState(client.name||'');
  const [senderContact,setSenderContact]=useState(client.phone||client.email||'');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [cloudSaved,setCloudSaved]=useState(null);
  const [receiptNo,setReceiptNo]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [whatsappSent,setWhatsappSent]=useState(false);
  const [copied,setCopied]=useState('');

  const copyTxt=(t,k)=>{const done=()=>{setCopied(k);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);else done()};

  const buildMsg=(r,dt)=>['*STARTEASY — ENGAGEMENT FEE*','','*Ref:* '+r,'*Date:* '+dt,'','*Client:* '+client.name,'*Business:* '+(client.business||'—'),'*Email:* '+client.email,'','*Engagement:*',(s.code||'DIR')+' — '+s.title,'','*Fee:*',amountDue,'','*Payment*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Sender: '+senderName,'Contact: '+senderContact,'TxID: '+userRef].join('\n');

  const confirm=async()=>{
    setErrorMsg('');
    if(!method){setErrorMsg('Select a payment method.');return}
    if(!senderName.trim()){setErrorMsg('Enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Enter the phone or email used.');return}
    if(!userRef.trim()){setErrorMsg('Enter your transaction reference.');return}
    if(!agree){setErrorMsg('Tick the confirmation box.');return}
    setSaving(true);
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const dt=new Date().toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const record = {ref:rcpt,clientName:client.name,clientEmail:client.email,clientPhone:client.phone||'',clientBusiness:client.business||'',serviceCode:s.code||'DIR',serviceTitle:s.title,serviceDesk:s.desk||'directory',serviceClientDesc:s.clientDesc,serviceTimeline:s.timeline,serviceFee:amountDue,serviceFeeLabel:'Service Fee',whatsCovered:s.whatsCovered||[],wizardData:s._wizardData||null,amount:amountDue,method:PAYMENT_METHODS[method]?.label||method,senderName,senderContact,txRef:userRef,receiptDate:dt};
    const saved = await addPayment(record);
    setCloudSaved(saved ? 'ok' : 'fail');
    setReceiptNo(rcpt);
    setWhatsappUrl(waUrl(buildMsg(rcpt,dt)));
    setConfirmed(true);
    setSaving(false);
  };

  if(confirmed){
    return <div className="fadein">
      <div style={{background:'linear-gradient(135deg,#EAF7EE,#F0FBF4)',border:'2px solid #28A745',borderRadius:14,padding:'28px 24px',textAlign:'center'}}>
        <i className="fas fa-paper-plane" style={{fontSize:56,color:'#E8730F',marginBottom:12,display:'block'}}></i>

        <p style={{fontSize:13.5,color:'rgba(10,31,18,.7)',marginBottom:14}}>Reference: <strong>{receiptNo}</strong></p>
        {cloudSaved==='ok'&&<p style={{fontSize:12,color:'#1E7B3C',marginBottom:6,fontWeight:600}}><i className="fas fa-cloud-upload-alt" style={{marginRight:6}}></i>Synced to StartEasy records — the officer sees this now.</p>}
        {cloudSaved==='fail'&&<p style={{fontSize:12,color:'#B8564F',marginBottom:6,fontWeight:600}}><i className="fas fa-triangle-exclamation" style={{marginRight:6}}></i>Cloud sync delayed — please send proof on WhatsApp below.</p>}
        <p style={{fontSize:13,color:'rgba(10,31,18,.7)',lineHeight:1.65,maxWidth:'54ch',margin:'0 auto 18px'}}>Your submission is now <strong style={{color:'#8A6828'}}>Under Review</strong>. A StartEasy officer will verify your payment — usually within 4 working hours.</p>
        <div style={{background:'#fff',border:'1px dashed #25D366',borderRadius:12,padding:18,marginTop:18,textAlign:'left'}}>
          <div style={{fontSize:12.5,fontWeight:800,letterSpacing:'.6px',color:'#075E54',marginBottom:10,display:'flex',alignItems:'center',gap:8,textTransform:'uppercase'}}><i className="fab fa-whatsapp" style={{color:'#25D366',fontSize:16}}></i> Send your reference to the officer</div>
          <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" onClick={()=>setWhatsappSent(true)} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'#25D366',color:'#fff',padding:'13px 22px',borderRadius:10,fontSize:14,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i><span>Send to officer on WhatsApp</span></a>
          <button type="button" onClick={()=>copyTxt(buildMsg(receiptNo,''),'msg')} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',marginTop:10,padding:'11px 18px',background:'#fff',border:'1.5px solid #25D366',color:'#075E54',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className={`fas ${copied==='msg'?'fa-check':'fa-copy'}`}></i>{copied==='msg'?'Copied':'Copy message'}</button>
        </div>
        <div style={{background:'linear-gradient(135deg,#0A1F12,#123A1F)',borderRadius:12,padding:'20px 22px',marginTop:18,color:'#fff',textAlign:'left'}}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase',color:'#F5A623',marginBottom:14,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-route"></i> What happens next</div>
          <ol className="tl">
            <li data-step="1"><div className="tt">Payment reference received</div><div className="td">Your submission is logged in the StartEasy queue.</div><span className="tw">Done</span></li>
            <li data-step="2"><div className="tt">Officer verifies manually</div><div className="td">A StartEasy officer matches your reference against our records.</div><span className="tw">Within 4 working hours</span></li>
            <li data-step="3"><div className="tt">Engagement letter unlocked</div><div className="td">Once approved, you can print or download the formal engagement letter from the status page.</div><span className="tw">Same working day</span></li>
            <li data-step="4"><div className="tt">Report delivered</div><div className="td">Your formal StartEasy-branded report is delivered to your email.</div><span className="tw">Within 1 hour of approval</span></li>
          </ol>
        </div>
        <button type="button" onClick={onDone} style={{marginTop:18,padding:'12px 24px',border:'1px solid rgba(10,31,18,.2)',background:'#fff',borderRadius:8,fontSize:13.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Close and return home</button>
      </div>
    </div>;
  }

  const m=method?PAYMENT_METHODS[method]:null;
  return <div>
    <div style={{background:'linear-gradient(135deg,#0A1F12,#123A1F)',color:'#fff',borderRadius:14,padding:'22px 24px',marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'center',gap:20,flexWrap:'wrap'}}>
      <div>
        <div style={{fontSize:11,fontWeight:800,letterSpacing:'1.8px',textTransform:'uppercase',color:'#F5A623',marginBottom:6}}>Service Fee — due on acceptance</div>

      <i className="fas fa-shield-alt" style={{fontSize:44,color:'#F5A623',opacity:.65,flexShrink:0}}></i>

      <div>Pay directly to the account shown, then submit your transaction reference. A StartEasy officer verifies it manually.</div>

          <div className="nm">{pm.label}</div>
          <div className="ds">{pm.sub}</div>
        </button>
      ))}
    </div>
    {m&&<div style={{marginTop:14,background:'#fff',border:'2px solid rgba(10,31,18,.12)',borderRadius:14,overflow:'hidden'}}>

      <button type="button" onClick={confirm} disabled={saving} style={{width:'100%',marginTop:16,padding:'14px 20px',background:saving?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:saving?'wait':'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:10}}><i className={`fas ${saving?'fa-spinner fa-spin':'fa-paper-plane'}`}></i>{saving?'Saving to server…':'Submit payment reference'}</button>
    </div>}
    {!m&&<p style={{textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.45)',marginTop:24,fontStyle:'italic'}}>Select a payment method above to see the account details.</p>}
  </div>;
}

/* ═══════════════════ AUTH MODAL ═══════════════════ */
function AuthModal({open,initialMode='signup',initialRole='buyer',onClose,onAuthSuccess}){
  const [mode,setMode]=useState(initialMode);
  const [role,setRole]=useState(initialRole);
  const [err,setErr]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [resetSent,setResetSent]=useState(false);
  const [resetEmail,setResetEmail]=useState('');
  const [signupSuccess,setSignupSuccess]=useState(false);
  const [form,setForm]=useState({name:'',businessName:'',email:'',phone:'',password:'',category:'',location:'',country:'Zambia',scope:'local',products:'',moq:'',delivery:'',leadTime:'',sources:'',frequency:'Monthly',orderValue:''});

  useEffect(()=>{
    if(open){
      setMode(initialMode);
      setRole(initialRole);
      setErr('');
      setResetSent(false);
      setResetEmail('');
      setSignupSuccess(false);
    }
  },[open,initialMode,initialRole]);

  const submit=async()=>{
    setErr('');

    if(mode==='forgot'){
      const email=form.email.trim();
      if(!email) return setErr('Enter your email.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('That email address is not valid.');
      if(!firebaseReady) return setErr('Auth service unavailable. Please try again.');
      setSubmitting(true);
      try{
        await auth.sendPasswordResetEmail(email);
        setResetEmail(email);
        setResetSent(true);
      }catch(e){
        const code=(e&&e.code)||'';
        if(code==='auth/user-not-found'){
          setResetEmail(email);
          setResetSent(true);
        }else{
          setErr(authErrorMessage(e));
        }
      }finally{setSubmitting(false);}
      return;
    }

    if(mode==='signin'){
      if(!form.email.trim()) return setErr('Enter your email.');
      if(!form.password) return setErr('Enter your password.');
      setSubmitting(true);
      try{
        await authSignIn(form.email.trim(),form.password);
        onAuthSuccess && onAuthSuccess('dashboard', false);
      }catch(e){
        setErr(authErrorMessage(e));
      }finally{setSubmitting(false);}
      return;
    }

    if(!form.name.trim()) return setErr('Enter your full name.');
    if(!form.businessName.trim()) return setErr('Enter your business name.');
    if(!form.email.trim()) return setErr('Enter your email.');
    if(!form.phone.trim()) return setErr('Enter your phone.');
    if(!form.category) return setErr('Choose a category.');
    if(!form.location||!form.location.trim()) return setErr('Enter your city / region.');
    if(form.password.length<6) return setErr('Password must be at least 6 characters.');
    if(role==='supplier' && !form.products.trim()) return setErr('List the products you supply.');
    if(role==='buyer' && !form.sources.trim()) return setErr('List what you buy regularly.');
    setSubmitting(true);
    try{
      const result = await authSignUp({...form,role});
      setSignupSuccess(true);
      setMode('signin');
      setForm(f=>({...f,email:result.email,password:''}));
      setRole(role);
    }catch(e){
      setErr(authErrorMessage(e));
    }finally{setSubmitting(false);}
  };

  if(mode==='forgot' && resetSent){
    return <Modal open={open} onClose={onClose} eyebrow="Reset link sent" maxWidth="40rem">
      <div style={{textAlign:'center',padding:'12px 0'}}>
        <div style={{width:64,height:64,borderRadius:'50%',background:'rgba(30,123,60,.12)',color:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,margin:'0 auto 16px'}}>
          <i className="fas fa-envelope-circle-check"></i>
        </div>
        <h2 className="serif" style={{fontSize:'clamp(1.4rem,3vw,1.75rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 10px'}}>Check your email</h2>
        <p style={{fontSize:13.5,lineHeight:1.7,color:'rgba(10,31,18,.7)',margin:'0 auto 8px',maxWidth:380}}>
          If an account exists for <strong style={{color:'#0A1F12',wordBreak:'break-all'}}>{resetEmail}</strong>, we've sent a password reset link.
        </p>
        <p style={{fontSize:12,lineHeight:1.6,color:'rgba(10,31,18,.55)',margin:'0 auto 22px',maxWidth:380}}>
          Click the link in that email to set a new password. Check your spam folder if it doesn't arrive within a minute.
        </p>
        <button onClick={()=>{setMode('signin');setResetSent(false);setErr('');}} style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,marginBottom:10}}>
          Back to sign in
        </button>
        <button onClick={()=>{setResetSent(false);setErr('');}} style={{width:'100%',padding:'12px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
          Use a different email
        </button>
      </div>
    </Modal>;
  }

  if(mode==='forgot'){
    return <Modal open={open} onClose={onClose} eyebrow="Reset password" maxWidth="40rem">
      <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>Forgot your password?</h2>
      <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 20px'}}>
        Enter the email you signed up with. We'll send a secure link to reset your password.
      </p>
      <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label>
      <TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@business.zm"/>
      {err && <div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}>
        <i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}
      </div>}
      <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
        {submitting?<><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Sending…</>:'Send reset link'}
      </button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{width:'100%',marginTop:10,padding:'12px',background:'transparent',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
        ← Back to sign in
      </button>
    </Modal>;
  }

  const eyebrowText = signupSuccess ? 'Sign in to continue' : (mode==='signin' ? 'Welcome back' : 'Create your account');

  return <Modal open={open} onClose={onClose} eyebrow={eyebrowText} maxWidth="40rem">
    {!signupSuccess && <div style={{display:'flex',gap:6,marginBottom:18,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:5}}>
      <button onClick={()=>{setMode('signup');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signup'?'#0A1F12':'transparent',color:mode==='signup'?'#fff':'rgba(10,31,18,.65)'}}>Create account</button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signin'?'#0A1F12':'transparent',color:mode==='signin'?'#fff':'rgba(10,31,18,.65)'}}>Sign in</button>
    </div>}

    {signupSuccess && <div style={{background:'rgba(30,123,60,.06)',border:'1px solid rgba(30,123,60,.3)',borderRadius:10,padding:'14px 16px',marginBottom:16,display:'flex',gap:12,alignItems:'flex-start'}}>
      <i className="fas fa-circle-check" style={{color:'#1E7B3C',fontSize:18,marginTop:1,flexShrink:0}}></i>
      <div>
        <div style={{fontSize:13.5,fontWeight:800,color:'#0F5C2A',marginBottom:4}}>Account created successfully</div>
        <div style={{fontSize:12.5,lineHeight:1.55,color:'rgba(10,31,18,.75)'}}>For security, sign in with your email and password to continue to your dashboard.</div>
      </div>
    </div>}

    {mode==='signup'&&<>
      <div style={{marginBottom:16}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:8}}>I am registering as a…</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <button onClick={()=>setRole('buyer')} style={{padding:'14px 12px',border:role==='buyer'?'2px solid #E8730F':'2px solid rgba(10,31,18,.1)',background:role==='buyer'?'rgba(232,115,15,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-cart-shopping" style={{color:'#E8730F',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Buyer</span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I source products</div>
          </button>
          <button onClick={()=>setRole('supplier')} style={{padding:'14px 12px',border:role==='supplier'?'2px solid #1B6CA8':'2px solid rgba(10,31,18,.1)',background:role==='supplier'?'rgba(27,108,168,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-truck-fast" style={{color:'#1B6CA8',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Supplier</span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I sell products</div>
          </button>
        </div>
      </div>
      <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',marginBottom:14}}>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Full name *</label><TIn value={form.name} onChange={v=>setForm({...form,name:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business name *</label><TIn value={form.businessName} onChange={v=>setForm({...form,businessName:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email *</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone *</label><TIn value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+260 …"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Category *</label>
          <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            <option value="">Choose</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
        </div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Country *</label>
          <select value={form.country||'Zambia'} onChange={e=>setForm({...form,country:e.target.value,location:''})} style={{...INP_STYLE,cursor:'pointer'}}>
            {COUNTRIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{(!form.country||form.country==='Zambia')?'City *':'City / Region *'}</label>
          {(!form.country||form.country==='Zambia')?(
            <select value={form.location} onChange={e=>setForm({...form,location:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
              <option value="">Choose</option>
              {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          ):(
            <TIn value={form.location} onChange={v=>setForm({...form,location:v})} placeholder="e.g. Guangzhou"/>
          )}
        </div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{role==='buyer'?'Sourcing scope *':'Delivery scope *'}</label>
          <select value={form.scope||'local'} onChange={e=>setForm({...form,scope:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            {SCOPE_OPTIONS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
          </select>
        </div>
      </div>
      {form.scope && form.scope!=='local' && <div style={{background:'rgba(27,108,168,.06)',border:'1px dashed rgba(27,108,168,.3)',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:11.5,lineHeight:1.6,color:'rgba(10,31,18,.7)'}}>
        <i className="fas fa-circle-info" style={{color:'#1B6CA8',marginRight:6}}></i>
        International sourcing: import duties, customs clearance and international freight are separate and are not included in supplier quotes.
      </div>}
      {role==='supplier'&&<div style={{background:'rgba(27,108,168,.04)',border:'1px dashed rgba(27,108,168,.25)',borderRadius:10,padding:'14px 16px',marginBottom:14}}>
        <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#1B6CA8',marginBottom:10}}>What you supply</div>
        <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Products * (comma-separated)</label><TIn value={form.products} onChange={v=>setForm({...form,products:v})} placeholder="e.g. Fabric rolls, uniform fabric"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Minimum order</label><TIn value={form.moq} onChange={v=>setForm({...form,moq:v})} placeholder="e.g. 50 metres"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Lead time</label><TIn value={form.leadTime} onChange={v=>setForm({...form,leadTime:v})} placeholder="e.g. 3–5 days"/></div>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Delivery coverage</label><TIn value={form.delivery} onChange={v=>setForm({...form,delivery:v})}/></div>
        </div>
      </div>}
      {role==='buyer'&&<div style={{background:'rgba(232,115,15,.04)',border:'1px dashed rgba(232,115,15,.25)',borderRadius:10,padding:'14px 16px',marginBottom:14}}>
        <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>What you buy</div>
        <div style={{display:'grid',gap:12,gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>What you buy * (comma-separated)</label><TIn value={form.sources} onChange={v=>setForm({...form,sources:v})} placeholder="e.g. Fresh vegetables, chicken"/></div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Frequency</label>
            <select value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
              {FREQUENCY_OPTIONS.map(f=><option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Typical order</label><TIn value={form.orderValue} onChange={v=>setForm({...form,orderValue:v})}/></div>
        </div>
      </div>}
      <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Password * <span style={{color:'rgba(10,31,18,.5)',fontWeight:500}}>(min 6 chars)</span></label><PasswordInput value={form.password} onChange={v=>setForm({...form,password:v})} autoComplete="new-password"/></div>
    </>}

    {mode==='signin'&&<>
      <p style={{fontSize:13.5,color:'rgba(10,31,18,.7)',margin:'0 0 16px'}}>{signupSuccess?'Enter your password to sign in.':'Sign in to reach your dashboard.'}</p>
      <div style={{marginBottom:14}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})}/></div>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <label style={{fontSize:11.5,fontWeight:700,color:'#0A1F12'}}>Password</label>
          {!signupSuccess && <button onClick={()=>{setMode('forgot');setErr('');}} style={{background:'none',border:'none',color:'#E8730F',fontSize:11.5,fontWeight:700,cursor:'pointer',textDecoration:'underline',padding:0,fontFamily:'inherit'}}>
            Forgot password?
          </button>}
        </div>
        <PasswordInput value={form.password} onChange={v=>setForm({...form,password:v})} autoComplete="current-password"/>
      </div>
      {signupSuccess && <button onClick={()=>{setSignupSuccess(false);setMode('signup');setErr('');}} style={{width:'100%',marginTop:14,padding:'10px',background:'transparent',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:12.5,fontWeight:600,color:'#0A1F12',cursor:'pointer',fontFamily:'inherit'}}>
        ← Use a different email
      </button>}
    </>}

    {err&&<div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}><i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}</div>}

    <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
      {submitting?<><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Please wait…</>:(mode==='signin'?'Sign in':'Create my account')}
    </button>

    {!signupSuccess && <p style={{fontSize:11.5,color:'rgba(10,31,18,.5)',marginTop:12,textAlign:'center',fontStyle:'italic'}}>
      {mode==='signin'?'New here?':'Have an account?'}{' '}
      <button onClick={()=>{setMode(mode==='signin'?'signup':'signin');setErr('');}} style={{background:'none',border:'none',color:'#E8730F',fontWeight:700,cursor:'pointer',textDecoration:'underline',fontSize:'inherit',padding:0,fontFamily:'inherit'}}>{mode==='signin'?'Create account':'Sign in'}</button>
    </p>}
  </Modal>;
}

              <button onClick={()=>onSignUp(null)} style={{padding:'10px 14px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700}}>Get started</button>
            </>)}
          </div>

            <i className={`fas ${menuOpen?'fa-times':'fa-bars'}`}></i>
          </button>
        </div>
      </div>

          <WelcomeRow k="Location" v={locLabel(profile)}/>
          <WelcomeRow k="Status" v={isVerified?'Verified':'Pending verification'}/>

        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>What would you like to do first?</div>

              <span style={{width:44,height:44,borderRadius:11,background:'rgba(27,108,168,.12)',color:'#1B6CA8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}><i className="fas fa-magnifying-glass"></i></span>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,color:'#0A1F12'}}>Browse {isSupplier?'buyers':'suppliers'} first</div><div style={{fontSize:12,color:'rgba(10,31,18,.6)',marginTop:2}}>See who's in your category right now</div></div>
              <i className="fas fa-arrow-right" style={{color:'rgba(10,31,18,.3)'}}></i>
            </button>
            <button onClick={onDashboard} style={{padding:'16px 18px',background:'linear-gradient(135deg,#E8730F,#F5A623)',border:'none',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,color:'#fff',boxShadow:'0 12px 28px -10px rgba(232,115,15,.5)'}}>
              <span style={{width:44,height:44,borderRadius:11,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}><i className="fas fa-house"></i></span>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800}}>Open my dashboard</div><div style={{fontSize:12,color:'rgba(255,255,255,.85)',marginTop:2}}>Track matches, requests, and your profile</div></div>
              <i className="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>;
}
function WelcomeRow({k,v}){
  return <div style={{display:'flex',justifyContent:'space-between',gap:12,padding:'7px 0',borderBottom:'1px dashed rgba(10,31,18,.06)',fontSize:13}}>
    <span style={{color:'rgba(10,31,18,.55)',fontWeight:600}}>{k}</span>
    <span style={{color:'#0A1F12',fontWeight:700,textAlign:'right'}}>{v||'—'}</span>
  </div>;
}

/* ═══════════════════ DASHBOARD (EarnUp-inspired rewrite) ═══════════════════ */
function Dashboard({user,onBrowse,onSignedOut}){
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('overview');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [matches,setMatches]=useState([]);
  const [quotes,setQuotes]=useState([]);
  const [savedSuppliers,setSavedSuppliersState]=useState([]);
  const [alerts,setAlertsState]=useState([]);
  const [editForm,setEditForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState(null);
  const [allSuppliers,setAllSuppliers]=useState([]);
  const [allBuyers,setAllBuyers]=useState([]);

  // Load profile + saved + alerts
  useEffect(()=>{
    if(!user){setLoading(false);return;}
    loadUserProfile(user.uid).then(p=>{
      setProfile(p);
      if(p) setEditForm({
        name:p.name||'',businessName:p.businessName||'',phone:p.phone||'',
        category:p.category||'',location:p.location||'',
        country:p.country||'Zambia',scope:p.scope||'local',
        products:Array.isArray(p.products)?p.products.join(', '):(p.products||''),
        moq:p.moq||'',delivery:p.delivery||'',leadTime:p.leadTime||'',
        sources:Array.isArray(p.sources)?p.sources.join(', '):(p.sources||''),
        frequency:p.frequency||'Monthly',orderValue:p.orderValue||''
      });
      setSavedSuppliersState(getSavedSuppliers(user.uid));
      setAlertsState(getAlerts(user.uid));
      setLoading(false);
    });
  },[user]);

  // Load directory data for matches + analytics
  useEffect(()=>{
    if(!profile) return;
    fsLoadDirectory().then(res=>{
      const sups = (res&&res.suppliers.length)?res.suppliers:SEED_SUPPLIERS;
      const buys = (res&&res.buyers.length)?res.buyers:SEED_BUYERS;
      setAllSuppliers(sups);
      setAllBuyers(buys);
      const pool = profile.role==='supplier'?buys:sups;
      setMatches(pool.filter(x=>x.category===profile.category).slice(0,12));
    });
    if(profile.role!=='supplier'){ loadUserQuotes(user.uid).then(q=>setQuotes(q)); }
  },[profile,user]);

  const signOut=async()=>{await authSignOutFn();onSignedOut&&onSignedOut();};

  const toggleSave=()=>{ /* not used at this level */ };

  const saveProfile=async()=>{
    if(!editForm) return;
    setSaving(true);setSaveMsg(null);
    try{
      const isSupplier=profile.role==='supplier';
      const updates={name:editForm.name.trim(),businessName:editForm.businessName.trim(),phone:editForm.phone.trim(),category:editForm.category,location:editForm.location,country:editForm.country||'Zambia',scope:editForm.scope||'local'};
      if(isSupplier){updates.products=splitCSV(editForm.products);updates.moq=editForm.moq;updates.delivery=editForm.delivery;updates.leadTime=editForm.leadTime;}
      else{updates.sources=splitCSV(editForm.sources);updates.frequency=editForm.frequency;updates.orderValue=editForm.orderValue;}
      if(firebaseReady) await db.collection('se_users').doc(user.uid).update(updates);
      setProfile({...profile,...updates});
      setSaveMsg({kind:'ok',msg:'Profile saved.'});
      toast('Profile saved successfully.', 'success');
      setTimeout(()=>setSaveMsg(null),3000);
    }catch(e){setSaveMsg({kind:'err',msg:'Save failed: '+(e.code||e.message)});toast('Save failed.', 'error');}
    finally{setSaving(false);}
  };

  if(loading) return <div style={{minHeight:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;

  if(!profile) return <div style={{minHeight:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6',padding:'32px 20px',textAlign:'center'}}>
    <div style={{maxWidth:400}}>
      <h2 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Profile not found</h2>
      <p style={{fontSize:13.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:20}}>Contact {CONTACT_EMAIL}.</p>
      <button onClick={signOut} style={{padding:'12px 22px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:9,fontSize:13.5,fontWeight:700}}>Sign out</button>
    </div>
  </div>;

  const isSupplier=profile.role==='supplier';
  const cat=CAT_MAP[profile.category]||{title:'General',color:'#E8730F',icon:'fa-building'};
  const isVerified=profile.status==='verified';

  // Sidebar nav definition
  const navItems = isSupplier ? [
    {kind:'section',label:'Workspace'},
    {key:'overview', label:'Overview', icon:'fa-house'},
    {key:'profile', label:'Organisation Profile', icon:'fa-building'},
    {key:'catalogue', label:'My Catalogue', icon:'fa-list'},
    {key:'matches', label:'Buyer Matches', icon:'fa-users', badge: matches.length},
    {key:'analytics', label:'Analytics', icon:'fa-chart-simple'},
    {kind:'section',label:'Explore'},
    {key:'browse', label:'Browse Buyers', icon:'fa-magnifying-glass'},
    {kind:'section',label:'Account'},
    {key:'settings', label:'Settings', icon:'fa-gear'},
  ] : [
    {kind:'section',label:'Workspace'},
    {key:'overview', label:'Overview', icon:'fa-house'},
    {key:'profile', label:'My Profile', icon:'fa-user'},
    {key:'saved', label:'Saved Suppliers', icon:'fa-bookmark', badge: savedSuppliers.length},
    {key:'requests', label:'My Requests', icon:'fa-file-invoice', badge: quotes.length},
    {key:'alerts', label:'Opportunity Alerts', icon:'fa-bell', badge: alerts.length},
    {kind:'section',label:'Explore'},
    {key:'browse', label:'Browse Suppliers', icon:'fa-magnifying-glass'},
    {kind:'section',label:'Account'},
    {key:'settings', label:'Settings', icon:'fa-gear'},
  ];

  const handleNav=(key)=>{
    if(key==='browse'){ onBrowse && onBrowse(); setSidebarOpen(false); return; }
    setTab(key); setSidebarOpen(false);
  };

  const pageTitle = navItems.find(x=>x.key===tab)?.label || 'Overview';
  const pageEyebrow = isSupplier ? 'Supplier dashboard' : 'Buyer dashboard';

  return <div className="fadein" style={{minHeight:'100%', background:'#F5FAF6'}}>
    <div className={'dash-backdrop '+(sidebarOpen?'open':'')} onClick={()=>setSidebarOpen(false)} style={{position:'fixed',top:72,left:0,right:0,bottom:0,background:'rgba(0,0,0,.45)',zIndex:35}}></div>

    <aside className={'dash-sidebar '+(sidebarOpen?'open':'')} style={{position:'fixed',left:0,top:72,bottom:0,width:260,background:'#0A1F12',color:'#fff',display:'flex',flexDirection:'column',zIndex:40,overflowY:'auto'}}>
      <div style={{padding:'18px 16px 14px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <Mark size={34}/>
          <div style={{lineHeight:1.15}}>
            <div style={{fontSize:8.5,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:700,color:'rgba(255,255,255,.35)'}}>Dashboard</div>
            <div style={{fontSize:14,fontWeight:700,color:'#fff'}}>Start<em style={{fontStyle:'normal',color:'#F5A623'}}>Easy</em></div>
          </div>
        </div>
        <div style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:'12px 12px',display:'flex',alignItems:'center',gap:10}}>
          <span style={{width:38,height:38,borderRadius:'50%',background:cat.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,flexShrink:0}}>{initials(profile.name)}</span>
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontSize:12.5,fontWeight:700,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{profile.name}</div>
            <div style={{fontSize:10.5,color:'rgba(255,255,255,.55)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{isSupplier?'Supplier':'Buyer'} · {profile.businessName}</div>
          </div>
        </div>
      </div>
      <nav style={{padding:'6px 10px',flex:1}}>
        {navItems.map((item, idx)=>{
          if(item.kind==='section'){
            return <div key={idx} className="dash-side-section">{item.label}</div>;
          }
          return <button key={item.key} onClick={()=>handleNav(item.key)} className={'dash-nav-btn '+(tab===item.key?'active':'')}>
            <i className={'fas '+item.icon} style={{fontSize:13,width:16}}></i>
            <span style={{flex:1,textAlign:'left'}}>{item.label}</span>
            {item.badge>0 && <span className="dash-nav-badge">{item.badge}</span>}
          </button>;
        })}
        <div style={{height:14}}></div>
        <a href={MAIN_PLATFORM_URL} className="dash-nav-btn" style={{textDecoration:'none',color:'#F5A623',background:'rgba(232,115,15,.1)',border:'1px solid rgba(232,115,15,.25)'}}>
          <i className="fas fa-arrow-left" style={{fontSize:12,width:16}}></i> Back to StartEasy Platform
        </a>
      </nav>
      <div style={{padding:'12px 14px',borderTop:'1px solid rgba(255,255,255,.08)'}}>
        <a href={waUrl(`Hello StartEasy — I'm ${profile.name} (${profile.businessName}).`)} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'10px',marginBottom:8,background:'#25D366',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700,textDecoration:'none'}}>
          <i className="fab fa-whatsapp"></i> Contact support
        </a>
        <button onClick={signOut} style={{width:'100%',padding:'10px',borderRadius:8,background:'rgba(184,86,79,.15)',color:'#FFB4A8',border:'1px solid rgba(184,86,79,.35)',fontSize:12,fontWeight:700}}>
          <i className="fas fa-right-from-bracket" style={{marginRight:6}}></i> Sign out
        </button>
      </div>
    </aside>

    <div className="dash-main" style={{minHeight:'100%'}}>
      <header style={{background:'#fff',borderBottom:'1px solid rgba(10,31,18,.08)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10,position:'sticky',top:0,zIndex:30,boxShadow:'0 2px 10px rgba(0,0,0,.03)'}}>
        <button onClick={()=>setSidebarOpen(true)} className="dash-mobile-toggle" style={{width:36,height:36,borderRadius:8,background:'#0A1F12',color:'#fff',border:'none',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <i className="fas fa-bars" style={{fontSize:14}}></i>
        </button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.45)'}}>{pageEyebrow}</div>
          <div style={{fontSize:14,fontWeight:700,color:'#0A1F12',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{pageTitle}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span className={'chip '+(isVerified?'':'chip-accent')}>
            <i className={'fas '+(isVerified?'fa-circle-check':'fa-clock')}></i>
            <span className="hide-sm">{isVerified?'Verified':'Pending'}</span>
          </span>
        </div>
      </header>

      <main style={{padding:'24px',maxWidth:1240,margin:'0 auto'}}>
        {tab==='overview' && <DashOverview 
          profile={profile} isSupplier={isSupplier} cat={cat} matches={matches} quotes={quotes} 
          savedSuppliers={savedSuppliers} alerts={alerts} allSuppliers={allSuppliers} allBuyers={allBuyers}
          onNav={handleNav} onBrowse={onBrowse}
        />}
        {tab==='profile' && editForm && <DashProfile 
          profile={profile} editForm={editForm} setEditForm={setEditForm} isSupplier={isSupplier} 
          saving={saving} saveMsg={saveMsg} onSave={saveProfile}
        />}
        {tab==='matches' && <DashMatches profile={profile} matches={matches} isSupplier={isSupplier} cat={cat} onBrowse={onBrowse}/>}
        {tab==='saved' && !isSupplier && <DashSaved savedSuppliers={savedSuppliers} allSuppliers={allSuppliers} cat={cat} user={user} onBrowse={onBrowse}/>}
        {tab==='requests' && !isSupplier && <DashRequests quotes={quotes} onBrowse={onBrowse}/>}
        {tab==='alerts' && !isSupplier && <DashAlerts alerts={alerts} setAlerts={setAlertsState} user={user} cat={cat}/>}
        {tab==='catalogue' && isSupplier && <DashCatalogue profile={profile} cat={cat}/>}
        {tab==='analytics' && isSupplier && <DashAnalytics profile={profile} matches={matches} cat={cat}/>}
        {tab==='settings' && <DashSettings profile={profile} isVerified={isVerified} isSupplier={isSupplier} onSignOut={signOut} user={user}/>}
      </main>
    </div>
  </div>;

/* --- Dashboard sub-pages --- */
function DashOverview({profile, isSupplier, cat, matches, quotes, savedSuppliers, alerts, allSuppliers, allBuyers, onNav, onBrowse}){
  const pct = computeProfilePct(profile, isSupplier);
  const activity = [
    {icon:'fa-user-plus', color:'#2E9C4A', title:'Account created', detail:fmtDate(profile.createdAt||Date.now())},
    ...(profile.status==='verified' ? [{icon:'fa-circle-check', color:'#1E7B3C', title:'Profile verified', detail:isSupplier?'Buyers can now find you':'Suppliers can now find you'}] : [{icon:'fa-clock', color:'#8A6828', title:'Verification pending', detail:'Reviewed within 48 hours.'}]),
    ...(quotes.length>0 ? [{icon:'fa-file-invoice', color:'#E8730F', title:`${quotes.length} quote request${quotes.length===1?'':'s'} sent`, detail:'Track them in My Requests'}] : [{icon:'fa-magnifying-glass', color:'#1B6CA8', title:isSupplier?'Browse buyers to introduce yourself':'Browse suppliers to request quotes', detail:'Your activity will appear here.'}])
  ];

    {label:'Buyers matched', value:matches.length, hint:'in your category'},
    {label:'Saved by buyers', value:savedSuppliers.length, hint:'bookmarked'},
    {label:'Profile views', value:'—', hint:'Analytics tracking on'},
    {label:'Status', value:profile.status==='verified'?'Verified':'Pending', hint:profile.status==='verified'?'Live in directory':'Being reviewed', warn:profile.status!=='verified'}
  ];
  const buyerKPIs = [
    {label:'Suppliers matched', value:matches.length, hint:'in your category'},
    {label:'Quote requests', value:quotes.length, hint:quotes.length?'View My Requests':'None yet'},
    {label:'Saved suppliers', value:savedSuppliers.length, hint:'saved for later'},
    {label:'Status', value:profile.status==='verified'?'Verified':'Pending', hint:profile.status==='verified'?'Live in directory':'Being reviewed', warn:profile.status!=='verified'}
  ];

    {label:'Profile completeness', value:pct},

    {label:'Profile completeness', value:pct},

function computeProfilePct(profile, isSupplier){
  const fields = isSupplier
    ? [profile.name,profile.businessName,profile.phone,profile.category,profile.location,(profile.products&&profile.products.length),profile.moq,profile.delivery,profile.leadTime]
    : [profile.name,profile.businessName,profile.phone,profile.category,profile.location,(profile.sources&&profile.sources.length),profile.frequency,profile.orderValue];
  return Math.round((fields.filter(Boolean).length/fields.length)*100);
}

function DashAlerts({alerts, setAlerts, user, cat}){
  const [form, setForm] = useState({keywords:'', category:cat.key||'', location:'', frequency:'Weekly'});
  const [err, setErr] = useState('');
  const submit = ()=>{
    setErr('');
    if(!form.keywords.trim()){ setErr('Enter keywords to match.'); return; }
    const next = [...alerts, {id:'al_'+Date.now(), keywords:form.keywords.trim(), category:form.category, location:form.location.trim(), frequency:form.frequency, active:true, createdAt:Date.now()}];
    setAlerts(user.uid, next);
    setForm({keywords:'', category:cat.key||'', location:'', frequency:'Weekly'});
    toast('Alert created successfully.', 'success');
    // Force rerender via parent — soft trigger
    setTimeout(()=>window.dispatchEvent(new Event('se-dashboard-refresh')), 40);
  };
  const toggle = (id)=>{
    const next = alerts.map(a=>a.id===id?{...a, active:!a.active}:a);
    setAlerts(user.uid, next);
    toast(next.find(a=>a.id===id).active?'Alert resumed':'Alert paused', 'success');
    setTimeout(()=>window.dispatchEvent(new Event('se-dashboard-refresh')), 40);
  };
  const remove = (id)=>{
    setAlerts(user.uid, alerts.filter(a=>a.id!==id));
    toast('Alert deleted.', 'success');
    setTimeout(()=>window.dispatchEvent(new Event('se-dashboard-refresh')), 40);
  };

  return <>
    <div style={{marginBottom:20}}>
      <h1 className="serif" style={{fontSize:'clamp(1.5rem,3.5vw,2.2rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 6px'}}>Opportunity alerts</h1>

    </div>

    <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'22px',marginBottom:16}}>
      <h3 className="serif" style={{fontSize:15,fontWeight:800,color:'#0A1F12',margin:'0 0 14px'}}>Create a new alert</h3>
      <div className="form-grid">
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Keywords *</label><TIn value={form.keywords} onChange={v=>setForm({...form,keywords:v})} placeholder="e.g. fabric supplier"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Category</label>
          <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            <option value="">Any category</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
        </div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Location</label><TIn value={form.location} onChange={v=>setForm({...form,location:v})} placeholder="Any location"/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Frequency</label>
          <select value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})} style={{...INP_STYLE,cursor:'pointer'}}>
            <option>Instant</option><option>Daily</option><option>Weekly</option><option>Monthly</option>
          </select>
        </div>
      </div>
      {err && <div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:12,fontSize:12.5,color:'#7C2318'}}><i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}</div>}
      <button onClick={submit} style={{marginTop:14,padding:'12px 22px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:9,fontSize:13,fontWeight:700}}>Create alert</button>
    </div>

    {alerts.length===0 ? <EmptyState icon="fa-bell" title="No alerts yet" text="Create your first alert above to be notified of new matches."/> :
      <div className="table-wrap">
        <table className="dt">
          <thead><tr><th>Keywords</th><th>Category</th><th>Location</th><th>Frequency</th><th>Status</th><th style={{textAlign:'right'}}>Actions</th></tr></thead>
          <tbody>
            {alerts.map(a=>(
              <tr key={a.id}>
                <td style={{fontWeight:700}}>{a.keywords}</td>
                <td className="muted">{CAT_MAP[a.category]?.title||'Any'}</td>
                <td className="muted">{a.location||'Any'}</td>
                <td className="muted">{a.frequency}</td>
                <td><Chip kind={a.active?'':'chip-neutral'}>{a.active?'Active':'Paused'}</Chip></td>
                <td style={{textAlign:'right'}}>
                  <div style={{display:'inline-flex',gap:6}}>
                    <button onClick={()=>toggle(a.id)} style={{padding:'6px 10px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:6,fontSize:11.5,fontWeight:700,color:'#0A1F12',cursor:'pointer'}}>{a.active?'Pause':'Resume'}</button>
                    <button onClick={()=>remove(a.id)} style={{padding:'6px 10px',background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.25)',borderRadius:6,fontSize:11.5,fontWeight:700,color:'#7C2318',cursor:'pointer'}}>Delete</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    }
  </>;
}

/* ═══════════════════ BROWSE ═══════════════════ */
function Browse({user,onRequestQuote,onRequestIntro,onDashboard,onSignedOut}){
  const [suppliers,setSuppliers]=useState([]);
  const [buyers,setBuyers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('suppliers');
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('all');
  const [city,setCity]=useState('all');
  const [profile,setProfile]=useState(null);
  const [profileType,setProfileType]=useState(null);
  const [saved,setSaved]=useState(()=>user?getSavedSuppliers(user.uid):[]);

  useEffect(()=>{
    fsLoadDirectory().then(res=>{
      if(res && (res.suppliers.length||res.buyers.length)){
        setSuppliers(res.suppliers);
        setBuyers(res.buyers);
      }else{
        setSuppliers(SEED_SUPPLIERS);
        setBuyers(SEED_BUYERS);
      }
      setLoading(false);
    });
  },[]);

  const toggleSave=(supplierId)=>{
    if(!user){ toast('Sign in to save suppliers.', 'error'); return; }
    const next = saved.includes(supplierId) ? saved.filter(x=>x!==supplierId) : [...saved, supplierId];
    setSaved(next);
    setSavedSuppliers(user.uid, next);
    toast(saved.includes(supplierId)?'Removed from saved.':'Saved to your dashboard.', 'success');
  };

  const filteredSuppliers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return suppliers.filter(s=>{
      if(category!=='all'&&s.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(s)) return false; }
      else if(city!=='all'&&s.location!==city) return false;
      if(!q) return true;
      return (s.name+' '+s.location+' '+(s.country||'')+' '+(s.desc||'')+' '+(s.products||[]).join(' ')).toLowerCase().includes(q);
    });
  },[suppliers,query,category,city]);

  const filteredBuyers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return buyers.filter(b=>{
      if(category!=='all'&&b.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(b)) return false; }
      else if(city!=='all'&&b.location!==city) return false;
      if(!q) return true;
      return (b.name+' '+b.location+' '+(b.country||'')+' '+(b.desc||'')+' '+(b.sources||[]).join(' ')).toLowerCase().includes(q);
    });
  },[buyers,query,category,city]);

  const list=tab==='suppliers'?filteredSuppliers:filteredBuyers;

  return <div className="fadein" style={{minHeight:'100%', background:'#F5FAF6', display:'flex', flexDirection:'column'}}>
    <main style={{flex:1,maxWidth:1240,margin:'0 auto',padding:'32px 24px 60px',width:'100%'}}>
      <div style={{marginBottom:24}}>
        <span className="micro" style={{color:'#E8730F',display:'block',marginBottom:12}}>Browse directory</span>
        <h1 className="serif" style={{fontSize:'clamp(1.8rem,4vw,2.5rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>{list.length} {tab==='suppliers'?'supplier':'buyer'}{list.length===1?'':'s'}</h1>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:6}}>
        <button onClick={()=>{setTab('suppliers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='suppliers'?'#0A1F12':'transparent',color:tab==='suppliers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Suppliers ({suppliers.length})</button>
        <button onClick={()=>{setTab('buyers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='buyers'?'#E8730F':'transparent',color:tab==='buyers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Buyers ({buyers.length})</button>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <div style={{position:'relative',flex:'1 1 260px',minWidth:0}}>
            <i className="fas fa-magnifying-glass" style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',color:'rgba(10,31,18,.4)',fontSize:13}}></i>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search…" style={{...INP_STYLE,paddingLeft:40,fontSize:14}}/>
          </div>
          <select value={category} onChange={e=>setCategory(e.target.value)} style={{...INP_STYLE,minWidth:180,cursor:'pointer'}}>
            <option value="all">All categories</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
          <select value={city} onChange={e=>setCity(e.target.value)} style={{...INP_STYLE,minWidth:150,cursor:'pointer'}}>
            <option value="all">All locations</option>
            <option value="__intl">🌍 International</option>
            {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      {loading?<div style={{textAlign:'center',padding:'60px 0'}}><i className="fas fa-spinner fa-spin" style={{fontSize:24,color:'#E8730F'}}></i></div>:
      list.length===0?<div style={{background:'#fff',border:'1px dashed rgba(10,31,18,.15)',borderRadius:14,padding:'48px',textAlign:'center'}}><p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>No results.</p></div>:<div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))'}}>
        {tab==='suppliers'?filteredSuppliers.map(s=>{
          const cat=CAT_MAP[s.category]||{color:'#E8730F',icon:'fa-building',title:'Supplier'};
          const isSaved=saved.includes(s.id);
          return <div key={s.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:`3px solid ${cat.color}`}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:cat.color+'15',color:cat.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}><i className={`fas ${cat.icon}`}></i></span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12'}}>{s.name}</div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(s)}</div>
              </div>
              <button onClick={()=>toggleSave(s.id)} className={'save-btn '+(isSaved?'saved':'')} title={isSaved?'Saved':'Save'} aria-label="Save supplier"><i className={`fas ${isSaved?'fa-bookmark':'fa-bookmark'}`} style={{fontSize:12}}></i></button>
            </div>
            {isInternationalEntity(s)&&<span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(27,108,168,.1)',color:'#1B6CA8',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-globe" style={{fontSize:9}}></i> International</span>}
            <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0,flex:1}}>{s.desc}</p>
            <button onClick={()=>{setProfile(s);setProfileType('supplier');}} style={{padding:'9px',background:`linear-gradient(135deg,${cat.color},${cat.color}cc)`,color:'#fff',border:'none',borderRadius:8,fontSize:11.5,fontWeight:700}}>View profile</button>
          </div>;
        }):filteredBuyers.map(b=>(
          <div key={b.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:'3px solid #E8730F'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:'rgba(232,115,15,.15)',color:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}><i className="fas fa-cart-shopping"></i></span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12'}}>{b.name}</div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(b)}</div>
              </div>
            </div>
            {isInternationalEntity(b)&&<span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(27,108,168,.1)',color:'#1B6CA8',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-globe" style={{fontSize:9}}></i> International</span>}
            <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0,flex:1}}>{b.desc}</p>
            <button onClick={()=>{setProfile(b);setProfileType('buyer');}} style={{padding:'9px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:11.5,fontWeight:700}}>View buyer</button>
          </div>
        ))}

    </main>
    <Footer/>
    {profile&&profileType==='supplier'&&<SupplierProfileModal supplier={profile} user={user} onClose={()=>setProfile(null)} onRequestQuote={(s)=>{setProfile(null);onRequestQuote(s);}}/>}
    {profile&&profileType==='buyer'&&<BuyerProfileModal buyer={profile} user={user} onClose={()=>setProfile(null)} onRequestIntro={(b)=>{setProfile(null);onRequestIntro(b);}}/>}
  </div>;
}
