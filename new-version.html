function timeAgo(ts){if(!ts)return '';const s=Math.max(0,Math.floor((Date.now()-ts)/1000));if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';const d=Math.floor(s/86400);return d+' day'+(d>1?'s':'')+' ago';}

function getVisitor(){
  try{
    let v=JSON.parse(localStorage.getItem(VISITOR_KEY)||'null');
    if(!v){v={id:'v_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),firstSeen:Date.now(),visits:0,lastSeen:Date.now()};}
    v.visits=(v.visits||0)+1;v.lastSeen=Date.now();
    localStorage.setItem(VISITOR_KEY,JSON.stringify(v));
    return v;
  }catch(e){return {id:'anon_'+Date.now().toString(36),firstSeen:Date.now(),visits:1,lastSeen:Date.now()}}
}
function readVisitor(){try{return JSON.parse(localStorage.getItem(VISITOR_KEY)||'null')}catch(e){return null}}

async function addPayment(rec){
  if(!firebaseReady) return null;
  const record = {
    ...rec,
    status: 'under_review',
    submittedAt: Date.now(),
    history: [{ status: 'under_review', at: Date.now(), note: 'Payment reference received. Awaiting officer verification.' }]
  };
  try {
    await db.collection(SE_PAYMENTS).doc(rec.ref).set(record);

    return record;
  } catch(e) {
    console.error('[StartEasy] ❌ addPayment failed:', e && e.code, e && e.message);
    return null;
  }
}

async function findPaymentByRef(ref){

  try {
    const key = ref.toUpperCase().trim();
    const snap = await db.collection(SE_PAYMENTS).doc(key).get();
    return snap.exists ? { id: snap.id, ...snap.data() } : null;
  } catch(e) {
    console.error('[StartEasy] ❌ findPaymentByRef failed:', e && e.code, e && e.message);
    return null;
  }
}

async function updatePaymentStatus(ref, status, note){
  if(!firebaseReady) return null;
  try {
    const docRef = db.collection(SE_PAYMENTS).doc(ref);
    const snap = await docRef.get();
    if(!snap.exists) return null;
    const cur = snap.data();
    const history = [...(cur.history||[]), { status, at: Date.now(), note: note||'' }];
    await docRef.update({ status, adminNote: note||'', reviewedAt: Date.now(), history });
    return { id: ref, ...cur, status, adminNote: note||'', history };
  } catch(e) {
    console.error('[StartEasy] ❌ updatePaymentStatus failed:', e && e.code, e && e.message);
    return null;
  }
}

function trackEvent(type, payload){
  if(!firebaseReady) return;
  try {
    const visitor = readVisitor();
    db.collection(SE_EVENTS).add({
      type, at: Date.now(),
      visitorId: visitor ? visitor.id : null,
      ...(payload || {})
    }).catch(()=>{});
  } catch(e) {}
}

async function clearAllEvents(){
  if(!firebaseReady) return false;
  try {
    const snap = await db.collection(SE_EVENTS).limit(500).get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));

    return true;
  } catch(e) {
    console.error('[StartEasy] ❌ clearAllEvents failed:', e && e.code, e && e.message);
    return false;
  }
}

async function adminSignIn(email, pw){
  if(!firebaseReady) return { ok:false, error:'Authentication service unavailable.' };
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('__timeout__')), 15000));
    await Promise.race([
      auth.signInWithEmailAndPassword(email.trim(), pw),
      timeout
    ]);
    return { ok:true };
  } catch(e) {
    const code = e && e.code ? e.code : '';
    const msg  = e && e.message ? e.message : '';
    console.warn('[StartEasy] adminSignIn failed:', code || msg);
    if(msg === '__timeout__') return { ok:false, error:'Sign-in timed out. Check your internet connection and try again.' };
    if(code === 'auth/wrong-password')       return { ok:false, error:'Incorrect password.' };
    if(code === 'auth/user-not-found')       return { ok:false, error:'No account with that email.' };
    if(code === 'auth/invalid-credential')   return { ok:false, error:'Incorrect email or password.' };
    if(code === 'auth/invalid-email')        return { ok:false, error:'That email address is not valid.' };
    if(code === 'auth/operation-not-allowed')return { ok:false, error:'Email/password sign-in is NOT enabled. Enable it in Firebase Console → Authentication → Sign-in method.' };
    if(code === 'auth/unauthorized-domain')  return { ok:false, error:'This domain is not authorised. Add it in Firebase Console → Authentication → Settings → Authorized domains.' };
    if(code === 'auth/too-many-requests')    return { ok:false, error:'Too many attempts. Wait a few minutes and try again.' };
    if(code === 'auth/network-request-failed') return { ok:false, error:'Network error. Check your connection and try again.' };
    return { ok:false, error: 'Sign-in failed: ' + (code || msg || 'unknown error') };
  }
}

async function adminSignOut(){
  try { await auth.signOut(); } catch(e) {}
}

function resolveLegalEnding(structure,choice){
  if(!structure)return '';
  if(structure.endingRule==='none')return '';
  if(structure.endingRule==='choice'){if(choice==='NONE')return '';if(choice==='UNLIMITED')return 'UNLIMITED';return 'LIMITED';}

const GENERIC=['business','enterprise','enterprises','company','services','service','trading','traders','investments','investment','holdings','group','general','dealers','suppliers','ventures','solutions','consultants','consulting'];
function analyseName(name){
  const n=(name||'').trim().toLowerCase();
  if(!n)return{score:0,issues:[],patterns:[],protected:[]};
  const issues=[];const patterns=PATTERNS.filter(p=>n.includes(p));const prot=PROTECTED.filter(p=>n.includes(p));let score=100;
  if(n.length<3){score-=40;issues.push({level:'crit',text:'Name is too short to be distinctive.'})}
  if(/^\d+$/.test(n)){score-=40;issues.push({level:'crit',text:'A name made only of numbers is unlikely to be accepted.'})}
  if(n.length>30){score-=10;issues.push({level:'warn',text:'Unusually long — shorter distinctive names are usually stronger.'})}
  if(patterns.length>0){score-=patterns.length*6;issues.push({level:'warn',text:`Contains ${patterns.length} common pattern${patterns.length>1?'s':''}: ${patterns.join(', ')}. Add a more distinctive element.`})}
  if(prot.length>0){score-=prot.length*20;issues.push({level:'crit',text:`Contains protected term${prot.length>1?'s':''}: ${prot.join(', ')}. Written consent may be required.`})}
  if(GENERIC.includes(n)){score-=30;issues.push({level:'crit',text:'A single generic word is unlikely to be accepted.'})}
  score=Math.max(0,Math.min(100,Math.round(score)));
  return{score,issues,patterns,protected:prot};
}

function escapeRegex(str){return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function findEmbeddedLibraryWords(descriptor,industry){if(!descriptor||!industry)return[];const descLower=descriptor.toLowerCase();return industry.descriptors.filter(lib=>{const libLower=lib.toLowerCase();return new RegExp(`\\b${escapeRegex(libLower)}\\b`,'i').test(descLower);});}
function validateCustomDescriptor(text,industry){
  const t=(text||'').trim();
  if(!t) return {state:'empty'};
  if(t.length<3) return {state:'too-short',message:'The descriptor is very short. Use at least 3 characters.'};
  if(/^\d+$/.test(t)) return {state:'numeric',message:'A descriptor made only of numbers is not usable. Add real words.'};
  const embedded=findEmbeddedLibraryWords(t,industry);
  if(embedded.length>0)return {state:'valid',message:`Matches your industry — contains "${embedded[0]}", a recognised library word. You may proceed.`,embedded};
  const words=t.split(/\s+/).filter(Boolean);
  if(words.length>=2)return {state:'valid',message:'Accepted — you may proceed. Multi-word descriptive phrases are allowed when they clearly describe the business.'};
  return {state:'valid',message:'Accepted — you may proceed. Confirm this word is not already reserved by another business.'};
}
function buildSixNames(distinctive,effectiveDescriptor,industryData,legalEnding){
  if(!distinctive||!distinctive.trim()||!effectiveDescriptor||!industryData)return[];
  const distinct=distinctive.trim().toUpperCase();
  const desc=effectiveDescriptor.toUpperCase().trim();
  const ending=(legalEnding===undefined||legalEnding===null)?'':String(legalEnding).trim();
  const compose=d=>[distinct,d,ending].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  const out=[];out.push(compose(desc));
  const used=new Set([desc]);
  const tryAdd=(candidate)=>{if(out.length>=6)return;if(!candidate)return;const u=candidate.toUpperCase();if(used.has(u))return;used.add(u);out.push(compose(u));};
  const embedded=findEmbeddedLibraryWords(desc,industryData);embedded.forEach(lib=>tryAdd(lib));
  for(const lib of industryData.descriptors){if(out.length>=6)break;tryAdd(lib);}
  return out.filter(Boolean);
}

function Btn({children,onClick,variant='primary',size='md',className='',type='button',disabled}){
  const base='inline-flex items-center justify-center gap-2.5 transition-all duration-300 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed rounded-sm font-semibold';
  const sizes={sm:'text-[12px] px-4 py-2.5',md:'text-[13px] px-6 py-3.5',lg:'text-[13.5px] px-8 py-4'};
  const variants={primary:'bg-gradient-to-br from-[#E8730F] to-[#F5A623] text-white hover:shadow-[0_0_25px_rgba(232,115,15,0.4)]',ghost:'border border-[#0A1F12]/20 text-[#0A1F12] hover:border-[#E8730F] hover:bg-[#E8730F]/5',ghostLt:'border border-white/20 text-white hover:bg-[#F5A623] hover:text-[#0A1F12]'};
  return <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
}

function Engagement({service,onClose,onAgreed}){
  const [client,setClient]=useState({name:'',business:'',email:'',phone:''});

  const [error,setError]=useState('');
  if(!service)return null;
  const s=service;
  const proceed=()=>{
    setError('');
    if(!client.name.trim()){setError('Please enter your full name.');return}
    if(!client.email.trim()){setError('Please enter your email.');return}
    if(!agreed){setError('Please confirm you agree to the engagement terms.');return}

/* ============================================================

function Wizard({initialScope,onExit,onOrderFormal}){
  const boot=useMemo(()=>{
    const snap=readSnapshot();
    const w=snap&&snap.wizard?snap.wizard:null;
    if(!w)return{data:null,savedAt:null};
    if(initialScope&&w.scope&&w.scope!==initialScope)return{data:null,savedAt:null};
    return{data:w,savedAt:snap.savedAt||null};
  },[]);
  const b=boot.data||{};
  const [step,setStep]=useState(typeof b.step==='number'?b.step:0);
  const [scope,setScope]=useState(b.scope||initialScope||null);
  const [idea,setIdea]=useState(b.idea||'');
  const [primaryActivity,setPrimaryActivity]=useState(b.primaryActivity||'');
  const [secondaryActivities,setSecondaryActivities]=useState(Array.isArray(b.secondaryActivities)?b.secondaryActivities:[]);
  const [industry,setIndustry]=useState(b.industry||null);
  const [descriptor,setDescriptor]=useState(b.descriptor||'');
  const [customDescriptor,setCustomDescriptor]=useState(b.customDescriptor||'');
  const [structure,setStructure]=useState(b.structure||null);
  const [legalEnding,setLegalEnding]=useState(typeof b.legalEnding==='string'?b.legalEnding:'');
  const [distinctive,setDistinctive]=useState(b.distinctive||'');
  const [restoredAt,setRestoredAt]=useState(boot.savedAt);
  const [showRestored,setShowRestored]=useState(!!boot.data);
  const toggleSecondary=a=>setSecondaryActivities(prev=>prev.includes(a)?prev.filter(x=>x!==a):[...prev,a]);
  useEffect(()=>{writeSnapshot({wizard:{step,scope,idea,primaryActivity,secondaryActivities,industry,descriptor,customDescriptor,structure,legalEnding,distinctive}});},[step,scope,idea,primaryActivity,secondaryActivities,industry,descriptor,customDescriptor,structure,legalEnding,distinctive]);
  const startOver=()=>{clearSnapshot();setStep(0);setScope(null);setIdea('');setPrimaryActivity('');setSecondaryActivities([]);setIndustry(null);setDescriptor('');setCustomDescriptor('');setStructure(null);setLegalEnding('');setDistinctive('');setShowRestored(false);setRestoredAt(null);};
  useEffect(()=>{if(industry&&!descriptor&&!customDescriptor){const ind=INDUSTRIES.find(i=>i.key===industry);if(ind)setDescriptor(ind.descriptors[0])}},[industry]);
  useEffect(()=>{const sd=structure?STRUCTURES.find(x=>x.key===structure):null;if(sd&&sd.endingRule==='none')setLegalEnding('');else if(sd&&sd.endingRule==='fixed')setLegalEnding(sd.endings[0]||'');},[structure]);
  const effectiveDescriptor=useMemo(()=>customDescriptor.trim()||descriptor,[customDescriptor,descriptor]);
  const stepsArr=useMemo(()=>{
    if(!scope)return['scope'];
    const s=['scope','idea','structure','activity','secondary'];
    if(scope==='names'||scope==='both'){s.push('industry');s.push('descriptor');s.push('distinctive');}
    else{s.push('industry');}
    s.push('report');
    return s;
  },[scope]);
  const current=stepsArr[step];
  const industryData=industry?INDUSTRIES.find(i=>i.key===industry):null;
  const structureData=structure?STRUCTURES.find(x=>x.key===structure):null;
  const analysis=useMemo(()=>analyseName(distinctive),[distinctive]);
  const effectiveEnding=useMemo(()=>resolveLegalEnding(structureData,legalEnding),[structureData,legalEnding]);
  const names=useMemo(()=>buildSixNames(distinctive,effectiveDescriptor,industryData,effectiveEnding),[distinctive,effectiveDescriptor,industryData,effectiveEnding]);
  const embeddedLibraryWords=useMemo(()=>findEmbeddedLibraryWords(effectiveDescriptor,industryData),[effectiveDescriptor,industryData]);
  const readiness=useMemo(()=>{let t=0;if(idea.trim().length>=20)t+=15;if(primaryActivity)t+=10;if(secondaryActivities.length>0)t+=5;if(industry)t+=15;if(structure)t+=15;if(effectiveDescriptor)t+=15;if(analysis.score>=80)t+=25;else if(analysis.score>=60)t+=18;else if(analysis.score>=40)t+=10;if(industryData?.flag)t-=5;return Math.max(0,Math.min(100,t));},[idea,primaryActivity,secondaryActivities,industry,structure,effectiveDescriptor,analysis,industryData]);
  useEffect(()=>{if(step>=stepsArr.length)setStep(stepsArr.length-1)},[stepsArr.length,step]);
  useEffect(()=>{window.scrollTo({top:120,behavior:'smooth'});trackEvent('wizard_step',{step,current,scope});},[step,current,scope]);
  const next=()=>{if(step<stepsArr.length-1)setStep(step+1)};
  const back=()=>{if(step>0)setStep(step-1)};
  const can=()=>{if(current==='scope')return!!scope;if(current==='idea')return idea.trim().length>=15;if(current==='structure')return!!structure;if(current==='activity')return!!primaryActivity;if(current==='secondary')return true;if(current==='industry')return!!industry;if(current==='descriptor')return !!effectiveDescriptor && effectiveDescriptor.length>=3;if(current==='distinctive')return distinctive.trim().length>=3;return true;};
  const goStep=i=>{if(i<=step)setStep(i)};
  const orderFormal=()=>{
    const title=scope==='structure'?'Business Structure Advisory':scope==='names'?'Name Preparation & Clearance':'Business Structure & Name Advisory';
    trackEvent('wizard_complete',{scope,title});
    onOrderFormal({
      code:'ADV',desk:'pacra',title,
      clientDesc:'Self-service wizard completed. Formal StartEasy-branded report, reviewed by an officer, delivered within 1 hour. Ready to attach to your PACRA submission.',

function WStructure({structure,setStructure,legalEnding,setLegalEnding,idea,distinctive,descriptor}){

        <option value="">— Choose the legal structure —</option>
        {STRUCTURES.map(s=><option key={s.key} value={s.key}>{s.label}{recommend===s.key?'  (recommended)':''}</option>)}
      </select>
      {!structure&&recommend&&<div style={{marginTop:10,padding:'10px 14px',background:'rgba(30,123,60,.08)',border:'1px solid rgba(30,123,60,.25)',borderRadius:8,fontSize:12.5,color:'#0F5C2A',display:'flex',gap:10,alignItems:'flex-start'}}><i className="fas fa-lightbulb" style={{color:'#1E7B3C',fontSize:14,flexShrink:0,marginTop:2}}></i><span>Based on your business idea, we recommend <strong>{STRUCTURES.find(s=>s.key===recommend)?.label}</strong>. You can change this.</span></div>}
    </div>
    {sel&&<div style={{background:'#fff',border:'2px solid rgba(232,115,15,.35)',borderRadius:12,padding:'22px 24px',marginBottom:22}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}><span style={{width:38,height:38,borderRadius:10,background:'rgba(232,115,15,.1)',color:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className={`fas ${sel.icon}`} style={{fontSize:15}}></i></span><h4 className="serif" style={{fontSize:17,color:'#0A1F12',margin:0,lineHeight:1.3}}>{sel.label}</h4></div>
      <p style={{fontSize:13,lineHeight:1.65,color:'rgba(10,31,18,.7)',marginBottom:14}}>{sel.desc}</p>

      <div style={{fontSize:12,color:'rgba(10,31,18,.55)',lineHeight:1.55,paddingTop:12,borderTop:'1px dashed rgba(10,31,18,.1)'}}><strong style={{color:'rgba(10,31,18,.7)'}}>Typical for:</strong> {sel.typical.join(' · ')}</div>

function WIndustry({industry,setIndustry}){return <div><div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:12}}>Step 6 · Industry directory</div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',lineHeight:1.15,color:'#0A1F12',marginBottom:12}}>Which industry best describes the business?</h2><p style={{fontSize:14,lineHeight:1.65,color:'rgba(10,31,18,.6)',marginBottom:24,maxWidth:640}}>PACRA classifies businesses according to ISIC. Picking the closest industry unlocks the right descriptive word family.</p><div style={{display:'grid',gap:10,gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))'}}>{INDUSTRIES.map(i=>{const on=industry===i.key;return <button key={i.key} onClick={()=>setIndustry(i.key)} className={`iti ${on?'sel':''}`}><div className="isic" style={{color:i.color}}><i className={`fas ${i.icon}`} style={{marginRight:6}}></i>ISIC {i.isic}</div><h4>{i.label}</h4><p>{i.blurb}</p>{i.flag&&<span style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:700,color:'#7A5C10',background:'rgba(245,166,35,.15)',padding:'3px 8px',borderRadius:99,display:'inline-block',marginTop:8}}><i className="fas fa-flag" style={{marginRight:4,fontSize:9}}></i>Review</span>}</button>})}</div></div>;}

function TrackSubmission({go}){
  const [ref,setRef]=useState('');
  const [record,setRecord]=useState(null);
  const [trackedRef,setTrackedRef]=useState(null);
  const [error,setError]=useState('');
  const [looking,setLooking]=useState(false);
  const [showLetter,setShowLetter]=useState(false);
  const [myRefs,setMyRefs]=useState(()=>readMyRefs());

  useEffect(()=>{trackEvent('page_view',{route:'track'});},[]);

  useEffect(()=>{
    if(!trackedRef || !firebaseReady) return;
    const unsub = db.collection(SE_PAYMENTS).doc(trackedRef).onSnapshot(
      snap => { if(snap.exists) setRecord({ id: snap.id, ...snap.data() }); },
      err => console.warn('[StartEasy] track listener:', err && err.message)
    );
    return unsub;
  },[trackedRef]);

  const lookup=async(r)=>{
    setError('');
    const k=(r||'').toUpperCase().trim();
    if(!k){setError('Please enter your reference.');return}
    setLooking(true);
    const found=await findPaymentByRef(k);
    setLooking(false);

            <div className="serif" style={{fontSize:18,color:'#fff',fontWeight:700}}>Your formal engagement letter is unlocked</div>

          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <span style={{width:34,height:34,borderRadius:9,background:'#F5A623',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-clock" style={{color:'#fff',fontSize:14}}></i></span>
            <div>
              <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:6}}>Print &amp; download locked</div>
              <p style={{fontSize:13,lineHeight:1.7,color:'rgba(10,31,18,.75)',margin:0}}>The formal engagement letter becomes available to print or download <strong>as soon as an officer approves your payment</strong>. This page updates automatically — check back shortly.</p>
            </div>
          </div>
        </div>:record.status==='reverted'?<div style={{background:'rgba(122,79,163,.08)',border:'1.5px solid rgba(122,79,163,.3)',borderRadius:12,padding:'22px 24px',marginBottom:20}}>
          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <span style={{width:34,height:34,borderRadius:9,background:'#7A4FA3',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-rotate-left" style={{color:'#fff',fontSize:14}}></i></span>
            <div>
              <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#5A3A7B',marginBottom:6}}>Action needed from you</div>
              <p style={{fontSize:13,lineHeight:1.7,color:'rgba(10,31,18,.75)',margin:'0 0 12px'}}>Please review the officer note above and reply on WhatsApp so we can update your submission.</p>
              <a href={waUrl('Hello StartEasy — about submission '+record.ref+'. Could you help me resolve the revert?')} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'11px 18px',background:'#25D366',color:'#fff',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Reply on WhatsApp</a>
            </div>
          </div>
        </div>:<div style={{background:'rgba(184,86,79,.08)',border:'1.5px solid rgba(184,86,79,.3)',borderRadius:12,padding:'22px 24px',marginBottom:20}}>
          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <span style={{width:34,height:34,borderRadius:9,background:'#B8564F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-circle-xmark" style={{color:'#fff',fontSize:14}}></i></span>
            <div>
              <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#7C2318',marginBottom:6}}>Engagement closed</div>
              <p style={{fontSize:13,lineHeight:1.7,color:'rgba(10,31,18,.75)',margin:'0 0 12px'}}>If you believe this is an error, message us on WhatsApp with your transaction reference and we will re-check.</p>
              <a href={waUrl('Hello StartEasy — about submission '+record.ref+'. I would like to ask about the decline.')} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'11px 18px',background:'#0A1F12',color:'#fff',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Ask for a re-check</a>
            </div>
          </div>
        </div>}

        <button onClick={()=>go('home')} style={{padding:'12px 22px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:13.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>← Back to home</button>
      </div>}

      {showLetter&&record&&<Modal open={showLetter} onClose={()=>setShowLetter(false)} eyebrow="Formal engagement letter" maxWidth="54rem">
        <div className="no-print" style={{background:'#EAF7EE',border:'1px solid rgba(30,123,60,.3)',borderRadius:10,padding:'14px 18px',marginBottom:20,display:'flex',gap:12,alignItems:'flex-start'}}>
          <span style={{width:32,height:32,borderRadius:8,background:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-check" style={{color:'#fff',fontSize:13}}></i></span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#0F5C2A',marginBottom:4}}>Approved · ready to print</div>
            <p style={{fontSize:12.5,lineHeight:1.6,color:'rgba(10,31,18,.75)',margin:'0 0 12px'}}>This is the official signed engagement letter. Save a PDF copy for your records.</p>
            <button onClick={()=>{try{document.body.classList.add('pr');window.print();setTimeout(()=>document.body.classList.remove('pr'),500)}catch(e){window.print()}}} style={{padding:'11px 18px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:8}}><i className="fas fa-print"></i> Print / Save as PDF</button>
          </div>
        </div>
        <EngagementLetterBody service={rebuildService(record)} clientName={record.clientName} clientBusiness={record.clientBusiness} clientEmail={record.clientEmail} wizardData={record.wizardData} readOnly={true}/>
      </Modal>}
    </div>
  </div>;
}
function RowKV({k,v,mono}){return <div style={{display:'flex',justifyContent:'space-between',gap:16,padding:'8px 0',borderBottom:'1px dashed rgba(10,31,18,.06)'}}><span style={{fontSize:12,color:'rgba(10,31,18,.5)',fontWeight:600}}>{k}</span><span style={{fontSize:13,color:'#0A1F12',fontWeight:700,textAlign:'right',fontFamily:mono?'Consolas,monospace':'inherit'}}>{v}</span></div>;}

function MiniBarChart({data,height=140}){
  const max=Math.max(1,...data.map(d=>d.value));
  const w=Math.max(320,data.length*34+30);
  return <div style={{overflowX:'auto'}}>
    <svg viewBox={`0 0 ${w} ${height}`} style={{width:'100%',minWidth:w+'px',height:height+'px',display:'block'}}>
      <line x1="0" y1={height-22} x2={w} y2={height-22} stroke="rgba(10,31,18,.1)"/>
      {data.map((d,i)=>{
        const barH=(d.value/max)*(height-46);
        const x=i*34+18;
        return <g key={i}>
          <rect x={x} y={height-22-barH} width={22} height={barH} rx={3} fill={d.value>0?'#E8730F':'rgba(10,31,18,.06)'}/>
          {d.value>0&&<text x={x+11} y={height-26-barH} fontSize="10" textAnchor="middle" fontWeight="700" fill="#0A1F12">{d.value}</text>}
          <text x={x+11} y={height-6} fontSize="9" textAnchor="middle" fill="rgba(10,31,18,.5)" fontWeight="600">{d.label}</text>
        </g>;
      })}
    </svg>
  </div>;
}

function AdminKpi({label,value,sub,color='#E8730F',icon}){
  return <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:'18px 20px',borderTopWidth:3,borderTopColor:color}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
      <span style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)'}}>{label}</span>
      {icon&&<span style={{width:28,height:28,borderRadius:8,background:color+'1a',color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className={`fas ${icon}`} style={{fontSize:12}}></i></span>}
    </div>
    <div className="serif" style={{fontSize:30,fontWeight:800,color:'#0A1F12',lineHeight:1.05,marginBottom:4}}>{value}</div>
    {sub&&<div style={{fontSize:11.5,color:'rgba(10,31,18,.5)'}}>{sub}</div>}
  </div>;
}

function AdminPortal({onExit}){
  const [authed,setAuthed]=useState(false);
  const [authChecked,setAuthChecked]=useState(false);
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [signingIn,setSigningIn]=useState(false);
  const [pwErr,setPwErr]=useState('');
  const [tab,setTab]=useState('overview');
  const [review,setReview]=useState(null);
  const [filter,setFilter]=useState('all');
  const [note,setNote]=useState('');
  const [payments,setPayments]=useState([]);
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [visitor]=useState(()=>readVisitor());

  const checkIsAdmin = useCallback(async (user) => {
    if(!user || !firebaseReady) return false;
    try {
      const snap = await db.collection(SE_ADMINS).doc(user.uid).get();
      console.log('[StartEasy] admin check for', user.uid, '→', snap.exists ? 'GRANTED' : 'NOT FOUND in se_admins');
      return snap.exists;
    } catch(e) {
      console.error('[StartEasy] admin check FAILED for', user.uid, ':', e && e.code, e && e.message);
      return false;
    }
  },[]);

  useEffect(()=>{
    if(!firebaseReady){setAuthChecked(true);return}
    const unsub = auth.onAuthStateChanged(async user => {
      if(user){
        const isAdmin = await checkIsAdmin(user);
        setAuthed(isAdmin);
      } else {
        setAuthed(false);
      }
      setAuthChecked(true);
    });
    return unsub;
  },[checkIsAdmin]);

  useEffect(()=>{
    if(!authed || !firebaseReady) return;
    const unsub = db.collection(SE_PAYMENTS).orderBy('submittedAt','desc').limit(500)
      .onSnapshot(snap=>{
        setPayments(snap.docs.map(d=>({ id: d.id, ...d.data() })));
        setLoading(false);
      }, err=>{
        console.warn('[StartEasy] payments listener:', err && err.message);
        setLoading(false);
      });
    return unsub;
  },[authed]);

  useEffect(()=>{
    if(!authed || !firebaseReady) return;
    const unsub = db.collection(SE_EVENTS).orderBy('at','desc').limit(2000)
      .onSnapshot(snap=>{
        setEvents(snap.docs.map(d=>({ id: d.id, ...d.data() })));
      }, err=>console.warn('[StartEasy] events listener:', err && err.message));
    return unsub;
  },[authed]);

  const handleSignIn = async () => {
    setPwErr('');
    if(!email.trim() || !pw){ setPwErr('Enter your email and password.'); return; }
    setSigningIn(true);
    try {
      const res = await adminSignIn(email, pw);
      if(!res.ok){
        setPwErr(res.error || 'Sign-in failed.');
        return;
      }
      const user = auth.currentUser;
      if(!user){
        setPwErr('Signed in but no session. Please try again.');
        return;
      }
      const isAdmin = await checkIsAdmin(user);
      if(!isAdmin){
        await auth.signOut();
        setPwErr('This account is not listed as an admin. Add a document to se_admins with this user\'s UID.');
        return;
      }
      setAuthed(true);
    } catch(e) {
      setPwErr('Unexpected error: ' + ((e && e.message) || 'unknown'));
    } finally {
      setSigningIn(false);
    }
  };

  const handleSignOut = async () => {
    await adminSignOut();
    setAuthed(false);
    onExit();
  };

  const stats=useMemo(()=>{
    const since=Date.now()-14*24*3600*1000;
    const inWindow=events.filter(e=>e.at>=since);
    const visits=inWindow.filter(e=>e.type==='visit').length;
    const uniqueVisitors=new Set(inWindow.map(e=>e.visitorId).filter(Boolean)).size;
    const pageViews=inWindow.filter(e=>e.type==='page_view').length;
    const wizardStarts=inWindow.filter(e=>e.type==='wizard_start').length;
    const wizardCompletes=inWindow.filter(e=>e.type==='wizard_complete').length;
    const serviceViews=inWindow.filter(e=>e.type==='service_view').length;
    const paymentsSubmitted=payments.length;
    const underReview=payments.filter(p=>p.status==='under_review').length;
    const approved=payments.filter(p=>p.status==='approved').length;
    const reverted=payments.filter(p=>p.status==='reverted').length;
    const declined=payments.filter(p=>p.status==='declined').length;
    return {visits,uniqueVisitors,pageViews,wizardStarts,wizardCompletes,serviceViews,paymentsSubmitted,underReview,approved,reverted,declined};
  },[events,payments]);

  const chartData=useMemo(()=>{
    const days=14;const out=[];
    for(let i=days-1;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
      const next=new Date(d);next.setDate(next.getDate()+1);
      const label=d.toLocaleDateString('en-GB',{day:'2-digit'});
      const value=events.filter(e=>e.type==='visit'&&e.at>=d.getTime()&&e.at<next.getTime()).length;
      out.push({label,value,at:d.getTime()});
    }
    return out;
  },[events]);

  const filteredPayments=useMemo(()=>{
    if(filter==='all')return payments;
    return payments.filter(p=>p.status===filter);
  },[payments,filter]);

  const recentActivity=useMemo(()=>[...events].sort((a,b)=>b.at-a.at).slice(0,25),[events]);

  const setStatus=async(status)=>{
    if(!review)return;
    const updated=await updatePaymentStatus(review.ref,status,note||'');
    if(updated){
      trackEvent('payment_reviewed',{ref:review.ref,status});
    }
    setReview(null);setNote('');
  };

  if(!authChecked){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px'}}>
      <div style={{textAlign:'center',color:'#fff'}}>
        <i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#F5A623'}}></i>
        <p style={{marginTop:14,fontSize:13,color:'rgba(255,255,255,.6)'}}>Loading admin portal…</p>
      </div>
    </div>;
  }

  if(!authed){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px'}}>
      <div style={{background:'#fff',borderRadius:14,padding:'34px 32px',maxWidth:440,width:'100%',boxShadow:'0 30px 80px rgba(0,0,0,.4)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22}}>
          <Mark size={42}/>
          <div><div style={{fontSize:9,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.4)',marginBottom:2}}>Administrative Services Desk</div><div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,fontWeight:800,color:'#0A1F12'}}>Admin Portal</div></div>
        </div>
        <p style={{fontSize:13,lineHeight:1.6,color:'rgba(10,31,18,.65)',marginBottom:22}}>Restricted access. Sign in with your Firebase admin account.</p>
        <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Admin email</label>
        <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setPwErr('')}} placeholder="admin@starteasyzambia.com" autoComplete="username" style={{width:'100%',background:'#fff',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15,color:'#0A1F12',fontFamily:'inherit',marginBottom:14}}/>
        <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Password</label>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setPwErr('')}} onKeyDown={e=>{if(e.key==='Enter')handleSignIn()}} placeholder="••••••••••" autoComplete="current-password" style={{width:'100%',background:'#fff',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15,color:'#0A1F12',fontFamily:'inherit'}}/>
        {pwErr&&<div style={{marginTop:10,fontSize:12.5,color:'#B8564F',display:'flex',alignItems:'center',gap:6,lineHeight:1.5}}><i className="fas fa-circle-exclamation" style={{flexShrink:0}}></i> {pwErr}</div>}
        <div style={{display:'flex',gap:10,marginTop:20}}>
          <button onClick={handleSignIn} disabled={signingIn} style={{flex:1,padding:'14px 22px',background:signingIn?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,cursor:signingIn?'wait':'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}><i className={`fas ${signingIn?'fa-spinner fa-spin':'fa-unlock'}`}></i> {signingIn?'Signing in…':'Sign in'}</button>
          <button onClick={onExit} style={{padding:'14px 20px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Cancel</button>
        </div>
        <p style={{marginTop:22,fontSize:11,color:'rgba(10,31,18,.45)',lineHeight:1.6,textAlign:'center'}}>Access is verified against Firebase Authentication, then against a Firestore <code style={{fontFamily:'Consolas,monospace',background:'rgba(10,31,18,.06)',padding:'2px 6px',borderRadius:4,fontSize:11}}>se_admins</code> document matching your user ID.</p>
      </div>
    </div>;
  }

  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff'}}>
      <div style={{maxWidth:1240,margin:'0 auto',padding:'24px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:20,flexWrap:'wrap'}}>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <Mark size={42}/>
            <div>
              <div style={{fontSize:9,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:700,color:'rgba(255,255,255,.4)'}}>Administrative Services Desk</div>
              <div className="serif" style={{fontSize:24,fontWeight:800,color:'#fff',lineHeight:1.1}}>Admin Portal</div>
            </div>
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            <span style={{fontSize:11.5,color:'rgba(255,255,255,.55)',display:'inline-flex',alignItems:'center',gap:6}}><i className="fas fa-circle" style={{color:'#4CB050',fontSize:7}}></i> Live — real-time sync</span>
            <button onClick={handleSignOut} style={{padding:'10px 18px',background:'rgba(184,86,79,.15)',color:'#FFB4A8',border:'1px solid rgba(184,86,79,.35)',borderRadius:8,fontSize:12.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:8}}><i className="fas fa-right-from-bracket"></i> Sign out</button>
          </div>
        </div>
      </div>
    </section>

    <section style={{background:'#fff',borderBottom:'1px solid rgba(10,31,18,.08)',position:'sticky',top:0,zIndex:20}}>
      <div style={{maxWidth:1240,margin:'0 auto',padding:'0 24px',display:'flex',gap:6,overflowX:'auto'}}>
        {[['overview','Overview','fa-chart-line'],['payments','Payments','fa-money-check-dollar'],['submissions','Submissions','fa-file-pen'],['visitors','Visitors','fa-users-viewfinder'],['settings','Settings','fa-gear']].map(([k,label,icon])=>
          <button key={k} onClick={()=>setTab(k)} style={{padding:'16px 16px',background:'none',border:'none',borderBottom:tab===k?'3px solid #E8730F':'3px solid transparent',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',color:tab===k?'#0A1F12':'rgba(10,31,18,.55)',display:'inline-flex',alignItems:'center',gap:8,flexShrink:0}}>
            <i className={`fas ${icon}`} style={{fontSize:12}}></i> {label}
          </button>
        )}
      </div>
    </section>

    <section style={{maxWidth:1240,margin:'0 auto',padding:'32px 24px 60px'}}>
      {loading?<div style={{textAlign:'center',padding:'80px 24px'}}>
        <i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i>
        <p style={{marginTop:14,fontSize:13,color:'rgba(10,31,18,.55)'}}>Loading data from Firestore…</p>
      </div>:<>
      {tab==='overview'&&<div className="fadein">
        <div style={{marginBottom:24}}>
          <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:8}}>Dashboard · Live</div>
          <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',lineHeight:1.15,marginBottom:6}}>Platform at a glance</h2>
          <p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>Every payment and event from every visitor, synced from Firestore in real time.</p>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3" style={{marginBottom:24}}>
          <AdminKpi label="Visits (14d)" value={stats.visits} sub={`${stats.uniqueVisitors} unique visitor${stats.uniqueVisitors!==1?'s':''}`} icon="fa-eye"/>
          <AdminKpi label="Page views" value={stats.pageViews} sub="Last 14 days" icon="fa-compass" color="#1B6CA8"/>
          <AdminKpi label="Wizard starts" value={stats.wizardStarts} sub={`${stats.wizardCompletes} completed`} icon="fa-wand-magic-sparkles" color="#7A4FA3"/>
          <AdminKpi label="Service views" value={stats.serviceViews} sub="Detail modals opened" icon="fa-file" color="#0E7C7B"/>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3" style={{marginBottom:24}}>
          <AdminKpi label="Payments submitted" value={stats.paymentsSubmitted} sub="All time" icon="fa-receipt"/>
          <AdminKpi label="Under review" value={stats.underReview} sub="Awaiting action" icon="fa-clock" color="#F5A623"/>
          <AdminKpi label="Approved" value={stats.approved} sub={`${stats.reverted} reverted · ${stats.declined} declined`} icon="fa-circle-check" color="#1E7B3C"/>
          <AdminKpi label="Your session" value={visitor?visitor.visits:'—'} sub={visitor?`First seen ${timeAgo(visitor.firstSeen)}`:'No visitor record'} icon="fa-user" color="#0E7C7B"/>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px',marginBottom:24}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase',color:'rgba(10,31,18,.65)'}}>Visits — last 14 days</div>
            <div style={{fontSize:11.5,color:'rgba(10,31,18,.5)'}}>Total: <strong>{chartData.reduce((a,b)=>a+b.value,0)}</strong></div>
          </div>
          <MiniBarChart data={chartData}/>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px'}}>
          <div style={{fontSize:13,fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase',color:'rgba(10,31,18,.65)',marginBottom:16}}>Recent activity</div>
          {recentActivity.length===0?<p style={{fontSize:13,color:'rgba(10,31,18,.5)',fontStyle:'italic',margin:0}}>No events recorded yet.</p>:
            <div style={{display:'flex',flexDirection:'column',gap:0}}>
              {recentActivity.map((e,i)=>(
                <div key={e.id||i} style={{display:'flex',gap:14,alignItems:'flex-start',padding:'12px 0',borderBottom:i<recentActivity.length-1?'1px dashed rgba(10,31,18,.08)':'none'}}>
                  <span style={{width:32,height:32,borderRadius:8,background:'rgba(232,115,15,.1)',color:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <i className={`fas ${{
                      visit:'fa-eye',page_view:'fa-compass',wizard_start:'fa-wand-magic-sparkles',wizard_step:'fa-shoe-prints',wizard_complete:'fa-circle-check',service_view:'fa-file',payment_submit:'fa-receipt',payment_reviewed:'fa-gavel',survey_submit:'fa-poll'
                    }[e.type]||'fa-circle'}`} style={{fontSize:11}}></i>
                  </span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:'#0A1F12',marginBottom:2}}>{e.type.replace(/_/g,' ')}</div>
                    <div style={{fontSize:11.5,color:'rgba(10,31,18,.55)',lineHeight:1.5,wordBreak:'break-word'}}>
                      {e.route&&<>route: <strong>{e.route}</strong> · </>}
                      {e.current&&<>step: <strong>{e.current}</strong> · </>}
                      {e.scope&&<>scope: <strong>{e.scope}</strong> · </>}
                      {e.ref&&<>ref: <strong style={{fontFamily:'Consolas,monospace'}}>{e.ref}</strong> · </>}
                      {e.status&&<>status: <strong>{e.status}</strong> · </>}
                      {e.filled!==undefined&&<>answers: <strong>{e.filled}</strong> · </>}
                      {e.serviceCode&&<>service: <strong>{e.serviceCode}</strong></>}
                      {e.visitorId&&<span style={{color:'rgba(10,31,18,.35)',fontFamily:'Consolas,monospace'}}> · {e.visitorId}</span>}
                    </div>
                  </div>
                  <span style={{fontSize:10.5,color:'rgba(10,31,18,.4)',fontWeight:600,flexShrink:0}}>{timeAgo(e.at)}</span>
                </div>
              ))}
            </div>}
        </div>
      </div>}

      {tab==='payments'&&<div className="fadein">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:16,flexWrap:'wrap',marginBottom:20}}>
          <div>
            <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:8}}>Payment queue · Live</div>
            <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',lineHeight:1.15,marginBottom:6}}>Review and action submissions</h2>
            <p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>Approve to unlock the formal engagement letter for the client, or revert/decline with a note.</p>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[['all','All'],['under_review','Under review'],['approved','Approved'],['reverted','Reverted'],['declined','Declined']].map(([k,l])=>
              <button key={k} onClick={()=>setFilter(k)} style={{padding:'8px 14px',borderRadius:99,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,border:filter===k?'none':'1px solid rgba(10,31,18,.12)',background:filter===k?'#0A1F12':'#fff',color:filter===k?'#fff':'rgba(10,31,18,.7)'}}>{l}</button>
            )}
          </div>
        </div>
        {filteredPayments.length===0?<div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:56,textAlign:'center'}}><p style={{fontSize:14,color:'rgba(10,31,18,.55)',margin:0}}>No submissions match this filter.</p></div>:
          <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,overflow:'hidden'}}>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',minWidth:820}}>
                <thead>
                  <tr>{['Reference','Submitted','Client','Engagement','Amount','Status',''].map(h=>
                    <th key={h} style={{textAlign:'left',padding:'12px 16px',background:'#FBFDFB',borderBottom:'1px solid rgba(10,31,18,.08)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)'}}>{h}</th>
                  )}</tr>
                </thead>
                <tbody>
                  {filteredPayments.map(p=>(
                    <tr key={p.ref} style={{borderBottom:'1px solid rgba(10,31,18,.05)'}}>
                      <td style={{padding:'14px 16px',fontFamily:'Consolas,monospace',fontSize:12.5,fontWeight:700,color:'#0A1F12',whiteSpace:'nowrap'}}>{p.ref}</td>
                      <td style={{padding:'14px 16px',fontSize:11.5,color:'rgba(10,31,18,.55)',whiteSpace:'nowrap'}}>{timeAgo(p.submittedAt)}</td>
                      <td style={{padding:'14px 16px',fontSize:12.5,color:'#0A1F12',fontWeight:600}}>{p.clientName}{p.clientBusiness&&<div style={{fontSize:11,color:'rgba(10,31,18,.5)',fontWeight:400,marginTop:2}}>{p.clientBusiness}</div>}</td>
                      <td style={{padding:'14px 16px',fontSize:12.5,color:'#0A1F12'}}>{p.serviceTitle}<div style={{fontSize:11,color:'rgba(10,31,18,.5)',fontWeight:400,marginTop:2}}>{p.serviceCode}</div></td>
                      <td style={{padding:'14px 16px',fontSize:12.5,color:'#0A1F12',fontWeight:700,whiteSpace:'nowrap'}}>{p.amount}</td>
                      <td style={{padding:'14px 16px',whiteSpace:'nowrap'}}><StatusPill status={p.status}/></td>
                      <td style={{padding:'14px 16px',whiteSpace:'nowrap'}}>
                        <button onClick={()=>{setReview(p);setNote(p.adminNote||'')}} style={{padding:'8px 14px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{p.status==='under_review'?'Review':'Open'}</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>}
      </div>}

      {tab==='submissions'&&<div className="fadein">
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:8}}>Wizard submissions</div>
          <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',lineHeight:1.15,marginBottom:6}}>What users completed</h2>
        </div>
        {payments.filter(p=>p.wizardData).length===0?<div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:56,textAlign:'center'}}><p style={{fontSize:14,color:'rgba(10,31,18,.55)',margin:0}}>No wizard-based submissions yet.</p></div>:
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {payments.filter(p=>p.wizardData).map(p=>(
              <div key={p.ref} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px'}}>
                <div style={{display:'flex',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:16}}>
                  <div><div style={{fontFamily:'Consolas,monospace',fontSize:12,fontWeight:800,color:'#0A1F12'}}>{p.ref}</div><div style={{fontSize:11.5,color:'rgba(10,31,18,.5)',marginTop:4}}>{p.clientName} · {timeAgo(p.submittedAt)}</div></div>
                  <StatusPill status={p.status}/>
                </div>
                <div style={{display:'grid',gap:10}}>
                  {p.wizardData.idea&&<RowKV k="Business idea" v={p.wizardData.idea}/>}
                  {p.wizardData.primaryActivity&&<RowKV k="Primary activity" v={p.wizardData.primaryActivity}/>}
                  {p.wizardData.structure&&<RowKV k="Structure" v={p.wizardData.structure.label}/>}
                  {p.wizardData.legalEnding!==undefined&&<RowKV k="Legal ending" v={p.wizardData.legalEnding||'(none)'} mono/>}
                  {p.wizardData.industry&&<RowKV k="Industry" v={p.wizardData.industry.label}/>}
                  {p.wizardData.distinctive&&<RowKV k="Distinctive" v={p.wizardData.distinctive} mono/>}
                  {p.wizardData.descriptor&&<RowKV k="Descriptor" v={p.wizardData.descriptor} mono/>}
                </div>
                {p.wizardData.names&&p.wizardData.names.length>0&&<div style={{marginTop:16,paddingTop:16,borderTop:'1px dashed rgba(10,31,18,.1)'}}>
                  <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',marginBottom:10}}>Six-name proposal</div>
                  <ol style={{paddingLeft:20,margin:0}}>{p.wizardData.names.map((n,i)=><li key={i} style={{fontFamily:'Consolas,monospace',fontSize:12.5,fontWeight:700,color:'#0A1F12',marginBottom:4}}>{n}</li>)}</ol>
                </div>}
              </div>
            ))}
          </div>}
      </div>}

      {tab==='visitors'&&<div className="fadein">
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:8}}>Visitor activity</div>
          <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',lineHeight:1.15,marginBottom:6}}>Who has been on the platform</h2>
          <p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>Grouped by device. Aggregated across all visitors using the platform.</p>
        </div>
        {(()=>{
          const byVisitor={};
          events.forEach(e=>{if(!e.visitorId)return;(byVisitor[e.visitorId]=byVisitor[e.visitorId]||[]).push(e)});
          const entries=Object.entries(byVisitor).sort((a,b)=>{
            const la=Math.max(...a[1].map(e=>e.at)),lb=Math.max(...b[1].map(e=>e.at));
            return lb-la;
          });
          if(entries.length===0)return <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:56,textAlign:'center'}}><p style={{fontSize:14,color:'rgba(10,31,18,.55)',margin:0}}>No visitors recorded yet.</p></div>;
          return <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {entries.map(([vid,evs])=>{
              const pages=evs.filter(e=>e.route).map(e=>e.route);
              const uniquePages=[...new Set(pages)];
              const lastAt=Math.max(...evs.map(e=>e.at));
              const firstAt=Math.min(...evs.map(e=>e.at));
              return <div key={vid} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'20px 22px'}}>
                <div style={{display:'flex',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:12}}>
                  <div>
                    <div style={{fontFamily:'Consolas,monospace',fontSize:12.5,fontWeight:800,color:'#0A1F12'}}>{vid}</div>
                    <div style={{fontSize:11.5,color:'rgba(10,31,18,.5)',marginTop:4}}>{evs.length} event{evs.length!==1?'s':''} · last active {timeAgo(lastAt)}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:11,color:'rgba(10,31,18,.45)'}}>First seen {timeAgo(firstAt)}</div>
                  </div>
                </div>
                {uniquePages.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:8}}>{uniquePages.map(p=><span key={p} style={{padding:'4px 10px',background:'rgba(10,31,18,.05)',borderRadius:99,fontSize:11,fontWeight:600,color:'rgba(10,31,18,.7)'}}>{p}</span>)}</div>}
              </div>;
            })}
          </div>;
        })()}
      </div>}

      {tab==='settings'&&<div className="fadein" style={{maxWidth:720}}>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:8}}>Settings</div>
          <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',lineHeight:1.15,marginBottom:6}}>Portal settings</h2>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px',marginBottom:16}}>
          <div style={{fontSize:12.5,fontWeight:800,color:'#0A1F12',marginBottom:10}}>Authentication</div>
          <p style={{fontSize:13,lineHeight:1.7,color:'rgba(10,31,18,.7)',margin:0}}>This portal is gated by Firebase Authentication, then by a Firestore document in the <code style={{fontFamily:'Consolas,monospace',background:'rgba(10,31,18,.06)',padding:'2px 6px',borderRadius:4,fontSize:12}}>se_admins</code> collection whose ID matches your user ID. To add a new admin: create the account in Firebase Console → Authentication → Users, then create a matching document in Firestore → se_admins with the new user's UID as the document ID and an <code style={{fontFamily:'Consolas,monospace',background:'rgba(10,31,18,.06)',padding:'2px 6px',borderRadius:4,fontSize:12}}>email</code> field.</p>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px',marginBottom:16}}>
          <div style={{fontSize:12.5,fontWeight:800,color:'#0A1F12',marginBottom:10}}>Cloud data</div>
          <div style={{display:'grid',gap:10}}>
            <RowKV k="Analytics events" v={events.length+' in Firestore'}/>
            <RowKV k="Payment records" v={payments.length+' in Firestore'}/>
            <RowKV k="Firestore project" v={FIREBASE_CONFIG.projectId} mono/>
            <RowKV k="Collections" v="se_payments · se_events · se_admins" mono/>
          </div>
          <div style={{display:'flex',gap:10,marginTop:16,flexWrap:'wrap'}}>
            <button onClick={async()=>{if(confirm('Delete up to 500 of the newest analytics events from Firestore? This cannot be undone.')){const ok=await clearAllEvents();if(ok)alert('Cleared.');else alert('Could not clear events — check rules and try again.');}}} style={{padding:'10px 18px',background:'#fff',border:'1px solid rgba(184,86,79,.3)',color:'#B8564F',borderRadius:8,fontSize:12.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className="fas fa-trash"></i> Clear recent analytics</button>
          </div>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'22px 24px'}}>
          <div style={{fontSize:12.5,fontWeight:800,color:'#0A1F12',marginBottom:10}}>Project</div>
          <p style={{fontSize:13,lineHeight:1.7,color:'rgba(10,31,18,.7)',margin:0}}>StartEasy runs on its own Firebase project: <span style={{fontFamily:'Consolas,monospace'}}>starteasy-zambia</span>. All data lives in the collections <span style={{fontFamily:'Consolas,monospace'}}>se_payments</span>, <span style={{fontFamily:'Consolas,monospace'}}>se_events</span> and <span style={{fontFamily:'Consolas,monospace'}}>se_admins</span>.</p>
        </div>
      </div>}
      </>}
    </section>

        <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer'}} aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg></button>

    <button onClick={()=>setOpen(!open)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>

function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [wizardScope,setWizardScope]=useState(null);
  const [wizardSession,setWizardSession]=useState(0);
  const [serviceModal,setServiceModal]=useState(null);
  const [engagementService,setEngagementService]=useState(null);
  const [engagementClient,setEngagementClient]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);

  useEffect(()=>{
    getVisitor();
    const t = setTimeout(()=>{ trackEvent('visit',{ua:(navigator.userAgent||'').slice(0,120)}); }, 1200);
    return ()=>clearTimeout(t);
  },[]);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'});trackEvent('page_view',{route:r,arg:arg||null})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openWizard=useCallback(scope=>{setWizardScope(scope||null);setWizardSession(s=>s+1);trackEvent('wizard_start',{scope:scope||'auto'});go('wizard')},[go]);
  const proceedToEngagement=useCallback(s=>{setServiceModal(null);setTimeout(()=>setEngagementService(s),260);trackEvent('engagement_start',{code:s.code,title:s.title})},[]);
  const agreedEngagement=useCallback(({client,service})=>{setEngagementClient({client,service});setEngagementService(null);setTimeout(()=>setPaymentOpen(true),280)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setEngagementClient(null),260)},[]);
  const handleServiceClick=useCallback(s=>{if(s.wizardEntry){openWizard(s.wizardScope);return}setServiceModal(s)},[openWizard]);
  const handleWizardOrder=useCallback(wizData=>{setEngagementService(wizData)},[]);

  const view=()=>{
    switch(route){
      case 'wizard': return <Wizard key={'wz'+wizardSession} initialScope={wizardScope} onExit={()=>go('home')} onOrderFormal={handleWizardOrder}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetail deskId={routeArg||'pacra'} go={go} onServiceClick={handleServiceClick} onWizard={openWizard}/>;
      case 'services': return <ServicesPage onServiceClick={handleServiceClick}/>;
      case 'track': return <TrackSubmission go={go}/>;
      case 'admin': return <AdminPortal onExit={()=>go('home')}/>;
      case 'engagement': return <EngagementPage go={go}/>;
      case 'pricing': return <PricingPage go={go}/>;
      case 'about': return <AboutPage/>;
      default: return <Home go={go} onResume={()=>openWizard(null)}/>;
    }
  };

  const hideChrome=route==='admin';

  return <div style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    {!hideChrome&&<Nav route={route} go={go}/>}
    <main style={{flex:1}}>{view()}</main>
    {!hideChrome&&<Footer go={go}/>}
    {!hideChrome&&<FloatingAssistant/>}
    {serviceModal&&<ServiceDetail service={serviceModal} onClose={()=>setServiceModal(null)} onProceed={proceedToEngagement} onWizard={openWizard}/>}
    {engagementService&&<Engagement service={engagementService} onClose={()=>setEngagementService(null)} onAgreed={agreedEngagement}/>}
    {paymentOpen&&engagementClient&&<Modal open={paymentOpen} onClose={closePayment} eyebrow="Engagement payment" maxWidth="52rem">
      <Payment service={engagementClient.service} client={engagementClient.client} onClose={closePayment} onDone={()=>{clearSnapshot();closePayment();setTimeout(()=>go('home'),320)}}/>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
