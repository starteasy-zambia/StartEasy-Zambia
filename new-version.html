function writeSnapshot(patch){try{const cur=readSnapshot()||{};const next={...cur,...patch,v:1,savedAt:Date.now()};localStorage.setItem(LS_KEY,JSON.stringify(next));return next;}catch(e){return null}}
function clearSnapshot(){try{localStorage.removeItem(LS_KEY)}catch(e){}}
function hasResumableWizard(snap){if(!snap||!snap.wizard)return false;const w=snap.wizard;return !!(w.scope||(w.idea&&String(w.idea).trim().length>0)||w.distinctive||w.industry||w.primaryActivity||w.structure);}
function timeAgo(ts){if(!ts)return '';const s=Math.max(0,Math.floor((Date.now()-ts)/1000));if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';const d=Math.floor(s/86400);return d+' day'+(d>1?'s':'')+' ago';}

function getVisitor(){
  try{
    let v=JSON.parse(localStorage.getItem(VISITOR_KEY)||'null');
    if(!v){v={id:'v_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),firstSeen:Date.now(),visits:0,lastSeen:Date.now()};}
    v.visits=(v.visits||0)+1;v.lastSeen=Date.now();
    localStorage.setItem(VISITOR_KEY,JSON.stringify(v));
    return v;
  }catch(e){return {id:'anon_'+Date.now().toString(36),firstSeen:Date.now(),visits:1,lastSeen:Date.now()}}
}
function readVisitor(){try{return JSON.parse(localStorage.getItem(VISITOR_KEY)||'null')}catch(e){return null}}
function rememberMyRef(ref){try{const l=JSON.parse(localStorage.getItem(MY_REFS_KEY)||'[]');if(!l.includes(ref)){l.unshift(ref);localStorage.setItem(MY_REFS_KEY,JSON.stringify(l.slice(0,20)));}}catch(e){}}
function readMyRefs(){try{return JSON.parse(localStorage.getItem(MY_REFS_KEY)||'[]')}catch(e){return []}}

async function addPayment(rec){
  if(!firebaseReady) return null;
  const record = { ...rec, status: 'under_review', submittedAt: Date.now(),
    history: [{ status: 'under_review', at: Date.now(), note: 'Payment reference received. Awaiting officer verification.' }] };
  try { await db.collection(SE_PAYMENTS).doc(rec.ref).set(record); return record; }
  catch(e) { console.error('[StartEasy] ❌ addPayment failed:', e && e.code, e && e.message); return null; }
}
async function findPaymentByRef(ref){
  if(!firebaseReady || !ref) return null;
  try { const key = ref.toUpperCase().trim(); const snap = await db.collection(SE_PAYMENTS).doc(key).get(); return snap.exists ? { id: snap.id, ...snap.data() } : null; }
  catch(e) { return null; }
}
async function updatePaymentStatus(ref, status, note){
  if(!firebaseReady) return null;
  try {
    const docRef = db.collection(SE_PAYMENTS).doc(ref);
    const snap = await docRef.get(); if(!snap.exists) return null;
    const cur = snap.data();
    const history = [...(cur.history||[]), { status, at: Date.now(), note: note||'' }];
    await docRef.update({ status, adminNote: note||'', reviewedAt: Date.now(), history });
    return { id: ref, ...cur, status, adminNote: note||'', history };
  } catch(e) { return null; }
}
function trackEvent(type, payload){
  if(!firebaseReady) return;
  try { const visitor = readVisitor();
    db.collection(SE_EVENTS).add({ type, at: Date.now(), visitorId: visitor ? visitor.id : null, ...(payload || {}) }).catch(()=>{});
  } catch(e) {}
}
async function clearAllEvents(){
  if(!firebaseReady) return false;
  try { const snap = await db.collection(SE_EVENTS).limit(500).get(); const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref)); await batch.commit(); return true;
  } catch(e) { return false; }
}
async function adminSignIn(email, pw){
  if(!firebaseReady) return { ok:false, error:'Authentication service unavailable.' };
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('__timeout__')), 15000));
    await Promise.race([ auth.signInWithEmailAndPassword(email.trim(), pw), timeout ]);
    return { ok:true };
  } catch(e) {
    const code = e && e.code ? e.code : ''; const msg = e && e.message ? e.message : '';
    if(msg === '__timeout__') return { ok:false, error:'Sign-in timed out. Check your internet connection and try again.' };
    if(code === 'auth/wrong-password') return { ok:false, error:'Incorrect password.' };
    if(code === 'auth/user-not-found') return { ok:false, error:'No account with that email.' };
    if(code === 'auth/invalid-credential') return { ok:false, error:'Incorrect email or password.' };
    if(code === 'auth/invalid-email') return { ok:false, error:'That email address is not valid.' };
    if(code === 'auth/operation-not-allowed') return { ok:false, error:'Email/password sign-in is NOT enabled.' };
    if(code === 'auth/unauthorized-domain') return { ok:false, error:'This domain is not authorised.' };
    if(code === 'auth/too-many-requests') return { ok:false, error:'Too many attempts. Wait a few minutes and try again.' };
    if(code === 'auth/network-request-failed') return { ok:false, error:'Network error. Check your connection and try again.' };
    return { ok:false, error: 'Sign-in failed: ' + (code || msg || 'unknown error') };
  }
}
async function adminSignOut(){ try { await auth.signOut(); } catch(e) {} }

function resolveLegalEnding(structure,choice){
  if(!structure)return '';
  if(structure.endingRule==='none')return '';
  if(structure.endingRule==='choice'){if(choice==='NONE')return '';if(choice==='UNLIMITED')return 'UNLIMITED';return 'LIMITED';}

}

const PROTECTED=['bank','insurance','trust','microfinance','pension','securities','lottery','gaming','casino','university','national','government','ministry','municipal','council','chartered','royal','sacco','cooperative','revenue','customs'];
const GENERIC=['business','enterprise','enterprises','company','services','service','trading','traders','investments','investment','holdings','group','general','dealers','suppliers','ventures','solutions','consultants','consulting'];
function analyseName(name){
  const n=(name||'').trim().toLowerCase();
  if(!n)return{score:0,issues:[],patterns:[],protected:[]};
  const issues=[];const patterns=PATTERNS.filter(p=>n.includes(p));const prot=PROTECTED.filter(p=>n.includes(p));let score=100;
  if(n.length<3){score-=40;issues.push({level:'crit',text:'Name is too short to be distinctive.'})}
  if(/^\d+$/.test(n)){score-=40;issues.push({level:'crit',text:'A name made only of numbers is unlikely to be accepted.'})}
  if(n.length>30){score-=10;issues.push({level:'warn',text:'Unusually long — shorter distinctive names are usually stronger.'})}
  if(patterns.length>0){score-=patterns.length*6;issues.push({level:'warn',text:`Contains ${patterns.length} common pattern${patterns.length>1?'s':''}: ${patterns.join(', ')}. Add a more distinctive element.`})}
  if(prot.length>0){score-=prot.length*20;issues.push({level:'crit',text:`Contains protected term${prot.length>1?'s':''}: ${prot.join(', ')}. Written consent may be required.`})}
  if(GENERIC.includes(n)){score-=30;issues.push({level:'crit',text:'A single generic word is unlikely to be accepted.'})}
  score=Math.max(0,Math.min(100,Math.round(score)));
  return{score,issues,patterns,protected:prot};
}
function label(s){if(s>=80)return'Strong';if(s>=60)return'Moderate';if(s>=40)return'Weak';return'Needs work'}
function color(s){if(s>=80)return'#1E7B3C';if(s>=60)return'#E8730F';return'#B8564F'}
function escapeRegex(str){return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function findEmbeddedLibraryWords(descriptor,industry){if(!descriptor||!industry)return[];const descLower=descriptor.toLowerCase();return industry.descriptors.filter(lib=>{const libLower=lib.toLowerCase();return new RegExp(`\\b${escapeRegex(libLower)}\\b`,'i').test(descLower);});}
function validateCustomDescriptor(text,industry){
  const t=(text||'').trim();
  if(!t) return {state:'empty'};
  if(t.length<3) return {state:'too-short',message:'The descriptor is very short. Use at least 3 characters.'};
  if(/^\d+$/.test(t)) return {state:'numeric',message:'A descriptor made only of numbers is not usable. Add real words.'};
  const embedded=findEmbeddedLibraryWords(t,industry);
  if(embedded.length>0)return {state:'valid',message:`Matches your industry — contains "${embedded[0]}", a recognised library word. You may proceed.`,embedded};
  const words=t.split(/\s+/).filter(Boolean);
  if(words.length>=2)return {state:'valid',message:'Accepted — you may proceed.'};
  return {state:'valid',message:'Accepted — you may proceed.'};
}
function buildSixNames(distinctive,effectiveDescriptor,industryData,legalEnding){
  if(!distinctive||!distinctive.trim()||!effectiveDescriptor||!industryData)return[];
  const distinct=distinctive.trim().toUpperCase();
  const desc=effectiveDescriptor.toUpperCase().trim();
  const ending=(legalEnding===undefined||legalEnding===null)?'':String(legalEnding).trim();
  const compose=d=>[distinct,d,ending].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  const out=[];out.push(compose(desc));
  const used=new Set([desc]);
  const tryAdd=(candidate)=>{if(out.length>=6)return;if(!candidate)return;const u=candidate.toUpperCase();if(used.has(u))return;used.add(u);out.push(compose(u));};
  const embedded=findEmbeddedLibraryWords(desc,industryData);embedded.forEach(lib=>tryAdd(lib));
  for(const lib of industryData.descriptors){if(out.length>=6)break;tryAdd(lib);}
  return out.filter(Boolean);
}

function Btn({children,onClick,variant='primary',size='md',className='',type='button',disabled}){
  const base='inline-flex items-center justify-center gap-2.5 transition-all duration-300 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed rounded-sm font-semibold';
  const sizes={sm:'text-[12px] px-4 py-2.5',md:'text-[13px] px-6 py-3.5',lg:'text-[13.5px] px-8 py-4'};
  const variants={primary:'bg-gradient-to-br from-[#E8730F] to-[#F5A623] text-white hover:shadow-[0_0_25px_rgba(232,115,15,0.4)]',ghost:'border border-[#0A1F12]/20 text-[#0A1F12] hover:border-[#E8730F] hover:bg-[#E8730F]/5',ghostLt:'border border-white/20 text-white hover:bg-[#F5A623] hover:text-[#0A1F12]'};
  return <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
}

function Mark({size=36}){
  return <span className="rounded-full overflow-hidden flex-shrink-0" style={{width:size,height:size,boxShadow:'0 4px 12px -4px rgba(10,31,18,.5)',background:'#fff'}}>
    <img src="ChatGPT Image Feb 11, 2026, 04_49_20 PM.png" alt="StartEasy" style={{display:'block',width:'100%',height:'100%',objectFit:'cover'}}/>
  </span>;
}
function NotReg({tone='light'}){return <div style={{background:tone==='dark'?'rgba(255,255,255,.05)':'linear-gradient(135deg,#FFF4E0,#FFF9EE)',border:tone==='dark'?'1px solid rgba(245,166,35,.3)':'1px solid #E8730F',borderRadius:12,padding:'14px 18px',display:'flex',gap:14,alignItems:'flex-start'}}>
  <span style={{width:34,height:34,borderRadius:9,background:tone==='dark'?'rgba(245,166,35,.2)':'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-info-circle" style={{color:tone==='dark'?'#F5A623':'#fff',fontSize:14}}></i></span>
  <div><p style={{fontSize:12.5,fontWeight:800,letterSpacing:'.04em',color:tone==='dark'?'#F5A623':'#8A6828',marginBottom:4,textTransform:'uppercase'}}>We act on your behalf — we are not a regulator</p><p style={{fontSize:12.5,lineHeight:1.55,color:tone==='dark'?'rgba(255,255,255,.7)':'rgba(10,31,18,.7)'}}>StartEasy is an administrative services desk. We prepare, coordinate, submit and track filings with PACRA, ZRA, NAPSA, NHIMA, WCFCB, councils and sector regulators — but we are not a government authority, and we do not give legal, tax or audit advice. Where such advice is needed, we refer you to a qualified professional.</p></div>
</div>;}
const INP={width:'100%',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:6,padding:'12px 14px',fontSize:14,color:'#0A1F12',fontFamily:'inherit'};
function TIn({value,onChange,placeholder,type='text'}){return <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={INP}/>;}
function Head({eyebrow,title,sub,light,className='',style}){return <div className={className} style={style}>
  {eyebrow&&<div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20}}><span className="micro" style={{color:light?'#F5A623':'rgba(10,31,18,.5)'}}>{eyebrow}</span></div>}
  <h2 className="serif" style={{fontSize:'clamp(1.8rem,4.2vw,2.7rem)',lineHeight:1.1,color:light?'#fff':'#0A1F12'}}>{title}</h2>
  {sub&&<p style={{marginTop:20,fontSize:15.5,lineHeight:1.6,maxWidth:'42rem',color:light?'rgba(255,255,255,.5)':'rgba(10,31,18,.55)'}}>{sub}</p>}
</div>;}

function Payment({service,client,onClose,onDone}){
  const s=service;
  const sf=s.service?SF[s.service]:null;const og=s.ongoing?ONGOING[s.ongoing]:null;
  const amountDue=sf?sf.zm:og.zm;
  const receiptPrefix='SE-'+(s.code||'ADV');
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState(client.name||'');
  const [senderContact,setSenderContact]=useState(client.phone||client.email||'');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [cloudSaved,setCloudSaved]=useState(null);
  const [receiptNo,setReceiptNo]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [copied,setCopied]=useState('');
  const copyTxt=(t,k)=>{const done=()=>{setCopied(k);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);else done()};
  const buildMsg=(r,dt)=>['*STARTEASY — ENGAGEMENT FEE*','','*Ref:* '+r,'*Date:* '+dt,'','*Client:* '+client.name,'*Email:* '+client.email,'','*Engagement:*',(s.code||'ADV')+' — '+s.title,'','*Payment*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount: '+amountDue,'Sender: '+senderName,'Contact: '+senderContact,'TxID: '+userRef].join('\n');
  const confirm=async()=>{
    setErrorMsg('');
    if(!method){setErrorMsg('Select a payment method.');return}
    if(!senderName.trim()){setErrorMsg('Enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Enter the phone or email used.');return}
    if(!userRef.trim()){setErrorMsg('Enter your transaction reference.');return}
    if(!agree){setErrorMsg('Tick the confirmation box.');return}
    setSaving(true);
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const dt=new Date().toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const record = { ref:rcpt, clientName:client.name, clientEmail:client.email, clientPhone:client.phone||'', clientBusiness:client.business||'',
      serviceCode:s.code||'ADV', serviceTitle:s.title, serviceDesk:s.desk||'pacra',
      serviceClientDesc:s.clientDesc, serviceTimeline:s.timeline, serviceFee:sf?sf.zm:og.zm, serviceFeeLabel:sf?sf.label:og.label,
      whatsCovered:s.whatsCovered||[], wizardData:s._wizardData||null,
      amount:amountDue, method:PAYMENT_METHODS[method]?.label||method, senderName, senderContact, txRef:userRef, receiptDate:dt };
    const saved = await addPayment(record);
    setCloudSaved(saved ? 'ok' : 'fail');
    rememberMyRef(rcpt);
    trackEvent('payment_submit',{ref:rcpt,serviceCode:s.code,amount:amountDue});
    setReceiptNo(rcpt);
    setWhatsappUrl(waUrl(buildMsg(rcpt,dt)));
    setConfirmed(true);
    setSaving(false);
  };
  if(confirmed){
    return <div className="fadein">
      <div style={{background:'linear-gradient(135deg,#EAF7EE,#F0FBF4)',border:'2px solid #28A745',borderRadius:14,padding:'28px 24px',textAlign:'center'}}>

        <h4 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Service fee reference submitted</h4>
        <p style={{fontSize:13.5,color:'rgba(10,31,18,.7)',marginBottom:14}}>Reference: <strong>{receiptNo}</strong></p>
        <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:10,background:'#25D366',color:'#fff',padding:'13px 22px',borderRadius:10,fontSize:14,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Send reference on WhatsApp</a>

      </div>
    </div>;
  }
  const m=method?PAYMENT_METHODS[method]:null;
  return <div>
    <div style={{background:'linear-gradient(135deg,#0A1F12,#123A1F)',color:'#fff',borderRadius:14,padding:'22px 24px',marginBottom:20}}>
      <div style={{fontSize:11,fontWeight:800,letterSpacing:'1.8px',textTransform:'uppercase',color:'#F5A623',marginBottom:6}}>{sf?'Service Fee':'Ongoing Fee'}</div>
      <div className="serif" style={{fontSize:'clamp(2rem,4vw,2.5rem)',fontWeight:800,color:'#F5A623',lineHeight:1}}>{amountDue}</div>
      <div style={{fontSize:12.5,color:'rgba(255,255,255,.72)',marginTop:8}}>{s.title}</div>
    </div>
    <div className="paygrid">{Object.entries(PAYMENT_METHODS).map(([k,pm])=><button key={k} type="button" className={`pmc ${pm.cls} ${method===k?'sel':''}`} onClick={()=>setMethod(k)}>
      <div className="lg">{k==='airtel'?'airtel':k==='mtn'?'MTN':k==='bank'?<i className="fas fa-university"></i>:k==='paypal'?<i className="fab fa-paypal"></i>:<i className="fab fa-bitcoin"></i>}</div>
      <div className="nm">{pm.label}</div><div className="ds">{pm.sub}</div>

/* ============================================================
   ADMIN PORTAL — condensed
   ============================================================ */
function AdminPortal({onExit}){
  const [authed,setAuthed]=useState(false);
  const [authChecked,setAuthChecked]=useState(false);
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [signingIn,setSigningIn]=useState(false);
  const [pwErr,setPwErr]=useState('');
  const [payments,setPayments]=useState([]);
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('overview');
  const [review,setReview]=useState(null);
  const [note,setNote]=useState('');
  const [filter,setFilter]=useState('all');
  const checkIsAdmin = useCallback(async (user) => {
    if(!user || !firebaseReady) return false;
    try { const snap = await db.collection(SE_ADMINS).doc(user.uid).get(); return snap.exists; }
    catch(e) { return false; }
  },[]);
  useEffect(()=>{
    if(!firebaseReady){setAuthChecked(true);return}
    const unsub = auth.onAuthStateChanged(async user => {
      if(user){ const isAdmin = await checkIsAdmin(user); setAuthed(isAdmin); }
      else { setAuthed(false); }
      setAuthChecked(true);
    });
    return unsub;
  },[checkIsAdmin]);
  useEffect(()=>{
    if(!authed || !firebaseReady) return;
    const unsub = db.collection(SE_PAYMENTS).orderBy('submittedAt','desc').limit(500)
      .onSnapshot(snap=>{ setPayments(snap.docs.map(d=>({ id: d.id, ...d.data() }))); setLoading(false); }, err=>{ setLoading(false); });
    return unsub;
  },[authed]);
  useEffect(()=>{
    if(!authed || !firebaseReady) return;
    const unsub = db.collection(SE_EVENTS).orderBy('at','desc').limit(500)
      .onSnapshot(snap=>{ setEvents(snap.docs.map(d=>({ id: d.id, ...d.data() }))); });
    return unsub;
  },[authed]);
  const handleSignIn = async () => {
    setPwErr('');
    if(!email.trim() || !pw){ setPwErr('Enter your email and password.'); return; }
    setSigningIn(true);
    try {
      const res = await adminSignIn(email, pw);
      if(!res.ok){ setPwErr(res.error || 'Sign-in failed.'); return; }
      const user = auth.currentUser;
      if(!user){ setPwErr('Signed in but no session.'); return; }
      const isAdmin = await checkIsAdmin(user);
      if(!isAdmin){ await auth.signOut(); setPwErr('This account is not listed as an admin.'); return; }
      setAuthed(true);
    } catch(e) { setPwErr('Unexpected error.'); }
    finally { setSigningIn(false); }
  };
  const handleSignOut = async () => { await adminSignOut(); setAuthed(false); onExit(); };
  const setStatus=async(status)=>{
    if(!review)return;
    await updatePaymentStatus(review.ref,status,note||'');
    trackEvent('payment_reviewed',{ref:review.ref,status});
    setReview(null);setNote('');
  };
  if(!authChecked){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px'}}>
      <div style={{textAlign:'center',color:'#fff'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#F5A623'}}></i><p style={{marginTop:14,fontSize:13}}>Loading…</p></div>
    </div>;
  }
  if(!authed){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px'}}>
      <div style={{background:'#fff',borderRadius:14,padding:'34px 32px',maxWidth:440,width:'100%'}}>
        <Mark size={42}/>
        <h2 className="serif" style={{fontSize:20,fontWeight:800,color:'#0A1F12',marginTop:12,marginBottom:16}}>Admin Portal</h2>
        <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Email</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{width:'100%',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15,marginBottom:14}}/>
        <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Password</label>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSignIn()}} style={{width:'100%',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15}}/>
        {pwErr&&<div style={{marginTop:10,fontSize:12.5,color:'#B8564F'}}>{pwErr}</div>}
        <button onClick={handleSignIn} disabled={signingIn} style={{width:'100%',marginTop:20,padding:'14px 22px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,cursor:signingIn?'wait':'pointer'}}>{signingIn?'Signing in…':'Sign in'}</button>
        <button onClick={onExit} style={{width:'100%',marginTop:10,padding:'12px 20px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13.5,cursor:'pointer'}}>Cancel</button>
      </div>
    </div>;
  }
  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff'}}>
      <div style={{maxWidth:1240,margin:'0 auto',padding:'24px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>

      </div>
    </section>
    <section style={{background:'#fff',borderBottom:'1px solid rgba(10,31,18,.08)',padding:'0 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto',display:'flex',gap:6,overflowX:'auto'}}>
        {[['overview','Overview'],['payments','Payments']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} style={{padding:'16px',background:'none',border:'none',borderBottom:tab===k?'3px solid #E8730F':'3px solid transparent',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{l}</button>)}

function DeskDetail({deskId,go,onServiceClick,onWizard}){
  const desk=getDesk(deskId);
  const [choice,setChoice]=useState(null);
  useEffect(()=>{setChoice(null);window.scrollTo(0,0);trackEvent('page_view',{route:'desk',deskId})},[deskId]);
  if(!desk)return <div style={{padding:'80px 24px',textAlign:'center'}}><h2 className="serif">Desk not found</h2></div>;
  const selected=choice?desk.options.find(o=>o.v===choice):null;
  const askOnly=selected&&selected.services&&selected.services.length===0;
  return <div className="fadein" style={{background:'#F5FAF6'}}>
    <section style={{background:'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)',color:'#fff',position:'relative'}}>
      <div style={{maxWidth:1240,margin:'0 auto',padding:'48px 24px 40px'}}>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>
          <span style={{width:52,height:52,borderRadius:14,background:desk.color+'25',color:desk.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}><i className={`fas ${desk.icon}`}></i></span>
        </div>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,4.6vw,2.9rem)',lineHeight:1.08,marginBottom:12}}>{desk.title}</h1>
        <p style={{fontSize:15.5,lineHeight:1.7,color:'rgba(255,255,255,.7)',maxWidth:'46rem'}}>{desk.intro}</p>
      </div>
    </section>
    <section style={{maxWidth:1240,margin:'0 auto',padding:'40px 24px 0'}}><NotReg/></section>
    <section style={{maxWidth:1240,margin:'0 auto',padding:'48px 24px 32px'}}>
      <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',marginBottom:20}}>What are you trying to do?</h2>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {desk.options.map(o=><button key={o.v} onClick={()=>{if(o.wizard){onWizard(o.wizard)}else{setChoice(o.v)}}} className={`gtile ${choice===o.v?'sel':''}`}>
          <span className="ico"><i className={`fas ${o.wizard?'fa-wand-magic-sparkles':o.icon}`}></i></span>
          <h3>{o.t}</h3><p>{o.d}</p>
        </button>)}
      </div>
    </section>
    {choice&&selected&&!askOnly&&selected.services&&selected.services.length>0&&<section style={{maxWidth:1240,margin:'0 auto',padding:'0 24px 56px'}}>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {selected.services.map(key=>{const s=findServiceByKey(key);if(!s)return null;return <ServiceCard key={key} serviceKey={key} onClick={onServiceClick}/>})}
      </div>
    </section>}
    {choice&&askOnly&&<section style={{maxWidth:1240,margin:'0 auto',padding:'0 24px 56px'}}>
      <div style={{background:'linear-gradient(135deg,#0A1F12,#123A1F)',borderRadius:12,padding:'36px 32px',color:'#fff',textAlign:'center'}}>
        <h3 className="serif" style={{fontSize:24,color:'#fff',marginBottom:12}}>Talk to an officer first.</h3>
        <a href={waUrl('Hello StartEasy — I have a question about '+desk.title+'.')} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:10,padding:'14px 26px',background:'#25D366',color:'#fff',borderRadius:8,fontSize:14,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Chat with an officer</a>
      </div>
    </section>}
  </div>;
}

function ServicesPage({onServiceClick}){
  const [filter,setFilter]=useState('all');
  const [query,setQuery]=useState('');
  useEffect(()=>{trackEvent('page_view',{route:'services'});},[]);
  const filtered=ALL_SERVICES.filter(s=>{if(filter!=='all'&&s.desk!==filter)return false;if(!query.trim())return true;return (s.code+' '+s.title+' '+s.clientDesc).toLowerCase().includes(query.toLowerCase())});
  const handleClick=s=>{trackEvent('service_view',{code:s.code,title:s.title});onServiceClick(s)};
  return <div className="fadein" style={{background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff',padding:'48px 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto'}}>
        <span className="micro" style={{color:'#F5A623',display:'block',marginBottom:20}}>Service directory</span>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,5vw,3rem)',lineHeight:1.08,marginBottom:20}}>Every service StartEasy provides.</h1>
      </div>
    </section>
    <section style={{maxWidth:1240,margin:'0 auto',padding:'40px 24px 56px'}}>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:20,marginBottom:28}}>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search services…" className="inp"/>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:16}}>
          <button onClick={()=>setFilter('all')} style={{fontSize:12.5,fontWeight:600,padding:'8px 16px',borderRadius:99,cursor:'pointer',background:filter==='all'?'#0A1F12':'#fff',color:filter==='all'?'#fff':'rgba(10,31,18,.7)',border:filter==='all'?'none':'1px solid rgba(10,31,18,.12)'}}>All ({ALL_SERVICES.length})</button>
          {Object.values(DESKS).map(g=>{const count=ALL_SERVICES.filter(s=>s.desk===g.id).length;const on=filter===g.id;return <button key={g.id} onClick={()=>setFilter(g.id)} style={{fontSize:12.5,fontWeight:600,padding:'8px 16px',borderRadius:99,cursor:'pointer',background:on?g.color:'#fff',color:on?'#fff':'rgba(10,31,18,.7)',border:on?'none':'1px solid rgba(10,31,18,.12)'}}>{g.title} ({count})</button>})}
        </div>
      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(s=><ServiceCard key={s.key} serviceKey={s.key} onClick={handleClick}/>)}</div>
    </section>
  </div>;
}

  useEffect(()=>{trackEvent('page_view',{route:'about'});},[]);
  return <div className="fadein" style={{background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff',padding:'64px 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto'}}>
        <span className="micro" style={{color:'#F5A623',display:'block',marginBottom:20}}>About Us</span>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,5vw,3rem)',lineHeight:1.08,marginBottom:20}}>StartEasy Zambia</h1>
        <p style={{fontSize:15.5,lineHeight:1.7,color:'rgba(255,255,255,.6)',maxWidth:'52rem',marginBottom:28}}>A central hub that provides the tools, expertise, resources and services entrepreneurs need to turn ideas into functioning businesses. Helpful for finance, technology, marketing, and administrative support.</p>
        <NotReg tone="dark"/>

function FloatingAssistant(){
  const [open,setOpen]=useState(false);
  return <div className="fixed" style={{bottom:24,right:24,zIndex:100,display:'flex',flexDirection:'column',alignItems:'flex-end'}}>
    {open&&<div style={{marginBottom:14,width:'18rem',background:'#fff',borderRadius:10,boxShadow:'0 20px 60px rgba(0,0,0,.2)',padding:18}}>
      <p style={{fontSize:12.5,color:'rgba(10,31,18,.65)',marginBottom:14}}>Message us directly with what you are trying to do.</p>
      <a href={waUrl('Hello StartEasy — I need help choosing the right service.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Chat on WhatsApp</a>
    </div>}
    <button onClick={()=>setOpen(!open)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  </div>;
}

function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [wizardScope,setWizardScope]=useState(null);
  const [wizardSession,setWizardSession]=useState(0);
  const [serviceModal,setServiceModal]=useState(null);
  const [engagementService,setEngagementService]=useState(null);
  const [engagementClient,setEngagementClient]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);

  useEffect(()=>{
    getVisitor();
    const t = setTimeout(()=>{ trackEvent('visit',{ua:(navigator.userAgent||'').slice(0,120)}); }, 1200);
    return ()=>clearTimeout(t);
  },[]);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'});trackEvent('page_view',{route:r,arg:arg||null})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openWizard=useCallback(scope=>{setWizardScope(scope||null);setWizardSession(s=>s+1);trackEvent('wizard_start',{scope:scope||'auto'});go('wizard')},[go]);
  const proceedToEngagement=useCallback(s=>{setServiceModal(null);setTimeout(()=>setEngagementService(s),260)},[]);
  const agreedEngagement=useCallback(({client,service})=>{setEngagementClient({client,service});setEngagementService(null);setTimeout(()=>setPaymentOpen(true),280)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setEngagementClient(null),260)},[]);
  const handleServiceClick=useCallback(s=>{if(s.wizardEntry){openWizard(s.wizardScope);return}setServiceModal(s)},[openWizard]);
  const handleWizardOrder=useCallback(wizData=>{setEngagementService(wizData)},[]);

  const view=()=>{
    switch(route){
      case 'wizard': return <Wizard key={'wz'+wizardSession} initialScope={wizardScope} onExit={()=>go('home')} onOrderFormal={handleWizardOrder}/>;
      case 'venture': return <VenturePage go={go} onWizard={openWizard}/>;
      case 'orientation': return <OrientationPage go={go} onWizard={openWizard}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetail deskId={routeArg||'pacra'} go={go} onServiceClick={handleServiceClick} onWizard={openWizard}/>;
      case 'services': return <ServicesPage onServiceClick={handleServiceClick}/>;
      case 'track': return <TrackSubmission go={go}/>;
      case 'admin': return <AdminPortal onExit={()=>go('home')}/>;
      case 'pricing': return <PricingPage go={go}/>;
      case 'about': return <AboutPage/>;
      default: return <Home go={go} onResume={()=>openWizard(null)} onWizard={openWizard}/>;
    }
  };

  const hideChrome=route==='admin';
  return <div style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    {!hideChrome&&<Nav route={route} go={go}/>}
    <main style={{flex:1}}>{view()}</main>
    {!hideChrome&&<Footer go={go}/>}
    {!hideChrome&&<FloatingAssistant/>}
    {serviceModal&&<ServiceDetail service={serviceModal} onClose={()=>setServiceModal(null)} onProceed={proceedToEngagement} onWizard={openWizard}/>}
    {engagementService&&<Engagement service={engagementService} onClose={()=>setEngagementService(null)} onAgreed={agreedEngagement}/>}
    {paymentOpen&&engagementClient&&<Modal open={paymentOpen} onClose={closePayment} eyebrow="Engagement payment" maxWidth="52rem">
      <Payment service={engagementClient.service} client={engagementClient.client} onClose={closePayment} onDone={()=>{clearSnapshot();closePayment();setTimeout(()=>go('home'),320)}}/>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
