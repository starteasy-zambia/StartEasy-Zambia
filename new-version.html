@keyframes marqueeScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.marquee-mask{
  position: relative;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
}
.marquee-track{
  display: flex;
  width: max-content;
  animation: marqueeScroll 45s linear infinite;
  will-change: transform;
}
.marquee-mask:hover .marquee-track{
  animation-play-state: paused;
}
@media (prefers-reduced-motion: reduce){
  .marquee-track{ animation: none !important; }
}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const ADMIN_WHATSAPP='260768526191';

function isMobile(){return typeof navigator!=='undefined'&&/android|iphone|ipad|ipod|mobile/i.test((navigator.userAgent||'').toLowerCase());}
function waUrl(msg,p){const phone=p||ADMIN_WHATSAPP;const e=encodeURIComponent(msg);return isMobile()?'whatsapp://send?phone='+phone+'&text='+e:'https://wa.me/'+phone+'?text='+e;}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
  authDomain: "starteasy-zambia.firebaseapp.com",
  projectId: "starteasy-zambia",
  storageBucket: "starteasy-zambia.firebasestorage.app",
  messagingSenderId: "54136399237",
  appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec",

};

let db = null, auth = null, firebaseReady = false;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
  firebaseReady = true;

const MY_REFS_KEY='starteasy.myrefs.v1', VISITOR_KEY='starteasy.visitor.v1';

function timeAgo(ts){if(!ts)return '';const s=Math.max(0,Math.floor((Date.now()-ts)/1000));if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';const d=Math.floor(s/86400);return d+' day'+(d>1?'s':'')+' ago';}
function getVisitor(){try{let v=JSON.parse(localStorage.getItem(VISITOR_KEY)||'null');if(!v){v={id:'v_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),firstSeen:Date.now(),visits:0,lastSeen:Date.now()};}v.visits=(v.visits||0)+1;v.lastSeen=Date.now();localStorage.setItem(VISITOR_KEY,JSON.stringify(v));return v;}catch(e){return {id:'anon_'+Date.now().toString(36),firstSeen:Date.now(),visits:1,lastSeen:Date.now()}}}
function readVisitor(){try{return JSON.parse(localStorage.getItem(VISITOR_KEY)||'null')}catch(e){return null}}

async function addPayment(rec){
  if(!firebaseReady) return null;
  const record = { ...rec, status: 'under_review', submittedAt: Date.now(),
    history: [{ status: 'under_review', at: Date.now(), note: 'Payment reference received. Awaiting officer verification.' }] };
  try { await db.collection(SE_PAYMENTS).doc(rec.ref).set(record); return record; } catch(e) { return null; }
}
async function findPaymentByRef(ref){
  if(!firebaseReady || !ref) return null;
  try { const key = ref.toUpperCase().trim(); const snap = await db.collection(SE_PAYMENTS).doc(key).get(); return snap.exists ? { id: snap.id, ...snap.data() } : null; } catch(e) { return null; }
}
async function updatePaymentStatus(ref, status, note){
  if(!firebaseReady) return null;
  try { const docRef = db.collection(SE_PAYMENTS).doc(ref); const snap = await docRef.get(); if(!snap.exists) return null;
    const cur = snap.data(); const history = [...(cur.history||[]), { status, at: Date.now(), note: note||'' }];
    await docRef.update({ status, adminNote: note||'', reviewedAt: Date.now(), history }); return { id: ref, ...cur, status, adminNote: note||'', history };
  } catch(e) { return null; }
}
function trackEvent(type, payload){ if(!firebaseReady) return; try { const visitor = readVisitor(); db.collection(SE_EVENTS).add({ type, at: Date.now(), visitorId: visitor ? visitor.id : null, ...(payload || {}) }).catch(()=>{}); } catch(e) {} }
async function clearAllEvents(){ if(!firebaseReady) return false; try { const snap = await db.collection(SE_EVENTS).limit(500).get(); const batch = db.batch(); snap.docs.forEach(d => batch.delete(d.ref)); await batch.commit(); return true; } catch(e) { return false; } }
async function adminSignIn(email, pw){
  if(!firebaseReady) return { ok:false, error:'Authentication service unavailable.' };
  try { const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('__timeout__')), 15000));
    await Promise.race([ auth.signInWithEmailAndPassword(email.trim(), pw), timeout ]); return { ok:true };
  } catch(e) { const code = e && e.code ? e.code : ''; const msg = e && e.message ? e.message : '';
    if(msg === '__timeout__') return { ok:false, error:'Sign-in timed out.' };
    if(code === 'auth/wrong-password' || code === 'auth/invalid-credential') return { ok:false, error:'Incorrect email or password.' };
    if(code === 'auth/user-not-found') return { ok:false, error:'No account with that email.' };
    return { ok:false, error: 'Sign-in failed.' };
  }
}
async function adminSignOut(){ try { await auth.signOut(); } catch(e) {} }

const SF={
  micro:{zm:'K25',label:'Service Fee · Micro'},

function resolveLegalEnding(structure,choice){
  if(!structure)return '';
  if(structure.endingRule==='none')return '';
  if(structure.endingRule==='choice'){if(choice==='NONE')return '';if(choice==='UNLIMITED')return 'UNLIMITED';return 'LIMITED';}
  return structure.endings[0]||'';
}
function analyseName(name){
  const n=(name||'').trim().toLowerCase();
  if(!n)return{score:0,issues:[]};
  const issues=[];let score=100;
  if(n.length<3){score-=40;issues.push({level:'crit',text:'Name is too short to be distinctive.'})}
  if(/^\d+$/.test(n)){score-=40;issues.push({level:'crit',text:'A name of only numbers is unlikely.'})}
  score=Math.max(0,Math.min(100,Math.round(score)));
  return{score,issues};
}
function buildSixNames(distinctive,descriptor,industryData,legalEnding){
  if(!distinctive||!descriptor||!industryData)return[];
  const distinct=distinctive.trim().toUpperCase();
  const desc=descriptor.toUpperCase().trim();
  const ending=(legalEnding||'').trim();
  const compose=d=>[distinct,d,ending].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  const out=[];out.push(compose(desc));
  const used=new Set([desc]);
  for(const lib of industryData.descriptors){if(out.length>=6)break;const u=lib.toUpperCase();if(used.has(u))continue;used.add(u);out.push(compose(u));}
  return out.filter(Boolean);
}

}

function Payment({service,client,onClose,onDone}){
  const s=service;
  const sf=s.service?SF[s.service]:null;const og=s.ongoing?ONGOING[s.ongoing]:null;
  const amountDue=sf?sf.zm:og.zm;

  const buildMsg=r=>['*STARTEASY — FEE SUBMITTED*','','*Ref:* '+r,'*Client:* '+client.name,'*Email:* '+client.email,'','*Engagement:* '+s.title,'','*Payment:*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount: '+amountDue,'Sender: '+senderName,'Contact: '+senderContact,'TxID: '+userRef].join('\n');
  const confirm=async()=>{
    setErrorMsg('');
    if(!method||!senderName.trim()||!senderContact.trim()||!userRef.trim()||!agree){setErrorMsg('Please complete all fields.');return}
    setSaving(true);
    const rcpt='SE-'+(s.code||'ADV')+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    await addPayment({ ref:rcpt, clientName:client.name, clientEmail:client.email, clientPhone:client.phone||'', clientBusiness:client.business||'',
      serviceCode:s.code||'ADV', serviceTitle:s.title, serviceDesk:s.desk||'pacra',
      serviceClientDesc:s.clientDesc, serviceTimeline:s.timeline, serviceFee:sf?sf.zm:og.zm, serviceFeeLabel:sf?sf.label:og.label,
      whatsCovered:s.whatsCovered||[], amount:amountDue, method:PAYMENT_METHODS[method]?.label||method, senderName, senderContact, txRef:userRef });
    rememberMyRef(rcpt);
    trackEvent('payment_submit',{ref:rcpt,serviceCode:s.code,amount:amountDue});
    setReceiptNo(rcpt);
    setWhatsappUrl(waUrl(buildMsg(rcpt)));
    setConfirmed(true);
    setSaving(false);

        <button type="button" onClick={onDone} style={{display:'block',margin:'18px auto 0',padding:'12px 24px',border:'1px solid rgba(10,31,18,.2)',background:'#fff',borderRadius:8,fontSize:13.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Close and return home</button>
      </div>
    </div>;
  }
  const m=method?PAYMENT_METHODS[method]:null;
  return <div>
    <div style={{background:'linear-gradient(135deg,#0A1F12,#123A1F)',color:'#fff',borderRadius:14,padding:'22px 24px',marginBottom:20}}>

function Wizard({initialScope,onExit,onOrderFormal}){
  const [scope,setScope]=useState(initialScope||null);

  const [primaryActivity,setPrimaryActivity]=useState('');

  const [distinctive,setDistinctive]=useState('');
  const [descriptor,setDescriptor]=useState('');

  const stepsArr=useMemo(()=>['scope','idea','structure','activity','industry','descriptor','distinctive','report'],[]);
  const current=stepsArr[step];
  const industryData=industry?INDUSTRIES.find(i=>i.key===industry):null;
  const structureData=structure?STRUCTURES.find(x=>x.key===structure):null;
  const names=useMemo(()=>buildSixNames(distinctive,descriptor,industryData,resolveLegalEnding(structureData,'')),[distinctive,descriptor,industryData,structureData]);

  const order=()=>{onOrderFormal({code:'ADV',desk:'pacra',title:'Business Structure & Name Advisory',clientDesc:'Self-service wizard completed.',whatsCovered:['Wizard answers','Industry classification','Legal structure recommendation','Six-name proposal','Formal report'],service:'micro',timeline:'Delivered within 1 hour',_wizardData:{scope,idea,primaryActivity,industry:industryData,structure:structureData,descriptor,distinctive,names}});};
  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6',paddingBottom:60}}>
    <section style={{background:'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)',color:'#fff',padding:'40px 24px 32px'}}>
      <div style={{maxWidth:1240,margin:'0 auto'}}>
        <button onClick={onExit} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',fontSize:11.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginBottom:20}}>← Back to platform</button>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,4.6vw,2.9rem)',lineHeight:1.08,marginBottom:16}}>Business Structure &amp; Name Advisory</h1>
        <p style={{fontSize:15.5,lineHeight:1.7,color:'rgba(255,255,255,.65)',maxWidth:720}}>Answer a few guided questions. Assessment Report Fee — K25.</p>
      </div>

    <section style={{maxWidth:900,margin:'0 auto',padding:'40px 24px'}}>
      <div className="fadein" key={current}>
        {current==='scope'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>What would you like help with?</h2>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {[{v:'structure',t:'Help me choose the right structure'},{v:'names',t:'Help me prepare names for clearance'},{v:'both',t:'Both — full advisory'}].map(o=><button key={o.v} onClick={()=>setScope(o.v)} className={`gtile ${scope===o.v?'sel':''}`}><h3>{o.t}</h3></button>)}
          </div>
        </div>}
        {current==='idea'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>What exactly will the business do?</h2><textarea value={idea} onChange={e=>setIdea(e.target.value)} rows={5} placeholder="Describe the business." className="inp"/></div>}
        {current==='structure'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Which structure?</h2><select value={structure||''} onChange={e=>setStructure(e.target.value||null)} className="inp-select"><option value="">Choose…</option>{STRUCTURES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></div>}
        {current==='activity'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Primary activity?</h2><select value={primaryActivity} onChange={e=>setPrimaryActivity(e.target.value)} className="inp-select"><option value="">Choose…</option>{PRIMARY_ACTIVITIES.map(a=><option key={a} value={a}>{a}</option>)}</select></div>}
        {current==='industry'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Which industry?</h2><div style={{display:'grid',gap:10,gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))'}}>{INDUSTRIES.map(i=><button key={i.key} onClick={()=>setIndustry(i.key)} className={`iti ${industry===i.key?'sel':''}`}><h4>{i.label}</h4><p>{i.blurb}</p></button>)}</div></div>}
        {current==='descriptor'&&industryData&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Descriptive word?</h2><select value={descriptor} onChange={e=>setDescriptor(e.target.value)} className="inp-select"><option value="">Choose…</option>{industryData.descriptors.map(d=><option key={d} value={d}>{d}</option>)}</select></div>}
        {current==='distinctive'&&<div><h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Distinctive name?</h2><input value={distinctive} onChange={e=>setDistinctive(e.target.value.toUpperCase())} placeholder="e.g. JIRANIHOOD" className="inp" style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.5rem',fontWeight:700}}/></div>}
        {current==='report'&&<div>
          <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.4vw,2rem)',color:'#0A1F12',marginBottom:20}}>Your assessment is ready.</h2>
          <div className="rpt"><h5>Profile</h5>
            {idea&&<div className="row"><span className="k">Idea</span><span className="v">{idea}</span></div>}
            {industryData&&<div className="row"><span className="k">Industry</span><span className="v">{industryData.label}</span></div>}
            {structureData&&<div className="row"><span className="k">Structure</span><span className="v">{structureData.label}</span></div>}
            {names.length>0&&<><h5>Six-name proposal</h5><ol className="names">{names.map((n,i)=><li key={i}><span className="nm">{n}</span></li>)}</ol></>}
          </div>
          <button onClick={order} style={{marginTop:22,padding:'15px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Order formal report — K25</button>
        </div>}
        {current!=='report'&&<div style={{display:'flex',gap:12,marginTop:32}}>
          {step>0&&<button onClick={back} style={{padding:'13px 22px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:13.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>← Back</button>}
          <button onClick={next} disabled={!can()} style={{flex:1,padding:'13px 24px',background:can()?'linear-gradient(135deg,#E8730F,#F5A623)':'rgba(10,31,18,.1)',color:can()?'#fff':'rgba(10,31,18,.4)',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:can()?'pointer':'not-allowed',fontFamily:'inherit'}}>Continue <Arrow/></button>
        </div>}
      </div>
    </section>
  </div>;
}

function AdminPortal({onExit}){
  const [authed,setAuthed]=useState(false);
  const [authChecked,setAuthChecked]=useState(false);
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [signingIn,setSigningIn]=useState(false);
  const [pwErr,setPwErr]=useState('');
  const [payments,setPayments]=useState([]);
  const [loading,setLoading]=useState(true);
  const [review,setReview]=useState(null);
  const [note,setNote]=useState('');
  const [filter,setFilter]=useState('all');
  const checkIsAdmin = useCallback(async (user) => {
    if(!user || !firebaseReady) return false;
    try { const snap = await db.collection(SE_ADMINS).doc(user.uid).get(); return snap.exists; } catch(e) { return false; }
  },[]);
  useEffect(()=>{
    if(!firebaseReady){setAuthChecked(true);return}
    const unsub = auth.onAuthStateChanged(async user => {
      if(user){ const isAdmin = await checkIsAdmin(user); setAuthed(isAdmin); } else { setAuthed(false); }
      setAuthChecked(true);
    });
    return unsub;
  },[checkIsAdmin]);
  useEffect(()=>{
    if(!authed || !firebaseReady) return;
    const unsub = db.collection(SE_PAYMENTS).orderBy('submittedAt','desc').limit(500)
      .onSnapshot(snap=>{ setPayments(snap.docs.map(d=>({ id: d.id, ...d.data() }))); setLoading(false); }, err=>{ setLoading(false); });
    return unsub;
  },[authed]);
  const handleSignIn = async () => {
    setPwErr('');
    if(!email.trim() || !pw){ setPwErr('Enter email and password.'); return; }
    setSigningIn(true);
    try {
      const res = await adminSignIn(email, pw);
      if(!res.ok){ setPwErr(res.error || 'Sign-in failed.'); return; }
      const user = auth.currentUser;
      if(!user){ setPwErr('No session.'); return; }
      const isAdmin = await checkIsAdmin(user);
      if(!isAdmin){ await auth.signOut(); setPwErr('Not an admin.'); return; }
      setAuthed(true);
    } catch(e) { setPwErr('Unexpected error.'); }
    finally { setSigningIn(false); }
  };
  const handleSignOut = async () => { await adminSignOut(); setAuthed(false); onExit(); };
  const setStatus=async(status)=>{ if(!review)return; await updatePaymentStatus(review.ref,status,note||''); setReview(null);setNote(''); };
  if(!authChecked){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#F5A623'}}></i>
    </div>;
  }
  if(!authed){
    return <div className="fadein" style={{minHeight:'100vh',background:'linear-gradient(135deg,#0A1F12,#123A1F)',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px'}}>

        <Mark size={42}/>
        <h2 className="serif" style={{fontSize:20,fontWeight:800,marginTop:12,marginBottom:16}}>Admin Portal</h2>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" style={{width:'100%',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15,marginBottom:14}}/>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSignIn()}} placeholder="Password" style={{width:'100%',border:'2px solid rgba(10,31,18,.12)',borderRadius:10,padding:'14px 18px',fontSize:15}}/>
        {pwErr&&<div style={{marginTop:10,fontSize:12.5,color:'#B8564F'}}>{pwErr}</div>}
        <button onClick={handleSignIn} disabled={signingIn} style={{width:'100%',marginTop:20,padding:'14px 22px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,cursor:'pointer'}}>{signingIn?'Signing in…':'Sign in'}</button>
        <button onClick={onExit} style={{width:'100%',marginTop:10,padding:'12px 20px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13.5,cursor:'pointer'}}>Cancel</button>
      </div>
    </div>;
  }
  return <div className="fadein" style={{minHeight:'100vh',background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff',padding:'24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}><Mark size={42}/><div className="serif" style={{fontSize:24,fontWeight:800}}>Admin Portal</div></div>
        <button onClick={handleSignOut} style={{padding:'10px 18px',background:'rgba(184,86,79,.15)',color:'#FFB4A8',border:'1px solid rgba(184,86,79,.35)',borderRadius:8,fontSize:12.5,fontWeight:700,cursor:'pointer'}}>Sign out</button>
      </div>
    </section>
    <section style={{maxWidth:1240,margin:'0 auto',padding:'32px 24px'}}>
      {loading?<div style={{textAlign:'center',padding:'80px 24px'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>:<div>
        <h2 className="serif" style={{fontSize:'clamp(1.5rem,3.2vw,2rem)',color:'#0A1F12',marginBottom:20}}>Payment queue</h2>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>
          {[['all','All'],['under_review','Under review'],['approved','Approved'],['reverted','Reverted'],['declined','Declined']].map(([k,l])=>
            <button key={k} onClick={()=>setFilter(k)} style={{padding:'8px 14px',borderRadius:99,cursor:'pointer',fontSize:12,fontWeight:700,border:filter===k?'none':'1px solid rgba(10,31,18,.12)',background:filter===k?'#0A1F12':'#fff',color:filter===k?'#fff':'rgba(10,31,18,.7)',fontFamily:'inherit'}}>{l}</button>

          <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:820}}>

            </tr>)}</tbody>
          </table></div>
        </div>
      </div>}

function ServiceCard({serviceKey,onClick}){
  const s=findServiceByKey(serviceKey);
  if(!s)return null;
  const desk=getDesk(s.desk);
  const sf=s.service?SF[s.service]:null;
  const og=s.ongoing?ONGOING[s.ongoing]:null;
  const fee=sf?sf.zm:og.zm;

  return <button onClick={()=>onClick(s)} className="svc" style={{'--accent':desk.color}}>

  </div>;
}

function ServicesPage({onServiceClick}){
  const [filter,setFilter]=useState('all');
  const [query,setQuery]=useState('');
  useEffect(()=>{trackEvent('page_view',{route:'services'});},[]);
  const filtered=ALL_SERVICES.filter(s=>{if(filter!=='all'&&s.desk!==filter)return false;if(!query.trim())return true;return (s.code+' '+s.title+' '+s.clientDesc).toLowerCase().includes(query.toLowerCase())});
  const handleClick=s=>{trackEvent('service_view',{code:s.code,title:s.title});onServiceClick(s)};
  return <div className="fadein" style={{background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff',padding:'48px 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto'}}>
        <span className="micro" style={{color:'#F5A623',display:'block',marginBottom:20}}>Service directory</span>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,5vw,3rem)',lineHeight:1.08,marginBottom:20}}>Every service StartEasy provides.</h1>
      </div>
    </section>
    <section style={{maxWidth:1240,margin:'0 auto',padding:'40px 24px 56px'}}>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:20,marginBottom:28}}>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search services — e.g. EIZ, NCC, TPIN, licence…" className="inp"/>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:16}}>
          <button onClick={()=>setFilter('all')} style={{fontSize:12.5,fontWeight:600,padding:'8px 16px',borderRadius:99,cursor:'pointer',background:filter==='all'?'#0A1F12':'#fff',color:filter==='all'?'#fff':'rgba(10,31,18,.7)',border:filter==='all'?'none':'1px solid rgba(10,31,18,.12)',fontFamily:'inherit'}}>All ({ALL_SERVICES.length})</button>
          {Object.values(DESKS).map(g=>{const count=ALL_SERVICES.filter(s=>s.desk===g.id).length;const on=filter===g.id;return <button key={g.id} onClick={()=>setFilter(g.id)} style={{fontSize:12.5,fontWeight:600,padding:'8px 16px',borderRadius:99,cursor:'pointer',background:on?g.color:'#fff',color:on?'#fff':'rgba(10,31,18,.7)',border:on?'none':'1px solid rgba(10,31,18,.12)',fontFamily:'inherit'}}>{g.title} ({count})</button>})}
        </div>
      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(s=><ServiceCard key={s.key} serviceKey={s.key} onClick={handleClick}/>)}</div>
    </section>
  </div>;
}

function PricingPage(){
  useEffect(()=>{trackEvent('page_view',{route:'pricing'});},[]);
  return <div className="fadein" style={{background:'#F5FAF6',padding:'56px 24px'}}>
    <div style={{maxWidth:1240,margin:'0 auto'}}>
      <Head eyebrow="Fee structure" title="Service fees and ongoing fees — clear from the start." style={{marginBottom:32,maxWidth:'48rem'}}/>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" style={{marginBottom:48}}>
        {Object.entries(SF).map(([k,f])=><div key={k} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:24,borderTopWidth:4,borderTopColor:'#E8730F'}}>
          <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>{f.label}</div>
          <div className="serif" style={{fontSize:28,fontWeight:800,color:'#E8730F',lineHeight:1}}>{f.zm}</div>
        </div>)}
      </div>
      <h3 className="serif" style={{fontSize:'clamp(1.4rem,3vw,1.9rem)',color:'#0A1F12',marginBottom:20}}>Ongoing Administrative Services Fee</h3>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        {Object.entries(ONGOING).map(([k,f])=><div key={k} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:24,borderTopWidth:4,borderTopColor:'#0E7C7B'}}>
          <div style={{fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',fontWeight:800,color:'#0E7C7B',marginBottom:10}}>{f.label}</div>
          <div className="serif" style={{fontSize:28,fontWeight:800,color:'#0A1F12',lineHeight:1}}>{f.zm}/mo</div>
        </div>)}
      </div>
    </div>
  </div>;
}

function AboutPage(){
  useEffect(()=>{trackEvent('page_view',{route:'about'});},[]);
  return <div className="fadein" style={{background:'#F5FAF6'}}>
    <section style={{background:'#0A1F12',color:'#fff',padding:'64px 24px'}}>
      <div style={{maxWidth:1240,margin:'0 auto'}}>
        <span className="micro" style={{color:'#F5A623',display:'block',marginBottom:20}}>About Us</span>
        <h1 className="serif" style={{fontSize:'clamp(1.9rem,5vw,3rem)',lineHeight:1.08,marginBottom:20}}>StartEasy Zambia</h1>
        <p style={{fontSize:15.5,lineHeight:1.7,color:'rgba(255,255,255,.6)',maxWidth:'52rem',marginBottom:28}}>A central hub that provides the tools, expertise, resources and services entrepreneurs need to turn ideas into functioning businesses.</p>
        <NotReg tone="dark"/>
      </div>
    </section>
  </div>;
}

function FloatingAssistant(){
  const [open,setOpen]=useState(false);
  return <div className="fixed" style={{bottom:24,right:24,zIndex:100,display:'flex',flexDirection:'column',alignItems:'flex-end'}}>
    {open&&<div style={{marginBottom:14,width:'18rem',background:'#fff',borderRadius:10,boxShadow:'0 20px 60px rgba(0,0,0,.2)',padding:18}}>
      <p style={{fontSize:12.5,color:'rgba(10,31,18,.65)',marginBottom:14}}>Message us directly with what you are trying to do.</p>
      <a href={waUrl('Hello StartEasy — I need help choosing the right service.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Chat on WhatsApp</a>
    </div>}
    <button onClick={()=>setOpen(!open)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  </div>;
}

function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [wizardScope,setWizardScope]=useState(null);
  const [wizardSession,setWizardSession]=useState(0);
  const [serviceModal,setServiceModal]=useState(null);
  const [engagementService,setEngagementService]=useState(null);
  const [engagementClient,setEngagementClient]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);

  useEffect(()=>{
    getVisitor();
    const t = setTimeout(()=>{ trackEvent('visit',{ua:(navigator.userAgent||'').slice(0,120)}); }, 1200);
    return ()=>clearTimeout(t);
  },[]);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'});trackEvent('page_view',{route:r,arg:arg||null})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openWizard=useCallback(scope=>{setWizardScope(scope||null);setWizardSession(s=>s+1);trackEvent('wizard_start',{scope:scope||'auto'});go('wizard')},[go]);
  const proceedToEngagement=useCallback(s=>{setServiceModal(null);setTimeout(()=>setEngagementService(s),260)},[]);
  const agreedEngagement=useCallback(({client,service})=>{setEngagementClient({client,service});setEngagementService(null);setTimeout(()=>setPaymentOpen(true),280)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setEngagementClient(null),260)},[]);
  const handleServiceClick=useCallback(s=>{if(s.wizardEntry){openWizard(s.wizardScope);return}setServiceModal(s)},[openWizard]);
  const handleWizardOrder=useCallback(wizData=>{setEngagementService(wizData)},[]);

  const view=()=>{
    switch(route){
      case 'wizard': return <Wizard key={'wz'+wizardSession} initialScope={wizardScope} onExit={()=>go('home')} onOrderFormal={handleWizardOrder}/>;
      case 'venture': return <VenturePage go={go} onWizard={openWizard}/>;
      case 'orientation': return <OrientationPage go={go}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetail deskId={routeArg||'pacra'} go={go} onServiceClick={handleServiceClick} onWizard={openWizard}/>;
      case 'services': return <ServicesPage onServiceClick={handleServiceClick}/>;
      case 'track': return <TrackSubmission go={go}/>;
      case 'admin': return <AdminPortal onExit={()=>go('home')}/>;
      case 'pricing': return <PricingPage/>;
      case 'about': return <AboutPage/>;
      default: return <Home go={go} onResume={()=>openWizard(null)}/>;
    }
  };

  const hideChrome=route==='admin';
  return <div style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    {!hideChrome&&<Nav route={route} go={go}/>}
    <main style={{flex:1}}>{view()}</main>
    {!hideChrome&&<Footer go={go}/>}
    {!hideChrome&&<FloatingAssistant/>}
    {serviceModal&&<ServiceDetail service={serviceModal} onClose={()=>setServiceModal(null)} onProceed={proceedToEngagement} onWizard={openWizard}/>}
    {engagementService&&<Engagement service={engagementService} onClose={()=>setEngagementService(null)} onAgreed={agreedEngagement}/>}
    {paymentOpen&&engagementClient&&<Modal open={paymentOpen} onClose={closePayment} eyebrow="Engagement payment" maxWidth="52rem">
      <Payment service={engagementClient.service} client={engagementClient.client} onClose={closePayment} onDone={()=>{clearSnapshot();closePayment();setTimeout(()=>go('home'),320)}}/>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
